<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kavram Sınıflandırma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            --cream-bg: #F8FAFC;
            --paper-grid: rgba(22, 163, 74, 0.08); /* Yeşil Grid */
            
            /* Fen Bilimleri Yeşil Paleti */
            --primary-main: #16A34A; /* Green 600 */
            --primary-dark: #14532D; /* Green 900 */
            --primary-soft: #BBF7D0; /* Green 200 */
            --warm-grey: #334155;
            --drop-bg: #F1F5F9;
            
            /* Başarı / Hata Renkleri */
            --success-green: #10B981;
            --error-red: #EF4444;
            --warning-orange: #F59E0B;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #030712; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; color: var(--warm-grey);
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }

        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        *::-webkit-scrollbar { display: none !important; }

        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--cream-bg); 
            background-image: linear-gradient(var(--paper-grid) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--paper-grid) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border-top: 6px solid var(--primary-main);
        }

        #scale-container::before {
            content: ''; position: absolute; top: -20%; left: -20%; width: 150%; height: 150%;
            background: radial-gradient(circle, rgba(187, 247, 208, 0.2) 0%, transparent 60%);
            z-index: 0; pointer-events: none;
        }

        .header {
            padding: 15px 40px 0 40px; height: 80px;
            display: flex; justify-content: space-between; align-items: start;
            flex-shrink: 0; z-index: 10;
        }

        .instruction-container { flex: 1; padding: 0; display: flex; flex-direction: column; justify-content: center; height: 100%;}
        .instruction-text { font-size: 15px; line-height: 1.4; font-weight: 900; color: var(--primary-dark); text-align: left; text-transform: uppercase; letter-spacing: 0.5px;}
        .sub-instruction { font-size: 12.5px; font-weight: 600; color: #64748b; margin-top: 2px; }
        .logo-right-container { width: 75px; height: 75px; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; margin-left: 20px; margin-top: -10px; }

        .content-wrapper {
            display: flex; flex-direction: row; flex: 1; padding: 0px 40px 15px 40px; gap: 20px; height: calc(540px - 80px);
            z-index: 10; position: relative;
        }

        /* --- SOL PANEL: KELİME HAVUZU --- */
        .left-panel {
            width: 250px !important; display: flex; flex-direction: column; gap: 8px; justify-content: flex-start;
            background: rgba(255, 255, 255, 0.7); border: 2px solid rgba(22, 163, 74, 0.15); border-radius: 16px;
            padding: 15px; box-shadow: inset 0 0 15px rgba(0,0,0,0.02); overflow-y: auto;
        }

        .pool-title { font-size: 13.5px; font-weight: 900; color: var(--primary-main); text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px;}
        
        .pool-slot { width: 100%; height: 50px; position: relative; flex-shrink: 0;}
        .placeholder-card { width: 100%; height: 100%; border: 2px dashed #cbd5e1; border-radius: 10px; background: rgba(241, 245, 249, 0.5); }
        
        /* Sürüklenebilir Kartlar */
        .draggable-card {
            position: absolute; width: 100%; height: 100%; background: white;
            border: 2px solid var(--primary-main); border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800; cursor: grab; box-shadow: 0 4px 6px rgba(22, 163, 74, 0.1);
            z-index: 100; touch-action: none; text-align: center; padding: 0 10px;
            line-height: 1.2; color: var(--primary-dark);
        }
        
        .draggable-card.dragging { cursor: grabbing; box-shadow: 0 12px 25px rgba(0,0,0,0.2); z-index: 1000 !important; transition: none; transform: scale(1.03) rotate(-1deg); }
        .draggable-card.selected { border-color: var(--warning-orange); background: #fffbeb; }

        .draggable-card.correct-state { border-color: var(--success-green) !important; background: #f0fdf4 !important; color: #065f46 !important; pointer-events: none;}
        .draggable-card.incorrect-state { border-color: var(--error-red) !important; background: #fef2f2 !important; color: #991b1b !important; animation: shake 0.4s ease-in-out;}
        .draggable-card.disabled { pointer-events: none; opacity: 0.7;}

        /* Drop Zone İçindeki Kartlar */
        .drop-zone .draggable-card { position: relative; margin: 4px; width: calc(100% - 8px); }

        /* --- SAĞ PANEL: HEDEF KUTULAR VE KONTROL --- */
        .right-panel {
            flex: 1; display: flex; flex-direction: column; gap: 15px; justify-content: space-between; overflow: hidden;
        }

        .drop-zones-area {
            display: flex; gap: 15px; flex: 1; min-height: 0;
        }

        .drop-zone-wrapper {
            flex: 1; display: flex; flex-direction: column;
            background: white; border-radius: 16px; overflow: hidden;
            border: 3px solid #E2E8F0; box-shadow: 0 6px 15px rgba(0,0,0,0.03);
            transition: all 0.2s; position: relative;
        }
        .drop-zone-wrapper.drag-over { border-color: var(--primary-main); transform: scale(1.02); box-shadow: 0 10px 25px rgba(22, 163, 74, 0.15);}

        .drop-header {
            background: #F8FAFC; padding: 12px 10px; text-align: center;
            font-size: 15px; font-weight: 900; color: var(--primary-dark); border-bottom: 2px solid #E2E8F0;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        
        .drop-header-icon {
            width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white;
        }

        .drop-zone {
            flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 8px;
            background: var(--drop-bg); overflow-y: auto; align-items: center;
            /* Scrollbar Stili */
            scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent;
        }
        .drop-zone::-webkit-scrollbar { width: 4px; }
        .drop-zone::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        .control-panel { flex-shrink: 0; display: flex; justify-content: flex-end; align-items: center; height: 50px;}
        
        .message-box { font-size: 12px; font-weight: 800; padding: 8px 16px; border-radius: 8px; display: none; line-height: 1.4; flex: 1; margin-right: 20px;}
        .msg-success { background: #d1fae5; color: #065f46; border: 1px solid #10B981;}
        .msg-error { background: #fef2f2; color: #991b1b; border: 1px solid #EF4444;}

        .btn-action {
            background: var(--primary-main); color: white; font-size: 15px; font-weight: 900;
            padding: 12px 30px; border-radius: 12px; transition: 0.2s; cursor: pointer; display: none; min-width: 200px;
            text-align: center; border: none; box-shadow: 0 6px 15px rgba(22, 163, 74, 0.25); letter-spacing: 1px;
        }
        .btn-action:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(22, 163, 74, 0.35);}
        .btn-action:disabled { opacity: 0.5; pointer-events: none; box-shadow: none; transform: none; cursor: not-allowed; }
        .btn-action.completed-state {
            background-color: var(--success-green) !important; color: white !important;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3) !important; cursor: default; transform: none !important; pointer-events: none; opacity: 1;
        }
        .btn-action.timer-active { background: var(--warning-orange) !important; opacity: 1; pointer-events: none; transform: none; box-shadow: none;}

        #drag-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }

        /* Toast Bildirimleri */
        #toast-msg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background-color: var(--primary-dark); color: white; font-weight: 800; font-size: 13px;
            padding: 12px 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000;
        }
        #toast-msg.show { transform: translateX(-50%) translateY(0); }
        .toast-warning { background-color: var(--warning-orange) !important; color: white !important;}

        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-3px); } 40%, 80% { transform: translateX(3px); } }

    </style>
</head>
<body>

    <audio id="audio1" src="ses1.mp3" preload="auto"></audio>

    <div id="scale-container">
        
        <div id="toast-msg">
            <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="toast-text">Bildirim metni.</span>
        </div>

        <header class="header">
            <div class="instruction-container">
                <div class="instruction-text">MADDENİN HÂLLERİ: SINIFLANDIRMA</div>
                <div class="sub-instruction">Sol taraftaki madde kartlarını sağ taraftaki uygun hâl kutularına sürükleyiniz. Dikkat: Bir kart hiçbir kutuya uymaz!</div>
            </div>
            <!-- Logo -->
            <div class="logo-right-container">
                <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none';">
            </div>
        </header>

        <main class="content-wrapper">
            
            <!-- SOL PANEL: KELİME HAVUZU -->
            <div class="left-panel">
                <div class="pool-title">MADDELER</div>
                
                <div class="pool-slot"><div id="c-1" class="draggable-card" data-val="kati" onclick="onCardClick(event)">Buz</div></div>
                <div class="pool-slot"><div id="c-2" class="draggable-card" data-val="sivi" onclick="onCardClick(event)">Zeytinyağı</div></div>
                <div class="pool-slot"><div id="c-3" class="draggable-card" data-val="gaz" onclick="onCardClick(event)">Helyum balonu içindeki gaz</div></div>
                <div class="pool-slot"><div id="c-4" class="draggable-card" data-val="sivi" onclick="onCardClick(event)">Erimiş kurşun</div></div>
                <div class="pool-slot"><div id="c-5" class="draggable-card" data-val="kati" onclick="onCardClick(event)">Granit kaya</div></div>
                
                <!-- Çeldirici Kelime -->
                <div class="pool-slot"><div id="c-6" class="draggable-card" data-val="hicbiri" onclick="onCardClick(event)">Işık</div></div>

            </div>

            <!-- SAĞ PANEL: HEDEF KUTULAR VE KONTROL -->
            <div class="right-panel">
                
                <div class="drop-zones-area">
                    <!-- KATI KUTUSU -->
                    <div class="drop-zone-wrapper">
                        <div class="drop-header">
                            <div class="drop-header-icon" style="background-color: #3b82f6;">
                                <!-- Basit Katı İkonu (Küp) -->
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                            </div>
                            KATI HÂL
                        </div>
                        <div class="drop-zone" id="zone-kati" data-ans="kati"></div>
                    </div>

                    <!-- SIVI KUTUSU -->
                    <div class="drop-zone-wrapper">
                        <div class="drop-header">
                            <div class="drop-header-icon" style="background-color: #f59e0b;">
                                <!-- Basit Sıvı İkonu (Damla) -->
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2C8 6 4 12 4 16c0 4.418 3.582 8 8 8s8-3.582 8-8c0-4-4-10-8-14z"/></svg>
                            </div>
                            SIVI HÂL
                        </div>
                        <div class="drop-zone" id="zone-sivi" data-ans="sivi"></div>
                    </div>

                    <!-- GAZ KUTUSU -->
                    <div class="drop-zone-wrapper">
                        <div class="drop-header">
                            <div class="drop-header-icon" style="background-color: #10b981;">
                                <!-- Basit Gaz İkonu (Bulut/Buhar) -->
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
                            </div>
                            GAZ HÂL
                        </div>
                        <div class="drop-zone" id="zone-gaz" data-ans="gaz"></div>
                    </div>
                </div>
                
                <div class="control-panel">
                    <div id="m-box" class="message-box"></div>
                    <button id="btn-c" class="btn-action" disabled onclick="checkAnswers()">KONTROL ET</button>
                </div>
            </div>
            
        </main>

        <!-- Sürükleme Katmanı -->
        <div id="drag-layer"></div>

    </div>

    <!-- --- STREAMING_CHUNK:Initializing drag-and-drop interactions... --- -->
    <script>
        let audioCtx = null;
        function getAudioContext() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
        
        function playSfx(type) {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type==='click') { osc.type='triangle'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime+0.1); }
                else if(type==='jump') { osc.type='sine'; osc.frequency.setValueAtTime(150, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime+0.15); }
                else if(type==='correct') { osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); }
                else if(type==='incorrect') { osc.type='sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.linearRampToValueAtTime(150, ctx.currentTime+0.3); }
                gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }

        let activeDrag = null, pointerId = null, placeholder = null;
        let startDragX = 0, startDragY = 0, cardStartX = 0, cardStartY = 0;
        let selCard = null, attempts = 0, done = false, preventClick = false;
        const totalTargets = 5; // Çeldirici hariç yerleşmesi gereken kart sayısı

        function init() {
            // Havuzu Karıştır
            const pool = document.querySelector('.left-panel');
            const slots = Array.from(pool.querySelectorAll('.pool-slot'));
            for (let i = slots.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                pool.insertBefore(slots[j], slots[i].nextSibling);
            }
            
            document.querySelectorAll('.draggable-card').forEach(c => {
                c.addEventListener('pointerdown', down);
            });

            // Tıklayarak yerleştirme için (Boşluktaki serbest dizilim mantığı)
            document.querySelectorAll('.drop-zone-wrapper').forEach(wrapper => {
                wrapper.addEventListener('click', (e) => {
                    if(done || !selCard) return;
                    const z = wrapper.querySelector('.drop-zone');
                    if (z) {
                        dock(selCard, z); 
                        selCard.classList.remove('selected'); 
                        selCard = null; 
                        refreshUI();
                    }
                });
            });
            
            const audio = document.getElementById('audio1');
            if(audio) {
                audio.play().catch(()=>{ console.log("Otomatik ses çalma engellendi."); });
            }
        }

        // --- KUSURSUZ SANAL SÜRÜKLEME ---
        function down(e) {
            if(done || activeDrag) return; 
            if(e.button !== 0 && e.type !== 'touchstart') return; 
            if(selCard) { selCard.classList.remove('selected'); selCard=null; }
            
            activeDrag = e.currentTarget;
            pointerId = e.pointerId;
            
            const rect = activeDrag.getBoundingClientRect();
            const container = document.getElementById('scale-container');
            const containerRect = container.getBoundingClientRect();
            const scale = containerRect.width / 960;

            if(!activeDrag.getAttribute('data-zone')) {
                placeholder = document.createElement('div');
                placeholder.className = 'placeholder-card';
                activeDrag.parentNode.insertBefore(placeholder, activeDrag);
            }

            document.getElementById('drag-layer').appendChild(activeDrag);
            
            cardStartX = (rect.left - containerRect.left) / scale;
            cardStartY = (rect.top - containerRect.top) / scale;

            activeDrag.style.position = 'absolute';
            activeDrag.style.width = (rect.width / scale) + 'px';
            activeDrag.style.height = (rect.height / scale) + 'px';
            activeDrag.style.margin = '0';
            activeDrag.style.transition = 'none';
            activeDrag.style.left = cardStartX + 'px';
            activeDrag.style.top = cardStartY + 'px';
            activeDrag.style.transform = 'translate(0px, 0px)';

            activeDrag.classList.add('dragging');
            
            startDragX = e.clientX;
            startDragY = e.clientY;
            preventClick = false;
            
            window.addEventListener('pointermove', move);
            window.addEventListener('pointerup', up);
            window.addEventListener('pointercancel', up);
            
            try { activeDrag.setPointerCapture(pointerId); } catch(err){}
            playSfx('click');
        }

        function move(e) {
            if(!activeDrag) return;
            const scale = document.getElementById('scale-container').getBoundingClientRect().width / 960;
            const dx = (e.clientX - startDragX) / scale;
            const dy = (e.clientY - startDragY) / scale;
            
            if(Math.abs(dx) > 3 || Math.abs(dy) > 3) preventClick = true;
            activeDrag.style.transform = `translate(${dx}px, ${dy}px)`;
        }

        function up(e) {
            if(!activeDrag) return;
            
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            window.removeEventListener('pointercancel', up);
            try { activeDrag.releasePointerCapture(pointerId); } catch(err) {}
            
            activeDrag.classList.remove('dragging');
            
            let bestZone = null;
            const cx = e.clientX;
            const cy = e.clientY;

            // Alan Kontrolü
            const zones = document.querySelectorAll('.drop-zone');
            zones.forEach(zone => {
                const r2 = zone.parentElement.getBoundingClientRect(); // Wrapper sınırlarını al
                if (cx >= r2.left && cx <= r2.right && cy >= r2.top && cy <= r2.bottom) {
                    bestZone = zone;
                }
            });
            
            if (!bestZone) {
                const pool = document.querySelector('.left-panel');
                const pR = pool.getBoundingClientRect();
                if (cx >= pR.left && cx <= pR.right && cy >= pR.top && cy <= pR.bottom) {
                    bestZone = 'pool';
                }
            }
            
            if (bestZone === 'pool') {
                virtualBack(activeDrag);
            } else if (bestZone) {
                dock(activeDrag, bestZone);
            } else {
                if(placeholder) {
                    const oldR = activeDrag.getBoundingClientRect();
                    placeholder.parentNode.insertBefore(activeDrag, placeholder);
                    animateToNewParent(activeDrag, oldR);
                } else {
                    virtualBack(activeDrag);
                }
            }

            if(placeholder) { placeholder.remove(); placeholder = null; }
            if(preventClick) setTimeout(() => { preventClick = false; }, 50);
            
            activeDrag = null; pointerId = null; refreshUI();
        }

        // --- STREAMING_CHUNK:Implementing dock and back logics... ---
        // Serbest Kutu İçi Dock (Stacking)
        function dock(c, z, duration = '0.3s') {
            const oldRect = c.getBoundingClientRect();
            z.appendChild(c);
            
            c.setAttribute('data-zone', z.id);
            
            resetCardStyle(c);
            
            // Kutu içine dizeceğimiz için relative pozisyon, yüksekliği fixleyelim ki taşmasın
            c.style.position = 'relative'; 
            c.style.width = '100%'; 
            c.style.height = '45px';
            
            const newRect = c.getBoundingClientRect();
            const scale = document.getElementById('scale-container').getBoundingClientRect().width / 960;
            const dx = (oldRect.left - newRect.left) / scale;
            const dy = (oldRect.top - newRect.top) / scale;

            c.style.transition = 'none';
            c.style.transform = `translate(${dx}px, ${dy}px)`;
            void c.offsetWidth;
            
            c.style.transition = `transform ${duration} cubic-bezier(0.2, 0, 0.2, 1)`;
            c.style.transform = 'translate(0px, 0px)';
            
            playSfx('jump');
        }

        function virtualBack(c) {
            c.removeAttribute('data-zone');
            
            const emptySlot = Array.from(document.querySelectorAll('.pool-slot:not(.placeholder)')).find(s => s.children.length === 0);
            if(emptySlot) {
                const oldRect = c.getBoundingClientRect();
                emptySlot.appendChild(c);
                animateToNewParent(c, oldRect);
            }
        }

        function resetCardStyle(c) {
            c.style.position = 'absolute';
            c.style.width = '100%';
            c.style.height = '100%';
            c.style.left = '0';
            c.style.top = '0';
            c.style.margin = '0';
            c.style.transform = '';
            c.style.transition = 'all 0.3s cubic-bezier(0.2, 0, 0.2, 1)';
            c.classList.remove('incorrect-state');
        }

        function animateToNewParent(c, oldRect, duration = '0.2s') {
            resetCardStyle(c);
            const r2 = c.getBoundingClientRect();
            const scale = document.getElementById('scale-container').getBoundingClientRect().width / 960;
            const dx = (oldRect.left - r2.left) / scale;
            const dy = (oldRect.top - r2.top) / scale;

            c.style.transition = 'none';
            c.style.transform = `translate(${dx}px, ${dy}px)`;
            void c.offsetWidth;
            
            c.style.transition = `transform ${duration} cubic-bezier(0.2, 0, 0.2, 1)`;
            c.style.transform = 'translate(0px, 0px)';
        }

        function onCardClick(e) {
            if(done || preventClick) return; 
            const c = e.currentTarget;
            if(c.getAttribute('data-zone')) { virtualBack(c); refreshUI(); return; }
            if(selCard) selCard.classList.remove('selected');
            if(selCard === c) {
                selCard = null;
            } else { 
                selCard = c; 
                selCard.classList.add('selected'); 
                playSfx('click'); 
            }
        }

        function refreshUI() {
            const placedCards = document.querySelectorAll('.drop-zone .draggable-card');
            
            // Eğer en az 5 kart yerleştirildiyse kontrol butonunu göster (Çeldirici dışarıda kalabilir)
            document.getElementById('btn-c').disabled = placedCards.length < 5;
            if(placedCards.length >= 5) document.getElementById('btn-c').style.display = 'block';
        }

        // --- STREAMING_CHUNK:Final evaluation logic... ---
        function checkAnswers() {
            if(done) return;
            let isAllCorrect = true;

            const placedCards = document.querySelectorAll('.drop-zone .draggable-card');
            
            placedCards.forEach(c => {
                const zoneAns = c.parentElement.getAttribute('data-ans'); 
                const expectedAns = c.getAttribute('data-val'); 
                
                if(zoneAns === expectedAns) {
                    c.classList.add('correct-state');
                    c.classList.remove('incorrect-state');
                } else { 
                    isAllCorrect = false;
                    c.classList.add('incorrect-state'); 
                    c.classList.remove('correct-state');
                }
            });
            
            // Eğer eksik kart varsa (örneğin adam çeldiriciyi koyup doğruyu dışarıda bıraktıysa)
            let correctPlacedCount = document.querySelectorAll('.drop-zone .draggable-card.correct-state').length;
            if (correctPlacedCount < totalTargets) isAllCorrect = false;

            const btnCheck = document.getElementById('btn-c');

            if(isAllCorrect) {
                done = true;
                btnCheck.className = "btn-action completed-state";
                btnCheck.innerText = "TAMAMLANDI ✓";
                btnCheck.disabled = true;

                // Çeldiriciyi soluklaştır
                const distractor = document.getElementById('c-6');
                if(distractor && !distractor.getAttribute('data-zone')) distractor.style.opacity = '0.5';

                playSfx('correct');
                
                showMsg('Harika! Işık madde olmadığı için dışarıda kaldı.', 'msg-success');
                showToast("Tebrikler! Sınıflandırmayı başarıyla tamamladınız. ✓", "msg-success");
                
                // Storyline Değişkeni: c9
                setVar('c9', true); 
            } else {
                attempts++;
                if(attempts === 1) {
                    playSfx('incorrect');
                    showMsg('Hatalı yerleştirmeler var. Çeldiriciye dikkat edin!', 'msg-error');
                    
                    document.querySelectorAll('.drop-zone .draggable-card.incorrect-state').forEach(c => {
                        setTimeout(() => { if(!done){ virtualBack(c); c.classList.remove('incorrect-state'); refreshUI(); } }, 1500); 
                    });
                    
                    setTimeout(() => { if(!done) { document.getElementById('m-box').style.display = 'none'; } }, 3000);
                } else { 
                    done = true; 
                    btnCheck.style.display = 'none'; 
                    solveAll(); 
                }
            }
        }

        function solveAll() {
            const cards = document.querySelectorAll('.draggable-card');
            if(selCard) { selCard.classList.remove('selected'); selCard = null; }

            // Yanlışları havuza gönder
            cards.forEach(c => {
                if(c.getAttribute('data-zone') && c.classList.contains('incorrect-state')) {
                    virtualBack(c);
                    c.classList.remove('incorrect-state');
                } else if (c.getAttribute('data-zone')) {
                    c.classList.add('correct-state');
                    c.setAttribute('data-locked', 'true');
                }
            });

            // Doğruları yerleştir
            let delay = 0;
            cards.forEach(c => {
                if(!c.hasAttribute('data-zone') && !c.hasAttribute('data-locked')) {
                    const expectedAns = c.getAttribute('data-val');
                    let targetZone = document.getElementById(`zone-${expectedAns}`);
                    
                    if(targetZone) {
                        c.setAttribute('data-locked', 'true');
                        setTimeout(() => {
                            dock(c, targetZone, '0.4s');
                            c.classList.add('correct-state');
                        }, delay);
                        delay += 300;
                    }
                }
            });

            showMsg('Hakkınız bitti. Doğru dağılım yapılıyor...', 'msg-error');
            
            setTimeout(() => {
                document.getElementById('m-box').style.display = 'none';
                const actionBtn = document.getElementById('btn-c');
                actionBtn.style.display = 'block';
                actionBtn.disabled = true;
                actionBtn.className = "btn-action timer-active";
                
                const distractor = document.getElementById('c-6');
                if(distractor && !distractor.getAttribute('data-zone')) distractor.style.opacity = '0.5';

                let countdown = 10;
                actionBtn.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
                
                const interval = setInterval(() => {
                    countdown--;
                    actionBtn.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
                    if(countdown <= 0) {
                        clearInterval(interval);
                        actionBtn.innerText = "TAMAMLANDI ✓";
                        actionBtn.classList.remove('timer-active');
                        actionBtn.classList.add('completed-state');
                        
                        // Storyline Değişkeni: c10
                        setVar('c10', true); 
                        
                        showMsg('Not: Işık kütleye ve hacme sahip olmadığı için madde değildir.', 'msg-success');
                        showToast("İnceleme tamamlandı, ilerleyebilirsiniz.", "toast-success");
                    }
                }, 1000);
            }, delay + 500);
        }

        function showMsg(t, cls) { const b = document.getElementById('m-box'); b.innerText = t; b.className = 'message-box ' + cls; b.style.display = 'block'; }
        function setVar(n, v) { try { parent.GetPlayer().SetVar(n, v); console.log(`Storyline Variable: ${n} = ${v}`); } catch(e) { console.log(`(Lokal) ${n} = ${v}`); } }

        function showToast(msg, typeCls = '') {
            const toast = document.getElementById('toast-msg');
            const txtEl = document.getElementById('toast-text');
            
            toast.className = '';
            toast.classList.add('show');
            if (typeCls) toast.classList.add(typeCls);
            
            if(msg) txtEl.innerText = msg;
            
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        window.addEventListener('resize', () => {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        });
        
        window.onload = () => { window.dispatchEvent(new Event('resize')); init(); };
    </script>
</body>
</html>
