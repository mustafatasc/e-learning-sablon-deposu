<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Etkinlik: Işınları Bulma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            --bg-cream: #FCF9F2;
            --grid-line: rgba(185, 28, 28, 0.08);
            
            --primary-red: #B91C1C; 
            --light-red: #FEF2F2;
            --text-dark: #1E293B;
            --success-green: #10B981;
            --error-red: #EF4444;
            --warning-orange: #F59E0B;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0F172A; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; color: var(--text-dark);
            user-select: none; -webkit-user-select: none;
            visibility: hidden;
        }

        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--bg-cream); 
            background-image: 
                linear-gradient(var(--grid-line) 1.5px, transparent 1.5px), 
                linear-gradient(90deg, var(--grid-line) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-top: 6px solid var(--primary-red);
        }

        /* --- HEADER VE YÖNERGE --- */
        .header {
            padding: 20px 40px 0 40px; height: 85px;
            display: flex; justify-content: space-between; align-items: start;
            flex-shrink: 0; z-index: 10;
        }

        .instruction-container { flex: 1; padding: 0; }
        .instruction-text-main { font-size: 16px; line-height: 1.4; font-weight: 900; color: var(--primary-red); text-transform: uppercase; letter-spacing: 1px;}
        .logo-right-container { width: 80px; height: 80px; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; margin-left: 20px; margin-top: -10px; }

        .content-wrapper {
            display: flex; flex-direction: column; flex: 1; padding: 0 40px 15px 40px; gap: 12px; height: calc(540px - 85px);
            z-index: 10;
        }

        .instruction-group {
            display: flex; align-items: center; gap: 15px; width: 100%;
            background: white; border-radius: 12px; padding: 10px 20px 10px 15px;
            border-left: 5px solid #1D4ED8; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            margin-top: 0;
        }

        .narrator-speaker {
            width: 34px; height: 34px; background: var(--primary-red); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(185, 28, 28, 0.4); cursor: pointer;
        }

        @keyframes pulsePlay {
            0% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(185, 28, 28, 0); }
            100% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0); }
        }

        .instruction-text {
            font-size: 15px; line-height: 1.4; font-weight: 700; color: var(--text-dark);
            cursor: pointer; transition: color 0.2s;
        }
        .instruction-text:hover {
            color: var(--primary-red);
        }

        /* --- ORTA PANEL: IZGARA KARTLARI --- */
        .grid-container {
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
            gap: 15px; flex: 1; min-height: 0; margin-top: 5px;
        }

        .opt-card {
            background: white; border: 3px solid #e2e8f0; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            /* Küçük kareli defter deseni (kartların içine) */
            background-image: 
                linear-gradient(#f1f5f9 1px, transparent 1px), 
                linear-gradient(90deg, #f1f5f9 1px, transparent 1px);
            background-size: 15px 15px; background-position: center;
        }

        .opt-card:hover {
            border-color: var(--primary-red); transform: translateY(-3px); box-shadow: 0 8px 15px rgba(185, 28, 28, 0.1);
        }
        .opt-card:active { transform: translateY(1px); }

        .svg-container {
            width: 100%; flex: 1; display: flex; align-items: center; justify-content: center;
        }
        
        .math-svg { width: 100%; height: 100%; max-height: 100px; }

        /* Checkbox Stili */
        .check-box {
            width: 32px; height: 32px; border: 3px solid #cbd5e1; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; background: white;
            color: transparent; transition: 0.2s; margin-bottom: 10px; z-index: 5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Seçili Durum */
        .opt-card.selected {
            border-color: var(--primary-red); background-color: var(--light-red);
            /* Seçiliyken ızgarayı korumak için renk karışımı */
            background-image: 
                linear-gradient(rgba(239, 68, 68, 0.1) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(239, 68, 68, 0.1) 1px, transparent 1px);
        }
        .opt-card.selected .check-box {
            background: var(--primary-red); border-color: var(--primary-red); color: white;
        }

        /* Doğru / Yanlış Animasyonları */
        .opt-card.is-correct { border-color: var(--success-green); background-color: #ecfdf5; pointer-events: none;}
        .opt-card.is-correct .check-box { background: var(--success-green); border-color: var(--success-green); color: white;}
        
        .opt-card.is-incorrect { border-color: var(--error-red); background-color: #fef2f2; animation: shake 0.4s ease-in-out;}
        .opt-card.is-incorrect .check-box { background: var(--error-red); border-color: var(--error-red); color: white;}
        
        .opt-card.disabled { pointer-events: none; opacity: 0.7;}

        /* --- ALT PANEL: KONTROL VE GERİ BİLDİRİM --- */
        .bottom-panel {
            display: flex; justify-content: space-between; align-items: center; height: 45px; flex-shrink: 0; margin-top: auto;
        }

        .feedback-msg {
            font-size: 13px; font-weight: 800; padding: 12px 20px; border-radius: 10px;
            display: none; line-height: 1.4; flex: 1; margin-right: 20px;
        }
        .fb-success { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #10b981; }
        .fb-error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #ef4444; }

        .btn-action {
            background: var(--primary-red); color: white; min-width: 240px; height: 45px;
            font-size: 15px; font-weight: 800; border-radius: 12px;
            box-shadow: 0 6px 15px rgba(185, 28, 28, 0.3); border: none;
            cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
            padding: 0 25px; margin-left: auto;
        }
        .btn-action:hover { background: #991b1b; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(185, 28, 28, 0.4); }
        .btn-action.completed { background: var(--success-green); pointer-events: none; transform: none; box-shadow: none;}
        .btn-action.timer-active { background: var(--warning-orange); pointer-events: none; transform: none; box-shadow: none;}

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* Toast Bildirimi */
        #toast-msg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            font-weight: 800; font-size: 14px;
            padding: 12px 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000; color: white;
        }
        #toast-msg.show { transform: translateX(-50%) translateY(0); }
        .toast-success { background-color: var(--success-green) !important; }
        .toast-warning { background-color: var(--warning-orange) !important; }

    </style>
</head>
<body>

    <audio id="ses1" src="ses1.mp3" preload="auto" autoplay></audio>

    <div id="scale-container">
        
        <div id="toast-msg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="toast-text"></span>
        </div>

        <header class="header">
            <div class="instruction-container">
                <div class="instruction-text-main">IŞINLARI BULMA ETKİNLİĞİ</div>
            </div>
            <div class="logo-right-container">
                <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none';">
            </div>
        </header>

        <main class="content-wrapper">
            
            <div class="instruction-group">
                <div id="main-speaker" class="narrator-speaker" onclick="playAudio('ses1')">
                    <svg class="w-4 h-4 pl-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.546-2.07-2.584-1.23L6.15 6.75H3A1.5 1.5 0 001.5 8.25v7.5A1.5 1.5 0 003 17.25h3.15l4.766 3.92c1.038.84 2.584.106 2.584-1.23V4.06z"/></svg>
                </div>
                <!-- Yönerge metni tıklanabilir yapıldı -->
                <div class="instruction-text" onclick="playAudio('ses1')" title="Sesi dinlemek için tıklayabilirsiniz">
                    Aşağıda verilen geometrik şekillerden "bir ışını ifade edenlerin" altındaki kutucuğu işaretleyiniz.
                </div>
            </div>

            <!-- ORTA PANEL: IZGARA KARTLARI -->
            <div class="grid-container">

                <!-- Şekil 1: AB Işını (Doğru) -->
                <div class="opt-card" id="card-1" data-id="1" onclick="toggleOpt(1)">
                    <div class="svg-container">
                        <svg class="math-svg" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <marker id="arrow-end-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E293B"/>
                                </marker>
                            </defs>
                            <line x1="20" y1="50" x2="100" y2="50" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arrow-end-1)"/>
                            <circle cx="20" cy="50" r="4" fill="#1E293B"/>
                            <circle cx="80" cy="50" r="4" fill="#1E293B"/>
                            <text x="15" y="70" font-family="Montserrat" font-weight="700" font-size="16" fill="#1E293B">A</text>
                            <text x="75" y="70" font-family="Montserrat" font-weight="700" font-size="16" fill="#1E293B">B</text>
                        </svg>
                    </div>
                    <div class="check-box">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    </div>
                </div>

                <!-- Şekil 2: CD Doğrusu (Yanlış) -->
                <div class="opt-card" id="card-2" data-id="2" onclick="toggleOpt(2)">
                    <div class="svg-container">
                        <svg class="math-svg" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <marker id="arrow-end-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E293B"/>
                                </marker>
                                <marker id="arrow-start-2" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E293B"/>
                                </marker>
                            </defs>
                            <line x1="20" y1="20" x2="100" y2="80" stroke="#1E293B" stroke-width="2.5" marker-start="url(#arrow-start-2)" marker-end="url(#arrow-end-2)"/>
                            <circle cx="40" cy="35" r="4" fill="#1E293B"/>
                            <circle cx="80" cy="65" r="4" fill="#1E293B"/>
                            <text x="35" y="25" font-family="Montserrat" font-weight="700" font-size="16" fill="#1E293B">C</text>
                            <text x="70" y="85" font-family="Montserrat" font-weight="700" font-size="16" fill="#1E293B">D</text>
                        </svg>
                    </div>
                    <div class="check-box">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    </div>
                </div>

                <!-- Şekil 3: E Noktası (Yanlış) -->
                <div class="opt-card" id="card-3" data-id="3" onclick="toggleOpt(3)">
                    <div class="svg-container">
                        <svg class="math-svg" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="60" cy="50" r="4" fill="#1E293B"/>
                            <text x="70" y="55" font-family="Montserrat" font-weight="700" font-size="16" fill="#1E293B">E</text>
                        </svg>
                    </div>
                    <div class="check-box">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    </div>
                </div>

                <!-- Şekil 4: HK Doğru Parçası (Yanlış) -->
                <div class="opt-card" id="card-4" data-id="4" onclick="toggleOpt(4)">
                    <div class="svg-container">
                        <svg class="math-svg" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
                            <line x1="20" y1="50" x2="100" y2="50" stroke="#1E293B" stroke-width="2.5"/>
                            <circle cx="20" cy="50" r="4" fill="#1E293B"/>
                            <circle cx="100" cy="50" r="4" fill="#1E293B"/>
                            <text x="15" y="70" font-family="Montserrat" font-weight="700" font-size="16" fill="#1E293B">H</text>
                            <text x="95" y="70" font-family="Montserrat" font-weight="700" font-size="16" fill="#1E293B">K</text>
                        </svg>
                    </div>
                    <div class="check-box">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    </div>
                </div>

                <!-- Şekil 5: FG Işını (Doğru) -->
                <div class="opt-card" id="card-5" data-id="5" onclick="toggleOpt(5)">
                    <div class="svg-container">
                        <svg class="math-svg" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <marker id="arrow-end-5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E293B"/>
                                </marker>
                            </defs>
                            <line x1="60" y1="20" x2="60" y2="80" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arrow-end-5)"/>
                            <circle cx="60" cy="20" r="4" fill="#1E293B"/>
                            <circle cx="60" cy="60" r="4" fill="#1E293B"/>
                            <text x="75" y="30" font-family="Montserrat" font-weight="700" font-size="16" fill="#1E293B">F</text>
                            <text x="75" y="70" font-family="Montserrat" font-weight="700" font-size="16" fill="#1E293B">G</text>
                        </svg>
                    </div>
                    <div class="check-box">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    </div>
                </div>

                <!-- Şekil 6: ML Işını (Doğru) -->
                <div class="opt-card" id="card-6" data-id="6" onclick="toggleOpt(6)">
                    <div class="svg-container">
                        <svg class="math-svg" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <marker id="arrow-end-6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#1E293B"/>
                                </marker>
                            </defs>
                            <line x1="100" y1="50" x2="20" y2="50" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arrow-end-6)"/>
                            <circle cx="100" cy="50" r="4" fill="#1E293B"/>
                            <circle cx="40" cy="50" r="4" fill="#1E293B"/>
                            <text x="25" y="70" font-family="Montserrat" font-weight="700" font-size="16" fill="#1E293B">M</text>
                            <text x="95" y="70" font-family="Montserrat" font-weight="700" font-size="16" fill="#1E293B">L</text>
                        </svg>
                    </div>
                    <div class="check-box">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    </div>
                </div>

            </div>

            <!-- ALT PANEL: KONTROL VE GERİ BİLDİRİM -->
            <div class="bottom-panel">
                <div id="q-fb" class="feedback-msg"></div>
                <button id="btn-check" class="btn-action" onclick="checkAnswers()">KONTROL ET</button>
            </div>

        </main>
    </div>

    <script>
        let audioCtx = null;
        let isAudioPlaying = false;
        
        function getAudioContext() { 
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            return audioCtx; 
        }
        
        function playSfx(type) {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type==='click') { osc.type='triangle'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime+0.1); }
                else if(type==='success') { osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); }
                else if(type==='error') { osc.type='sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.linearRampToValueAtTime(150, ctx.currentTime+0.3); }
                gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }

        let isCompleted = false;
        let attempts = 0;
        
        // Işın olan şekillerin ID'leri (1: AB, 5: FG, 6: mL)
        const correctAnswers = [1, 5, 6];

        // Zorunlu Otomatik Oynatma Fonksiyonu
        function forceAutoplay() {
            if (isAudioPlaying) return; 
            const audio = document.getElementById('ses1');
            const speaker = document.getElementById('main-speaker');
            
            if (audio) {
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                        window.removeEventListener('click', forceAutoplay);
                        window.removeEventListener('touchstart', forceAutoplay);
                    }).catch(error => {
                        if(speaker) speaker.style.animation = 'none';
                    });
                }
            }
        }

        function playAudio(id) {
            const audio = document.getElementById(id);
            const speaker = document.getElementById('main-speaker');
            if(audio) {
                audio.pause(); audio.currentTime = 0; 
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                    }).catch(e => console.log(e));
                }
            }
        }

        function init() {
            const s = document.getElementById('ses1');
            if(s) {
                s.addEventListener('ended', () => {
                    const speaker = document.getElementById('main-speaker');
                    if(speaker) speaker.style.animation = 'none'; 
                    isAudioPlaying = false; 
                });
            }

            forceAutoplay();
            window.addEventListener('click', forceAutoplay);
            window.addEventListener('touchstart', forceAutoplay);
        }

        function toggleOpt(id) {
            if (isCompleted) return;
            playSfx('click');
            const card = document.getElementById(`card-${id}`);
            card.classList.toggle('selected');
        }

        function checkAnswers() {
            if(isCompleted) return;
            
            const selectedCards = Array.from(document.querySelectorAll('.opt-card.selected')).map(el => parseInt(el.dataset.id));
            
            if(selectedCards.length === 0) {
                showToast("Lütfen ışın belirten şekilleri işaretleyiniz.", "toast-warning");
                return;
            }

            // Seçim tam olarak doğru mu? (Hem sayı hem de elemanlar eşleşmeli)
            let isCorrect = selectedCards.length === correctAnswers.length && correctAnswers.every(id => selectedCards.includes(id));

            const fbBox = document.getElementById('q-fb');
            const btnCheck = document.getElementById('btn-check');
            fbBox.className = "feedback-msg"; // Reset

            if(isCorrect) {
                // TAM BAŞARI
                isCompleted = true;
                playSfx('success');

                // Seçilen (doğru) kartları yeşil yap, diğerlerini pasif yap
                document.querySelectorAll('.opt-card').forEach(card => {
                    if (card.classList.contains('selected')) {
                        card.classList.add('is-correct');
                    } else {
                        card.classList.add('disabled');
                    }
                });
                
                if(attempts === 0) {
                    // İLK DENEMEDE DOĞRU
                    fbBox.innerHTML = `DOĞRU! <br><span style="font-weight:600; font-size:11px; display:block; margin-top:4px;">Harika! Bir başlangıç noktası olup bir yönde sonsuza uzanan ışınları doğru buldunuz.</span>`;
                    fbBox.classList.add('fb-success');
                    
                    btnCheck.innerText = "TAMAMLANDI ✓";
                    btnCheck.classList.add('completed');
                    
                    showToast("Etkinlik başarıyla tamamlandı. İlerleyebilirsiniz.", "toast-success");
                    setVar('d2', true); // İLK DENEME DOĞRU: d2 = true
                } else {
                    // İKİNCİ DENEMEDE KENDİSİ DÜZELTTİ İSE (Güvenlik)
                    triggerTimerAutoSolve('d3'); 
                }

            } else {
                // HATA DURUMU
                attempts++;
                playSfx('error');

                if(attempts === 1) {
                    // 1. HATA
                    fbBox.innerHTML = `Eksik veya hatalı seçimleriniz var. Unutmayın, ışının bir başlangıç noktası vardır ve diğer ucu sonsuza uzanır.`;
                    fbBox.classList.add('fb-error');
                    
                    // Yanlış seçilmiş (selected olup answers'ta olmayan) kartları titret ve iptal et
                    document.querySelectorAll('.opt-card.selected').forEach(card => {
                        let id = parseInt(card.dataset.id);
                        if (!correctAnswers.includes(id)) {
                            card.classList.add('is-incorrect');
                            setTimeout(() => { 
                                card.classList.remove('is-incorrect', 'selected'); 
                            }, 1200);
                        }
                    });
                    
                    setTimeout(() => { fbBox.style.display = 'none'; }, 4000);

                } else {
                    // 2. HATA - OTOMATİK ÇÖZÜM
                    isCompleted = true;
                    
                    fbBox.innerHTML = `Hakkınız bitti. Doğru şekiller otomatik olarak işaretleniyor...`;
                    fbBox.classList.add('fb-error');

                    // Önce tüm seçimleri ve hataları temizle
                    document.querySelectorAll('.opt-card').forEach(card => {
                        card.classList.remove('selected', 'is-incorrect');
                        card.classList.add('disabled');
                    });

                    // Doğru cevapları sırayla işaretle ve yeşil yap
                    correctAnswers.forEach((id, index) => {
                        setTimeout(() => {
                            let card = document.getElementById(`card-${id}`);
                            card.classList.add('selected', 'is-correct');
                            playSfx('click');
                        }, (index + 1) * 600);
                    });

                    // Sayaç başlat
                    setTimeout(() => {
                        fbBox.style.display = 'none';
                        triggerTimerAutoSolve('d3'); // OTOMATİK ÇÖZÜM: d3 = true
                    }, (correctAnswers.length + 1) * 600 + 500);
                }
            }
        }

        function triggerTimerAutoSolve(variableToSet) {
            const btnCheck = document.getElementById('btn-check');
            btnCheck.classList.add('timer-active'); 
            
            let countdown = 10;
            btnCheck.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
            
            const interval = setInterval(() => {
                countdown--;
                btnCheck.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
                
                if(countdown <= 0) {
                    clearInterval(interval);
                    btnCheck.innerText = "TAMAMLANDI ✓";
                    btnCheck.classList.remove('timer-active');
                    btnCheck.classList.add('completed');
                    
                    showToast("İnceleme tamamlandı, ilerleyebilirsiniz.", "toast-success");
                    setVar(variableToSet, true); // Değişkeni tetikle (d3)
                }
            }, 1000);
        }

        function showToast(msg, typeCls) {
            const toast = document.getElementById('toast-msg');
            document.getElementById('toast-text').innerText = msg;
            
            toast.className = ''; 
            toast.classList.add('show');
            if(typeCls) toast.classList.add(typeCls);
            
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        function setVar(n, v) { 
            try { 
                parent.GetPlayer().SetVar(n, v); 
                console.log(`Storyline Variable Set: ${n} = ${v}`); 
            } catch(e) { 
                console.log(`(Local) Storyline Variable: ${n} = ${v}`); 
            } 
        }

        function applyScale() {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        }
        
        applyScale(); 
        document.body.style.visibility = 'visible'; 
        
        window.addEventListener('resize', applyScale);
        window.onload = () => { init(); };
    </script>
</body>
</html>
