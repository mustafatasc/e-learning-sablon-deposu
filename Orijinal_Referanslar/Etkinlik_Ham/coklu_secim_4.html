<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Çokgenleri Belirleme Etkinliği</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            /* Matematik Teması: Krem zemin, Kırmızımsı ızgara */
            --bg-cream: #FCF9F2;
            --grid-line: rgba(185, 28, 28, 0.08); 
            
            --primary-red: #B91C1C; 
            --primary-dark: #7F1D1D;
            --primary-soft: #FCA5A5;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            
            /* Seçim Rengi (Mavi Kalem Rengi) */
            --select-blue: #3B82F6;
            
            --success-green: #10B981;
            --error-red: #EF4444;
            --warning-orange: #F59E0B;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0F172A; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; color: var(--text-dark);
            user-select: none; -webkit-user-select: none;
        }

        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        *::-webkit-scrollbar { display: none !important; }

        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--bg-cream); 
            background-image: 
                linear-gradient(var(--grid-line) 1.5px, transparent 1.5px), 
                linear-gradient(90deg, var(--grid-line) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-top: 6px solid var(--primary-red);
        }

        #scale-container::before {
            content: ''; position: absolute; top: -20%; left: -20%; width: 150%; height: 150%;
            background: radial-gradient(circle, rgba(185, 28, 28, 0.08) 0%, transparent 60%);
            z-index: 0; pointer-events: none;
        }

        /* --- HEADER --- */
        .header {
            padding: 20px 40px 0 40px; height: 85px;
            display: flex; justify-content: space-between; align-items: start;
            flex-shrink: 0; z-index: 10;
        }

        .instruction-container { flex: 1; padding: 0; display: flex; flex-direction: column; justify-content: center; height: 100%;}
        .instruction-text { font-size: 16px; line-height: 1.4; font-weight: 900; color: var(--primary-dark); text-align: left; text-transform: uppercase; letter-spacing: 0.5px;}
        .sub-instruction { font-size: 13.5px; font-weight: 600; color: #475569; margin-top: 4px; }
        .logo-right-container { width: 85px; height: 85px; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; margin-left: 20px; margin-top: -10px; }

        /* --- CONTENT --- */
        .content-wrapper {
            display: flex; flex-direction: column; flex: 1; padding: 5px 40px 20px 40px; gap: 15px; height: calc(540px - 85px);
            z-index: 10;
        }

        /* Şekil Kartları Alanı (Esnek Wrap Yerleşimi) */
        .shapes-area {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; flex: 1; align-content: center;
        }

        .shape-card {
            background: white; border: 3px solid rgba(185, 28, 28, 0.15); border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            position: relative; cursor: pointer; transition: all 0.2s;
            width: 170px; height: 170px;
        }

        .shape-card:hover {
            transform: translateY(-3px); box-shadow: 0 8px 20px rgba(185, 28, 28, 0.1); border-color: var(--primary-soft);
        }

        .shape-card:active { transform: translateY(1px); }

        /* Seçili Durum */
        .shape-card.selected {
            border-color: var(--select-blue); background: #eff6ff; box-shadow: 0 6px 15px rgba(59, 130, 246, 0.2);
        }

        /* Doğru / Yanlış Değerlendirme Durumları */
        .shape-card.is-correct { border-color: var(--success-green); background: #ecfdf5; pointer-events: none;}
        .shape-card.is-incorrect { border-color: var(--error-red); background: #fef2f2; animation: shake 0.4s ease-in-out;}
        .shape-card.disabled { pointer-events: none; opacity: 0.7;}

        .q-label {
            position: absolute; top: 10px; left: 15px; font-size: 18px; font-weight: 900; color: var(--primary-red);
        }

        /* SVG Çizim Alanı */
        .svg-container {
            width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; margin-top: 15px;
        }
        .math-svg { width: 100%; height: 100%; max-height: 90px;}
        .draw-path { fill: none; stroke: var(--text-dark); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round;}
        
        /* Şekilleri Belirginleştirme Opsiyonu */
        .closed-shape { fill: none; }

        /* Checkbox Kutusu */
        .check-box {
            width: 32px; height: 32px; border: 3px solid #cbd5e1; border-radius: 8px;
            background: white; display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 900; color: transparent; transition: all 0.2s;
            margin-top: 10px;
        }

        /* Mavi Tik (Seçildiğinde) */
        .shape-card.selected .check-box { border-color: var(--select-blue); }
        .shape-card.selected .check-box::after { content: '✓'; color: var(--select-blue); }

        /* Değerlendirme İkonları */
        .shape-card.is-correct .check-box { background: var(--success-green); border-color: var(--success-green); }
        .shape-card.is-correct .check-box::after { content: '✓'; color: white; }
        
        .shape-card.is-incorrect .check-box { background: var(--error-red); border-color: var(--error-red); }
        .shape-card.is-incorrect .check-box::after { content: '✗'; color: white; }


        /* --- ALT KONTROL PANELİ --- */
        .control-panel { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: auto; }

        .feedback-msg {
            font-size: 13px; font-weight: 800; text-align: center; padding: 10px 20px; border-radius: 10px;
            display: none; line-height: 1.4; width: 100%; max-width: 600px;
        }
        .fb-success { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #10b981; }
        .fb-error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #ef4444; }

        .btn-action {
            background: var(--primary-red); color: white; width: 300px; height: 50px;
            font-size: 15px; font-weight: 800; border-radius: 12px;
            box-shadow: 0 6px 15px rgba(185, 28, 28, 0.3); border: none;
            cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
        }
        .btn-action:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(185, 28, 28, 0.4); }
        .btn-action.completed { background: var(--success-green); pointer-events: none; transform: none; box-shadow: none;}
        .btn-action.timer-active { background: var(--warning-orange); pointer-events: none; transform: none; box-shadow: none;}

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* Toast Bildirimleri */
        #toast-msg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background-color: var(--primary-dark); color: white; font-weight: 800; font-size: 14px;
            padding: 12px 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000;
        }
        #toast-msg.show { transform: translateX(-50%) translateY(0); }
        .toast-success { background-color: var(--success-green) !important; color: white !important;}

    </style>
</head>
<body>

    <audio id="audio1" src="ses1.mp3" preload="auto"></audio>

    <div id="scale-container">
        
        <div id="toast-msg">
            <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="toast-text">Tebrikler!</span>
        </div>

        <header class="header">
            <div class="instruction-container">
                <div class="instruction-text">ETKİNLİK</div>
                <div class="sub-instruction">Aşağıda verilen şekillerden <strong>çokgen olanları</strong> işaretleyiniz.</div>
            </div>
            <!-- Logo -->
            <div class="logo-right-container">
                <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none';">
            </div>
        </header>

        <main class="content-wrapper">
            
            <div class="shapes-area">
                
                <!-- Şekil a) Beşgen (Çokgen -> DOĞRU) -->
                <div class="shape-card" id="card-a" data-is-polygon="true" onclick="toggleCard('a')">
                    <div class="q-label">a)</div>
                    <div class="svg-container">
                        <svg class="math-svg" viewBox="0 0 120 120">
                            <!-- Düzgün Beşgen Benzeri -->
                            <polygon points="60,10 110,45 90,110 30,110 10,45" class="draw-path closed-shape"/>
                        </svg>
                    </div>
                    <div class="check-box" id="cb-a"></div>
                </div>

                <!-- Şekil b) Yamuk / Dörtgen (Çokgen -> DOĞRU) -->
                <div class="shape-card" id="card-b" data-is-polygon="true" onclick="toggleCard('b')">
                    <div class="q-label">b)</div>
                    <div class="svg-container">
                        <svg class="math-svg" viewBox="0 0 120 120">
                            <!-- Yamuk -->
                            <polygon points="30,25 90,25 115,95 5,95" class="draw-path closed-shape"/>
                        </svg>
                    </div>
                    <div class="check-box" id="cb-b"></div>
                </div>

                <!-- Şekil c) Üstü Eğrisel Şekil (Çokgen Değil -> YANLIŞ) -->
                <div class="shape-card" id="card-c" data-is-polygon="false" onclick="toggleCard('c')">
                    <div class="q-label">c)</div>
                    <div class="svg-container">
                        <svg class="math-svg" viewBox="0 0 120 120">
                            <!-- Üst kısmı eğri, altı düz (kase gibi) -->
                            <path d="M 15 25 C 50 65, 70 65, 105 25 L 95 105 L 25 105 Z" class="draw-path closed-shape"/>
                        </svg>
                    </div>
                    <div class="check-box" id="cb-c"></div>
                </div>

                <!-- Şekil d) Altı Eğrisel Şekil / Kase (Çokgen Değil -> YANLIŞ) -->
                <div class="shape-card" id="card-d" data-is-polygon="false" onclick="toggleCard('d')">
                    <div class="q-label">d)</div>
                    <div class="svg-container">
                        <svg class="math-svg" viewBox="0 0 120 120">
                            <!-- Üst düz, alt eğri -->
                            <path d="M 10 35 L 110 35 C 110 110, 10 110, 10 35 Z" class="draw-path closed-shape"/>
                        </svg>
                    </div>
                    <div class="check-box" id="cb-d"></div>
                </div>

                <!-- Şekil e) Sekizgen (Çokgen -> DOĞRU) -->
                <div class="shape-card" id="card-e" data-is-polygon="true" onclick="toggleCard('e')">
                    <div class="q-label">e)</div>
                    <div class="svg-container">
                        <svg class="math-svg" viewBox="0 0 120 120">
                            <!-- Sekizgen -->
                            <polygon points="40,10 80,10 110,40 110,80 80,110 40,110 10,80 10,40" class="draw-path closed-shape"/>
                        </svg>
                    </div>
                    <div class="check-box" id="cb-e"></div>
                </div>

            </div>

            <!-- KONTROL -->
            <div class="control-panel">
                <div id="q-fb" class="feedback-msg"></div>
                <button id="btn-check" class="btn-action" onclick="checkAnswers()">KONTROL ET</button>
            </div>

        </main>
    </div>

    <script>
        let audioCtx = null;
        function getAudioContext() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
        
        function playSfx(type) {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type==='click') { osc.type='triangle'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime+0.1); }
                else if(type==='success') { osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); }
                else if(type==='error') { osc.type='sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.linearRampToValueAtTime(150, ctx.currentTime+0.3); }
                gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }

        let isCompleted = false;
        let attempts = 0;

        function init() {
            document.getElementById('audio1').play().catch(()=>{});
        }

        function toggleCard(id) {
            if(isCompleted) return;
            getAudioContext();
            playSfx('click');
            
            const card = document.getElementById(`card-${id}`);
            card.classList.toggle('selected');
            document.getElementById('q-fb').style.display = 'none'; // Uyarıyı temizle
        }

        function checkAnswers() {
            if(isCompleted) return;
            getAudioContext();
            
            const cards = ['a', 'b', 'c', 'd', 'e'];
            let allCorrect = true;
            let hasSelection = false;
            let wrongCards = [];

            // Doğru mantık: is-polygon=true olanlar seçili olmalı, is-polygon=false olanlar SEÇİLİ OLMAMALI.
            cards.forEach(id => {
                const card = document.getElementById(`card-${id}`);
                const isSelected = card.classList.contains('selected');
                const isPolygon = card.getAttribute('data-is-polygon') === 'true';

                if (isSelected) hasSelection = true;

                if ((isPolygon && !isSelected) || (!isPolygon && isSelected)) {
                    allCorrect = false;
                    // Sadece seçili olup yanlış olanları (yani seçilmemesi gerekirken seçilenleri) titretiyoruz
                    if (isSelected) wrongCards.push(card);
                }
            });

            const fbBox = document.getElementById('q-fb');
            const btnCheck = document.getElementById('btn-check');

            fbBox.className = "feedback-msg"; // Sınıfları sıfırla

            if (!hasSelection) {
                playSfx('error');
                fbBox.innerHTML = `Lütfen çokgen olan en az bir şekil seçiniz.`;
                fbBox.classList.add('fb-error');
                setTimeout(() => { fbBox.style.display = 'none'; }, 2500);
                return;
            }

            if(allCorrect) {
                // TAM BAŞARI
                isCompleted = true;
                playSfx('success');

                // Görsel güncelleme
                cards.forEach(id => {
                    const card = document.getElementById(`card-${id}`);
                    const isPolygon = card.getAttribute('data-is-polygon') === 'true';
                    card.classList.add('disabled');
                    
                    if (isPolygon) {
                        card.classList.remove('selected');
                        card.classList.add('is-correct');
                    }
                });

                if(attempts === 0 || attempts === 1) {
                    fbBox.innerHTML = `TEBRİKLER! <br><span style="font-weight:600; font-size:11.5px; display:block; margin-top:4px;">Doğrusal çizgilerden oluşan kapalı şekilleri (çokgenleri) doğru tespit ettiniz.</span>`;
                    fbBox.classList.add('fb-success');
                    
                    btnCheck.innerText = "TAMAMLANDI ✓";
                    btnCheck.classList.add('completed');
                    
                    showToast("Etkinlik başarıyla tamamlandı. İlerleyebilirsiniz.", "toast-success");
                    setVar('w6', true); // İLK VEYA 2. DENEME DOĞRU: w6 = true
                }
            } else {
                // HATA DURUMU
                attempts++;
                playSfx('error');

                if(attempts === 1) {
                    // 1. HATA
                    fbBox.innerHTML = `Hatalı seçimleriniz var. Çokgenlerin tüm kenarlarının DÜZ (doğrusal) çizgiler olması gerektiğini hatırlayın. Eğrisel çizgiler barındıran şekiller çokgen olamaz.`;
                    fbBox.classList.add('fb-error');
                    
                    // Yanlış seçilmiş olanları salla ve seçimini kaldır
                    wrongCards.forEach(card => {
                        card.classList.add('is-incorrect');
                        setTimeout(() => { card.classList.remove('is-incorrect', 'selected'); }, 1500);
                    });
                    
                    setTimeout(() => { fbBox.style.display = 'none'; }, 4000);

                } else {
                    // 2. HATA - OTOMATİK ÇÖZÜM VE SAYAÇ
                    isCompleted = true;
                    
                    fbBox.innerHTML = `Hakkınız bitti. Doğru cevaplar işaretleniyor...`;
                    fbBox.classList.add('fb-error');

                    // Yanlış seçimleri temizle
                    cards.forEach(id => {
                        const card = document.getElementById(`card-${id}`);
                        card.classList.remove('selected', 'is-incorrect');
                        card.classList.add('disabled');
                    });

                    // Gecikmeli doğru cevap animasyonu (a, b ve e'yi yeşil yap)
                    setTimeout(() => { 
                        document.getElementById('card-a').classList.add('is-correct'); playSfx('click'); 
                    }, 500);
                    setTimeout(() => { 
                        document.getElementById('card-b').classList.add('is-correct'); playSfx('click'); 
                    }, 1000);
                    setTimeout(() => { 
                        document.getElementById('card-e').classList.add('is-correct'); playSfx('click'); 
                    }, 1500);

                    // Sayaç başlat
                    setTimeout(() => {
                        fbBox.style.display = 'none';
                        triggerTimerAutoSolve("w7"); // HATA SONRASI OTOMATİK ÇÖZÜM: w7 = true
                    }, 2500);
                }
            }
        }

        // Sayaç fonksiyonu
        function triggerTimerAutoSolve(variableToSet) {
            const btnCheck = document.getElementById('btn-check');
            btnCheck.classList.add('timer-active'); 
            
            let countdown = 10;
            btnCheck.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
            
            const interval = setInterval(() => {
                countdown--;
                btnCheck.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
                
                if(countdown <= 0) {
                    clearInterval(interval);
                    btnCheck.innerText = "TAMAMLANDI ✓";
                    btnCheck.classList.remove('timer-active');
                    btnCheck.classList.add('completed');
                    
                    showToast("İnceleme tamamlandı, ilerleyebilirsiniz.", "toast-success");
                    setVar(variableToSet, true); // w7 değişkenini tetikle
                }
            }, 1000);
        }

        function showToast(msg, typeCls) {
            const toast = document.getElementById('toast-msg');
            document.getElementById('toast-text').innerText = msg;
            toast.className = ''; toast.classList.add('show');
            if(typeCls) toast.classList.add(typeCls);
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        function setVar(n, v) { 
            try { 
                parent.GetPlayer().SetVar(n, v); 
                console.log(`Storyline Variable Set: ${n} = ${v}`); 
            } catch(e) { 
                console.log(`(Local) Storyline Variable: ${n} = ${v}`); 
            } 
        }

        window.addEventListener('resize', () => {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        });
        
        window.onload = () => { 
            window.dispatchEvent(new Event('resize')); 
            init(); 
        };
    </script>
</body>
</html>
