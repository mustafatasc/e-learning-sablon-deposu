<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anahtar Kelimeler - Üçgenler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            /* Matematik Teması: Krem zemin, Kırmızı vurgular */
            --bg-cream: #FCF9F2;
            --grid-line: rgba(185, 28, 28, 0.08); /* Hafif kırmızımsı ızgara */
            
            --primary-red: #B91C1C; /* Koyu Kırmızı */
            --light-red: #FEF2F2;
            --hover-red: #DC2626;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            
            --success-green: #10B981;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0F172A; /* Dış zemin koyu */
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; color: var(--text-dark);
            user-select: none; -webkit-user-select: none;
        }

        * { scrollbar-width: thin; scrollbar-color: var(--primary-red) transparent; }
        *::-webkit-scrollbar { width: 6px; }
        *::-webkit-scrollbar-track { background: transparent; }
        *::-webkit-scrollbar-thumb { background-color: rgba(185, 28, 28, 0.3); border-radius: 10px; }

        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--bg-cream); 
            /* Matematik defteri ızgarası */
            background-image: 
                linear-gradient(var(--grid-line) 1.5px, transparent 1.5px), 
                linear-gradient(90deg, var(--grid-line) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-top: 6px solid var(--primary-red);
        }

        /* --- HEADER --- */
        .header {
            padding: 20px 40px 0 40px; height: 90px;
            display: flex; justify-content: space-between; align-items: flex-start;
            flex-shrink: 0; z-index: 10;
        }

        .instruction-container { flex: 1; padding: 0; }
        .instruction-text { font-size: 16px; line-height: 1.4; font-weight: 900; color: var(--primary-red); text-transform: uppercase; letter-spacing: 1px;}
        .sub-instruction { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-top: 4px; }
        
        .logo-right-container { width: 80px; height: 80px; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; margin-left: 20px; margin-top: -10px; }

        /* --- CONTENT --- */
        .content-wrapper {
            display: flex; flex-direction: column; flex: 1; padding: 10px 40px 25px 40px;
            height: calc(540px - 90px); z-index: 10; position: relative;
        }

        /* KELİME LİSTESİ (Responsive Grid - 4 Kelime için ortalı 2 kolon) */
        .keyword-grid {
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
            align-content: center; 
            flex: 1;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
        }

        .keyword-btn {
            background: white; border: 2.5px solid #E2E8F0; border-radius: 12px;
            padding: 16px 20px; text-align: left; font-size: 16px; font-weight: 800;
            color: var(--text-dark); cursor: pointer; transition: all 0.2s ease;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            position: relative; overflow: hidden;
        }

        .keyword-btn:hover {
            border-color: var(--primary-red); transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(185, 28, 28, 0.1);
        }

        .keyword-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 5px rgba(185, 28, 28, 0.1);
        }

        /* Tıklanan / Okunan Durum */
        .keyword-btn.visited {
            background: var(--light-red); border-color: rgba(185, 28, 28, 0.4);
            color: var(--primary-red);
        }
        
        /* Aktif Olarak Çalan Durum */
        .keyword-btn.playing {
            background: var(--primary-red); color: white; border-color: var(--primary-red);
            box-shadow: 0 6px 20px rgba(185, 28, 28, 0.4);
            transform: scale(1.05); z-index: 5;
        }

        .icon-status {
            width: 28px; height: 28px; border-radius: 50%;
            background: #f1f5f9; color: #94a3b8;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s; flex-shrink: 0;
        }
        
        .keyword-btn.visited .icon-status { background: white; color: var(--primary-red); }
        .keyword-btn.playing .icon-status { background: white; color: var(--primary-red); animation: pulsePlay 1.5s infinite; }

        @keyframes pulsePlay {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* Alt Kontrol Alanı (İlerleme ve Buton) */
        .bottom-controls {
            display: flex; justify-content: space-between; align-items: center;
            height: 60px; margin-top: auto; border-top: 2px dashed rgba(185, 28, 28, 0.2);
            padding-top: 15px;
        }

        .progress-container {
            display: flex; align-items: center; gap: 12px;
            background: white; padding: 10px 20px; border-radius: 30px;
            border: 2px solid #e2e8f0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .progress-text { font-size: 15px; font-weight: 900; color: var(--primary-red); }
        .progress-bar-bg { width: 150px; height: 10px; background: #E2E8F0; border-radius: 5px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary-red); width: 0%; transition: width 0.4s ease; }

        .btn-complete {
            background: var(--success-green); color: white;
            font-size: 16px; font-weight: 800; padding: 14px 40px; border-radius: 12px;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4); border: none;
            cursor: pointer; transition: all 0.3s;
            display: none; align-items: center; justify-content: center; gap: 8px;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-complete:hover { background: #059669; transform: translateY(-3px); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.5);}
        .btn-complete.done { background: var(--text-dark); box-shadow: none; transform: none; cursor: default; pointer-events: none;}

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Toast Bildirimi */
        #toast-msg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background-color: var(--success-green); color: white; font-weight: 800; font-size: 14px;
            padding: 12px 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000;
        }
        #toast-msg.show { transform: translateX(-50%) translateY(0); }

    </style>
</head>
<body>

    <!-- Intro Audio (Sayfa açılışında çalar) -->
    <audio id="ses_intro" src="ses_intro.mp3" preload="auto"></audio>
    
    <!-- Anahtar Kelime Sesleri (4 Adet) -->
    <audio id="ses1" src="ses1.mp3" preload="auto"></audio>
    <audio id="ses2" src="ses2.mp3" preload="auto"></audio>
    <audio id="ses3" src="ses3.mp3" preload="auto"></audio>
    <audio id="ses4" src="ses4.mp3" preload="auto"></audio>

    <!-- STREAMING_CHUNK: Setting up the layout structure -->
    <div id="scale-container">
        
        <div id="toast-msg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="toast-text">Harika! Kavramları tamamladınız.</span>
        </div>

        <header class="header">
            <div class="instruction-container">
                <div class="instruction-text">ANAHTAR KELİMELER</div>
                <div class="sub-instruction">Kavramların üzerine tıklayarak sırasıyla dinleyiniz.</div>
            </div>
            
            <div class="logo-right-container">
                <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none';">
            </div>
        </header>

        <main class="content-wrapper">
            
            <!-- KAVRAMLAR IZGARASI -->
            <div class="keyword-grid" id="keyword-list">
                <!-- JS ile Doldurulacak -->
            </div>

            <!-- ALT KONTROLLER -->
            <div class="bottom-controls">
                
                <div class="progress-container">
                    <span class="progress-text" id="prog-txt">0 / 4</span>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="prog-fill"></div>
                    </div>
                </div>

                <button id="btn-complete" class="btn-complete" onclick="completeModule()">
                    TAMAMLA ✓
                </button>
                
            </div>

        </main>
    </div>

    <!-- STREAMING_CHUNK: Initializing interactivity -->
    <script>
        let audioCtx = null;
        function getAudioContext() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
        
        function playSfx(type) {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type==='click') { osc.type='triangle'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime+0.1); }
                else if(type==='success') { 
                    osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); 
                }
                gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }

        // Kavramlar (Görseldeki Liste: 4 Kelime)
        const keywordsData = [
            { id: 1, title: "Eşkenar üçgen" },
            { id: 2, title: "İkizkenar üçgen" },
            { id: 3, title: "Çeşitkenar üçgen" },
            { id: 4, title: "Çember" }
        ];

        let visitedSet = new Set();
        let isCompleted = false;

        // Play simgesi SVG
        const playIcon = `<svg class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.546-2.07-2.584-1.23L6.15 6.75H3A1.5 1.5 0 001.5 8.25v7.5A1.5 1.5 0 003 17.25h3.15l4.766 3.92c1.038.84 2.584.106 2.584-1.23V4.06z"/></svg>`;
        // Check simgesi SVG
        const checkIcon = `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;

        function init() {
            const listContainer = document.getElementById('keyword-list');
            
            keywordsData.forEach(item => {
                const btn = document.createElement('div');
                btn.className = 'keyword-btn';
                btn.id = `btn-${item.id}`;
                btn.innerHTML = `
                    <span>${item.title}</span>
                    <div class="icon-status" id="icon-${item.id}">${playIcon}</div>
                `;
                btn.onclick = () => selectKeyword(item.id);
                listContainer.appendChild(btn);
            });

            // Intro sesini çal (varsa)
            const introAudio = document.getElementById('ses_intro');
            if(introAudio) {
                introAudio.play().catch(e => console.log("Intro ses engellendi."));
            }
        }

        // Bütün sesleri durduran yardımcı fonksiyon
        function stopAllAudio() {
            for(let i=1; i<=keywordsData.length; i++) {
                const a = document.getElementById(`ses${i}`);
                if(a) { 
                    a.pause(); 
                    a.currentTime = 0; 
                    // İlgili butonun playing sınıfını kaldır, iconu güncelle
                    const btn = document.getElementById(`btn-${i}`);
                    if(btn) {
                        btn.classList.remove('playing');
                        const icon = document.getElementById(`icon-${i}`);
                        if(visitedSet.has(i)) {
                            icon.innerHTML = checkIcon;
                        } else {
                            icon.innerHTML = playIcon;
                        }
                    }
                }
            }
            const intro = document.getElementById('ses_intro');
            if(intro) { intro.pause(); intro.currentTime = 0; }
        }

        // STREAMING_CHUNK: Handling selection and progress tracking
        function selectKeyword(id) {
            getAudioContext();
            stopAllAudio(); // Diğerlerini durdur

            // Buton durumlarını güncelle
            const activeBtn = document.getElementById(`btn-${id}`);
            activeBtn.classList.add('playing');
            activeBtn.classList.add('visited');
            
            const icon = document.getElementById(`icon-${id}`);
            icon.innerHTML = playIcon; // Çalarken play ikonu kalsın ama canlansın (css ile)

            // Seçilen sesi çal
            const targetAudio = document.getElementById(`ses${id}`);
            if(targetAudio) {
                targetAudio.play().catch(e => console.log(`ses${id} oynatılamadı.`));
                
                // Ses bitince playing sınıfını kaldır
                targetAudio.onended = () => {
                    activeBtn.classList.remove('playing');
                    icon.innerHTML = checkIcon;
                };
            } else {
                // Ses yoksa kısa bir süre sonra playing sınıfını kaldır
                setTimeout(() => {
                    activeBtn.classList.remove('playing');
                    icon.innerHTML = checkIcon;
                }, 1000);
            }

            // İlerlemeyi kaydet
            if(!visitedSet.has(id)) {
                visitedSet.add(id);
                updateProgress();
            }
        }

        function updateProgress() {
            const count = visitedSet.size;
            const total = keywordsData.length;
            const percent = (count / total) * 100;

            document.getElementById('prog-txt').innerText = `${count} / ${total}`;
            document.getElementById('prog-fill').style.width = `${percent}%`;

            if(count === total && !isCompleted) {
                const btnComp = document.getElementById('btn-complete');
                btnComp.style.display = 'flex';
                playSfx('success');
            }
        }

        function completeModule() {
            if(isCompleted) return;
            isCompleted = true;
            
            stopAllAudio();
            playSfx('click');

            const btn = document.getElementById('btn-complete');
            btn.classList.add('done');
            btn.innerText = 'TAMAMLANDI ✓';

            showToast();

            // Storyline Değişkeni: b1
            setVar('b1', true);
        }

        function showToast() {
            const toast = document.getElementById('toast-msg');
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        function setVar(n, v) { 
            try { 
                parent.GetPlayer().SetVar(n, v); 
                console.log(`Storyline Variable Set: ${n} = ${v}`); 
            } catch(e) { 
                console.log(`(Local) Storyline Variable: ${n} = ${v}`); 
            } 
        }

        window.addEventListener('resize', () => {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        });
        
        window.onload = () => { 
            window.dispatchEvent(new Event('resize')); 
            init(); 
        };
    </script>
</body>
</html>
