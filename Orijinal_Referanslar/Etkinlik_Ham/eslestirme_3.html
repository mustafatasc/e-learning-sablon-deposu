<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Etkinlik: Dik Doğrular</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            --bg-cream: #FCF9F2;
            --grid-line: rgba(185, 28, 28, 0.08);
            
            --primary-red: #B91C1C; 
            --light-red: #FEF2F2;
            --text-dark: #1E293B;
            --success-green: #10B981;
            --error-red: #EF4444;
            --cyan-accent: #0ea5e9;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0F172A; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; 
            color: var(--text-dark);
            user-select: none; -webkit-user-select: none;
            visibility: hidden; 
        }

        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--bg-cream); 
            background-image: 
                linear-gradient(var(--grid-line) 1.5px, transparent 1.5px), 
                linear-gradient(90deg, var(--grid-line) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-top: 6px solid var(--primary-red);
        }

        .content-wrapper {
            display: flex; flex-direction: column; flex: 1; padding: 25px 40px; height: 100%;
            z-index: 10; position: relative; gap: 15px;
        }

        /* --- ÜST YÖNERGE ALANI --- */
        .top-header-area {
            display: flex; justify-content: space-between; align-items: flex-start; width: 100%;
        }

        .instruction-group {
            display: flex; align-items: center; gap: 15px; flex: 1;
            background: white; border-radius: 12px; padding: 12px 20px 12px 15px;
            border-left: 5px solid #1D4ED8;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        .instruction-text {
            font-size: 15px; line-height: 1.4; font-weight: 700; color: var(--text-dark);
        }

        .logo-right-container {
            width: 70px; height: 70px; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; margin-left: 20px; margin-top: -5px;
        }

        /* Ses Butonu */
        .narrator-speaker {
            width: 36px; height: 36px; background: var(--primary-red); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(185, 28, 28, 0.4); cursor: pointer;
        }

        @keyframes pulsePlay {
            0% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(185, 28, 28, 0); }
            100% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0); }
        }

        /* --- ORTA ALAN --- */
        .main-activity-area {
            display: flex; gap: 30px; flex: 1; min-height: 0; align-items: stretch;
        }

        /* Sol: SVG Kareli Zemin */
        .svg-board {
            flex: 2; background-color: white; border: 3px solid #cbd5e1; border-radius: 12px;
            position: relative; overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.02);
            display: flex; justify-content: center; align-items: center;
        }

        /* Sağ: Durum Paneli */
        .status-panel {
            flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center;
        }

        .status-card {
            background: white; border: 2px dashed #cbd5e1; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; padding: 15px;
            font-size: 16px; font-weight: 800; color: #94a3b8; transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02); height: 60px;
        }

        .status-card.matched {
            background: #ecfdf5; border-color: var(--success-green); border-style: solid;
            color: var(--success-green); box-shadow: 0 4px 10px rgba(16, 185, 129, 0.1);
        }

        /* --- İNTERAKTİF NOKTA STİLLERİ --- */
        .pt-group { cursor: pointer; }
        
        .hitbox { fill: transparent; }
        
        .dot { 
            fill: var(--text-dark); transition: all 0.2s; 
            transform-box: fill-box; transform-origin: center; /* Kaymayı önler */
        }
        
        .ring {
            fill: transparent; stroke: transparent; stroke-width: 3px; transition: all 0.2s;
        }

        .label {
            font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 800; fill: var(--text-dark);
            transition: all 0.2s; pointer-events: none;
        }

        /* Hover & Seçili */
        .pt-group:hover .ring { stroke: #cbd5e1; }
        .pt-group.selected .dot { fill: var(--primary-red); transform: scale(1.2); }
        .pt-group.selected .ring { stroke: var(--primary-red); }
        .pt-group.selected .label { fill: var(--primary-red); }

        /* Hata / Doğru */
        .pt-group.is-error { animation: shake 0.4s ease-in-out; }
        .pt-group.is-error .dot { fill: var(--error-red); }
        .pt-group.is-error .ring { stroke: var(--error-red); }
        .pt-group.is-error .label { fill: var(--error-red); }

        .pt-group.matched .dot { fill: var(--success-green); }
        .pt-group.matched .label { fill: var(--success-green); }
        .pt-group.matched { pointer-events: none; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        /* Çizilen Doğrular */
        .drawn-line {
            stroke: var(--success-green); stroke-width: 3.5; stroke-dasharray: 8,6;
            animation: drawLine 0.5s ease-out forwards;
        }

        @keyframes drawLine {
            from { stroke-dashoffset: 100; opacity: 0; }
            to { stroke-dashoffset: 0; opacity: 1; }
        }

        /* --- ALT PANEL VE BUTON --- */
        .bottom-panel {
            display: flex; justify-content: flex-end; align-items: center; height: 50px;
        }

        .btn-action {
            background: var(--success-green); color: white; min-width: 200px; height: 50px;
            font-size: 15px; font-weight: 800; border-radius: 12px;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3); border: none;
            cursor: pointer; transition: all 0.4s; letter-spacing: 1px;
            opacity: 0; pointer-events: none; transform: translateY(15px);
        }
        
        .btn-action.show {
            opacity: 1; pointer-events: auto; transform: translateY(0);
        }

        .btn-action:hover { background: #059669; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); }
        .btn-action.completed { background: #64748b; pointer-events: none; transform: none; box-shadow: none;}

        /* Toast Bildirimi */
        #toast-msg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background-color: var(--success-green); color: white; font-weight: 800; font-size: 14px;
            padding: 12px 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000;
        }
        #toast-msg.show { transform: translateX(-50%) translateY(0); }

    </style>
</head>
<body>

    <div id="scale-container">
        
        <!-- Ses Dosyası -->
        <audio id="ses1" src="ses1.mp3" preload="auto" autoplay></audio>

        <div id="toast-msg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="toast-text"></span>
        </div>

        <main class="content-wrapper">
            
            <!-- ÜST YÖNERGE ALANI -->
            <div class="top-header-area">
                <div class="instruction-group">
                    <div id="main-speaker" class="narrator-speaker" onclick="playAudio('ses1')">
                        <svg class="w-5 h-5 pl-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.546-2.07-2.584-1.23L6.15 6.75H3A1.5 1.5 0 001.5 8.25v7.5A1.5 1.5 0 003 17.25h3.15l4.766 3.92c1.038.84 2.584.106 2.584-1.23V4.06z"/></svg>
                    </div>
                    <div class="instruction-text">
                        Aşağıda kareli zeminde verilen <strong>d</strong> doğrusuna dik doğrular çizilecektir. Buna göre birleştirilmesi gereken nokta ikililerine tıklayınız.
                    </div>
                </div>
                <div class="logo-right-container">
                    <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none';">
                </div>
            </div>

            <!-- ORTA ALAN -->
            <div class="main-activity-area">
                
                <!-- SOL: Kareli Zemin ve Çizim (400x400) -->
                <div class="svg-board">
                    <svg width="100%" height="100%" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Kareli Zemin Deseni SVG içine gömüldü -->
                            <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
                                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="2"/>
                            </pattern>
                            <!-- Sol üstü gösteren ok ucu -->
                            <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                                <path d="M 10 2 L 0 5 L 10 8 z" fill="var(--cyan-accent)"/> 
                            </marker>
                            <!-- Sağ altı gösteren ok ucu -->
                            <marker id="arrow-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                                <path d="M 0 2 L 10 5 L 0 8 z" fill="var(--cyan-accent)"/> 
                            </marker>
                        </defs>

                        <!-- Zemin Çizimi -->
                        <rect width="400" height="400" fill="url(#gridPattern)" />

                        <!-- Eşleşen Çizgiler Buraya Eklenecek -->
                        <g id="matched-lines"></g>

                        <!-- Doğru d (Tam karelerin köşegenlerinden geçer) -->
                        <line x1="40" y1="40" x2="320" y2="320" stroke="var(--cyan-accent)" stroke-width="3" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
                        <text x="30" y="30" fill="var(--cyan-accent)" font-family="Montserrat" font-weight="800" font-size="20">d</text>

                        <!-- MİLİMETRİK MATEMATİKSEL NOKTALAR -->
                        
                        <!-- A Noktası -->
                        <g class="pt-group" id="pt-A" onclick="handlePtClick('A')">
                            <circle cx="80" cy="200" r="16" class="hitbox" />
                            <circle cx="80" cy="200" r="10" class="ring" />
                            <circle cx="80" cy="200" r="4" class="dot" />
                            <text x="60" y="195" class="label">A</text>
                        </g>

                        <!-- B Noktası -->
                        <g class="pt-group" id="pt-B" onclick="handlePtClick('B')">
                            <circle cx="80" cy="240" r="16" class="hitbox" />
                            <circle cx="80" cy="240" r="10" class="ring" />
                            <circle cx="80" cy="240" r="4" class="dot" />
                            <text x="60" y="235" class="label">B</text>
                        </g>

                        <!-- C Noktası -->
                        <g class="pt-group" id="pt-C" onclick="handlePtClick('C')">
                            <circle cx="120" cy="240" r="16" class="hitbox" />
                            <circle cx="120" cy="240" r="10" class="ring" />
                            <circle cx="120" cy="240" r="4" class="dot" />
                            <text x="105" y="230" class="label">C</text>
                        </g>

                        <!-- D Noktası -->
                        <g class="pt-group" id="pt-D" onclick="handlePtClick('D')">
                            <circle cx="160" cy="240" r="16" class="hitbox" />
                            <circle cx="160" cy="240" r="10" class="ring" />
                            <circle cx="160" cy="240" r="4" class="dot" />
                            <text x="145" y="230" class="label">D</text>
                        </g>

                        <!-- F Noktası -->
                        <g class="pt-group" id="pt-F" onclick="handlePtClick('F')">
                            <circle cx="160" cy="280" r="16" class="hitbox" />
                            <circle cx="160" cy="280" r="10" class="ring" />
                            <circle cx="160" cy="280" r="4" class="dot" />
                            <text x="140" y="285" class="label">F</text>
                        </g>

                        <!-- S Noktası -->
                        <g class="pt-group" id="pt-S" onclick="handlePtClick('S')">
                            <circle cx="200" cy="80" r="16" class="hitbox" />
                            <circle cx="200" cy="80" r="10" class="ring" />
                            <circle cx="200" cy="80" r="4" class="dot" />
                            <text x="180" y="70" class="label">S</text>
                        </g>

                        <!-- P Noktası -->
                        <g class="pt-group" id="pt-P" onclick="handlePtClick('P')">
                            <circle cx="280" cy="80" r="16" class="hitbox" />
                            <circle cx="280" cy="80" r="10" class="ring" />
                            <circle cx="280" cy="80" r="4" class="dot" />
                            <text x="270" y="70" class="label">P</text>
                        </g>

                        <!-- R Noktası -->
                        <g class="pt-group" id="pt-R" onclick="handlePtClick('R')">
                            <circle cx="240" cy="160" r="16" class="hitbox" />
                            <circle cx="240" cy="160" r="10" class="ring" />
                            <circle cx="240" cy="160" r="4" class="dot" />
                            <text x="225" y="175" class="label">R</text>
                        </g>

                        <!-- T Noktası -->
                        <g class="pt-group" id="pt-T" onclick="handlePtClick('T')">
                            <circle cx="280" cy="160" r="16" class="hitbox" />
                            <circle cx="280" cy="160" r="10" class="ring" />
                            <circle cx="280" cy="160" r="4" class="dot" />
                            <text x="285" y="175" class="label">T</text>
                        </g>
                    </svg>
                </div>

                <!-- SAĞ: Eşleşme Durumu Paneli -->
                <div class="status-panel">
                    <div style="font-size:14px; font-weight:800; color:#64748b; text-align:center; text-transform:uppercase; margin-bottom:5px;">Bulunan Dikmeler</div>
                    <div class="status-card" id="slot-1">? - ?</div>
                    <div class="status-card" id="slot-2">? - ?</div>
                    <div class="status-card" id="slot-3">? - ?</div>
                    <div class="status-card" id="slot-4">? - ?</div>
                </div>

            </div>

            <!-- ALT PANEL: Buton -->
            <div class="bottom-panel">
                <button id="btn-complete" class="btn-action" onclick="completeTopic()">
                    TAMAMLA ✓
                </button>
            </div>

        </main>
    </div>

    <script>
        let audioCtx = null;
        let isAudioPlaying = false;

        function getAudioContext() { 
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            return audioCtx; 
        }

        function playSfx(type) {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type==='click') { osc.type='triangle'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime+0.1); }
                else if(type==='success') { osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); }
                else if(type==='error') { osc.type='sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.linearRampToValueAtTime(150, ctx.currentTime+0.3); }
                gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }

        // Zorunlu Otomatik Oynatma Fonksiyonu
        function forceAutoplay() {
            if (isAudioPlaying) return; 
            const audio = document.getElementById('ses1');
            const speaker = document.getElementById('main-speaker');
            
            if (audio) {
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                        window.removeEventListener('click', forceAutoplay);
                        window.removeEventListener('touchstart', forceAutoplay);
                    }).catch(error => {
                        if(speaker) speaker.style.animation = 'none';
                    });
                }
            }
        }
        
        function playAudio(id) {
            const audio = document.getElementById(id);
            const speaker = document.getElementById('main-speaker');
            if(audio) {
                audio.pause(); audio.currentTime = 0; 
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                    }).catch(e => console.log(e));
                }
            }
        }

        // --- ETKİNLİK MANTIĞI ---
        const coords = {
            'A': {x: 80, y: 200},
            'B': {x: 80, y: 240},
            'C': {x: 120, y: 240},
            'D': {x: 160, y: 240},
            'F': {x: 160, y: 280},
            'S': {x: 200, y: 80},
            'P': {x: 280, y: 80},
            'R': {x: 240, y: 160},
            'T': {x: 280, y: 160}
        };

        const validPairs = [
            ['A', 'S'], ['S', 'A'],
            ['P', 'C'], ['C', 'P'],
            ['R', 'D'], ['D', 'R'],
            ['F', 'T'], ['T', 'F']
        ];

        let selectedPoint = null;
        let matchedCount = 0;
        let isCompleted = false;

        function handlePtClick(id) {
            if (isCompleted) return;
            let el = document.getElementById(`pt-${id}`);
            
            if (el.classList.contains('matched')) return;

            if (!selectedPoint) {
                // İlk noktayı seç
                selectedPoint = id;
                el.classList.add('selected');
                playSfx('click');
            } else if (selectedPoint === id) {
                // Aynı noktaya tıklarsa seçimi kaldır
                selectedPoint = null;
                el.classList.remove('selected');
                playSfx('click');
            } else {
                // İkinci nokta seçildi, kontrol et
                let isValid = validPairs.some(p => p[0] === selectedPoint && p[1] === id);
                let p1El = document.getElementById(`pt-${selectedPoint}`);
                let p2El = el;

                if (isValid) {
                    // Eşleşme Doğru
                    drawLine(selectedPoint, id);
                    p1El.classList.remove('selected');
                    p1El.classList.add('matched');
                    p2El.classList.add('matched');
                    
                    matchedCount++;
                    updateStatusPanel(selectedPoint, id, matchedCount);
                    playSfx('success');
                    selectedPoint = null;

                    if (matchedCount === 4) {
                        isCompleted = true;
                        document.getElementById('btn-complete').classList.add('show');
                        showToast("Harika! Tüm dikmeleri buldunuz.");
                    }
                } else {
                    // Eşleşme Yanlış
                    playSfx('error');
                    p1El.classList.add('is-error');
                    p2El.classList.add('is-error');
                    
                    setTimeout(() => {
                        p1El.classList.remove('is-error', 'selected');
                        p2El.classList.remove('is-error');
                        selectedPoint = null;
                    }, 500);
                }
            }
        }

        function drawLine(id1, id2) {
            let svg = document.getElementById('matched-lines');
            let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", coords[id1].x);
            line.setAttribute("y1", coords[id1].y);
            line.setAttribute("x2", coords[id2].x);
            line.setAttribute("y2", coords[id2].y);
            line.setAttribute("class", "drawn-line");
            svg.appendChild(line);
        }

        function updateStatusPanel(id1, id2, count) {
            let slot = document.getElementById(`slot-${count}`);
            slot.innerHTML = `${id1} - ${id2}`;
            slot.classList.add('matched');
        }

        function completeTopic() {
            playSfx('success');
            const btn = document.getElementById('btn-complete');
            btn.innerHTML = `TAMAMLANDI ✓`;
            btn.classList.add('completed');
            
            // w23 değişkenini tetikle
            setVar('w23', true);
            showToast("Etkinlik başarıyla tamamlandı. İlerleyebilirsiniz.");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-msg');
            document.getElementById('toast-text').innerText = msg;
            toast.className = ''; toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        function setVar(n, v) { 
            try { 
                parent.GetPlayer().SetVar(n, v); 
                console.log(`Storyline Variable Set: ${n} = ${v}`); 
            } catch(e) { 
                console.log(`(Local) Storyline Variable: ${n} = ${v}`); 
            } 
        }

        function applyScale() {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        }

        window.onload = () => {
            const s = document.getElementById('ses1');
            if(s) {
                s.addEventListener('ended', () => {
                    const speaker = document.getElementById('main-speaker');
                    if(speaker) speaker.style.animation = 'none'; 
                    isAudioPlaying = false; 
                });
            }
            forceAutoplay();
            window.addEventListener('click', forceAutoplay);
            window.addEventListener('touchstart', forceAutoplay);
        };

        applyScale(); 
        document.body.style.visibility = 'visible'; 
        window.addEventListener('resize', applyScale);

    </script>
</body>
</html>
