<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eş Çemberlerin Yarıçapını Bulma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            /* Matematik Teması: Krem zemin, Kırmızı vurgular */
            --bg-cream: #FCF9F2;
            --grid-line: rgba(185, 28, 28, 0.08); 
            
            --primary-red: #B91C1C; 
            --primary-dark: #7F1D1D;
            --primary-soft: #FCA5A5;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            
            --success-green: #10B981;
            --error-red: #EF4444;
            --warning-orange: #F59E0B;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #030712; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; color: var(--text-dark);
            user-select: none; -webkit-user-select: none;
        }

        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        *::-webkit-scrollbar { display: none !important; }

        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--bg-cream); 
            background-image: 
                linear-gradient(var(--grid-line) 1.5px, transparent 1.5px), 
                linear-gradient(90deg, var(--grid-line) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-top: 6px solid var(--primary-red);
        }

        #scale-container::before {
            content: ''; position: absolute; top: -20%; left: -20%; width: 150%; height: 150%;
            background: radial-gradient(circle, rgba(185, 28, 28, 0.08) 0%, transparent 60%);
            z-index: 0; pointer-events: none;
        }

        /* --- HEADER --- */
        .header {
            padding: 20px 40px 0 40px; height: 95px;
            display: flex; justify-content: space-between; align-items: start;
            flex-shrink: 0; z-index: 10;
        }

        .instruction-container { flex: 1; padding: 0; display: flex; flex-direction: column; justify-content: center; height: 100%;}
        .instruction-text { font-size: 16px; line-height: 1.4; font-weight: 900; color: var(--primary-dark); text-align: left; text-transform: uppercase; letter-spacing: 0.5px;}
        .sub-instruction { font-size: 13.5px; font-weight: 600; color: #475569; margin-top: 4px; }
        .logo-right-container { width: 85px; height: 85px; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; margin-left: 20px; margin-top: -10px; }

        /* --- CONTENT --- */
        .content-wrapper {
            display: flex; flex-direction: column; flex: 1; padding: 0 40px 20px 40px; gap: 15px; height: calc(540px - 95px);
            z-index: 10;
        }

        /* Soru Kartları İçin 2 Kolonlu Izgara */
        .questions-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 25px; flex: 1; min-height: 0;
        }

        .question-card {
            background: white; border: 2px solid rgba(185, 28, 28, 0.15); border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            position: relative;
        }

        .q-label {
            position: absolute; top: 15px; left: 20px; font-size: 20px; font-weight: 900; color: var(--primary-red);
        }

        /* SVG Çizim Alanı (Matematik Kağıdı Görünümlü) */
        .svg-container {
            width: 100%; height: 200px; display: flex; align-items: center; justify-content: center;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 12px; border: 1px solid #f1f5f9;
        }

        .math-svg { width: 100%; height: 100%; }
        
        .svg-text { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 15px; fill: #1e293b; }

        /* Girdi Kutusu Alanı */
        .input-area {
            display: flex; flex-direction: row; gap: 20px; align-items: center; justify-content: center;
            width: 100%; padding-top: 15px; border-top: 2px dashed #e2e8f0;
        }

        .equation-text { font-size: 18px; font-weight: 800; color: #334155; display: flex; align-items: center; gap: 10px;}
        
        .math-input {
            width: 60px; height: 40px; border: 2px dashed #94a3b8; border-radius: 8px;
            text-align: center; font-size: 20px; font-weight: 800; color: #2563eb;
            background: #f8fafc; outline: none; transition: all 0.2s; font-family: 'Montserrat', sans-serif;
        }
        .math-input:focus { border-color: var(--primary-red); background: white; box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.1); }
        
        /* Hata / Doğru Durumları */
        .math-input.is-correct { border-color: var(--success-green); background: #ecfdf5; color: #065f46; border-style: solid; pointer-events: none;}
        .math-input.is-incorrect { border-color: var(--error-red); background: #fef2f2; color: #991b1b; border-style: solid; animation: shake 0.4s ease-in-out;}
        .math-input.disabled { pointer-events: none; opacity: 0.8; }

        /* Kontrol Paneli */
        .control-panel { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: auto; }

        .feedback-msg {
            font-size: 13px; font-weight: 800; text-align: center; padding: 10px 20px; border-radius: 10px;
            display: none; line-height: 1.4; width: 100%; max-width: 600px;
        }
        .fb-success { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #10b981; }
        .fb-error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #ef4444; }

        .btn-action {
            background: var(--primary-red); color: white; width: 300px; height: 50px;
            font-size: 15px; font-weight: 800; border-radius: 12px;
            box-shadow: 0 6px 15px rgba(185, 28, 28, 0.3); border: none;
            cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
        }
        .btn-action:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(185, 28, 28, 0.4); }
        .btn-action.completed { background: var(--success-green); pointer-events: none; transform: none; box-shadow: none;}
        .btn-action.timer-active { background: var(--warning-orange); pointer-events: none; transform: none; box-shadow: none;}

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* Toast Bildirimleri */
        #toast-msg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background-color: var(--primary-dark); color: white; font-weight: 800; font-size: 14px;
            padding: 12px 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000;
        }
        #toast-msg.show { transform: translateX(-50%) translateY(0); }

    </style>
</head>
<body>

    <!-- Yönerge Ses Dosyası (ses1.mp3) -->
    <audio id="audio1" src="ses1.mp3" preload="auto"></audio>

    <div id="scale-container">
        
        <div id="toast-msg">
            <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="toast-text">Tebrikler!</span>
        </div>

        <header class="header">
            <div class="instruction-container">
                <div class="instruction-text">ETKİNLİK</div>
                <div class="sub-instruction">Aşağıdaki şekillerde verilenlere göre eş çemberlerin yarıçap uzunluklarını bulunuz.</div>
            </div>
            <!-- Logo -->
            <div class="logo-right-container">
                <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none';">
            </div>
        </header>

        <main class="content-wrapper">
            
            <div class="questions-grid">
                
                <!-- Soru a -->
                <div class="question-card">
                    <div class="q-label">a)</div>
                    
                    <div class="svg-container">
                        <!-- 4 Eş Çember: r=45, Merkezler: A(65), B(110), C(155), D(200) | AB, BC, CD arası uzaklık = r = 45 -->
                        <svg class="math-svg" viewBox="0 0 265 150">
                            <!-- Çizgi -->
                            <line x1="65" y1="75" x2="200" y2="75" stroke="#ec4899" stroke-width="2.5" />
                            
                            <!-- Çemberler (A, B, C, D) -->
                            <circle cx="65" cy="75" r="45" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
                            <circle cx="110" cy="75" r="45" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
                            <circle cx="155" cy="75" r="45" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
                            <circle cx="200" cy="75" r="45" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
                            
                            <!-- Noktalar -->
                            <circle cx="65" cy="75" r="3.5" fill="#ec4899"/>
                            <circle cx="110" cy="75" r="3.5" fill="#ec4899"/>
                            <circle cx="155" cy="75" r="3.5" fill="#ec4899"/>
                            <circle cx="200" cy="75" r="3.5" fill="#ec4899"/>
                            
                            <!-- Etiketler -->
                            <text x="65" y="95" class="svg-text" text-anchor="middle">A</text>
                            <text x="110" y="95" class="svg-text" text-anchor="middle">B</text>
                            <text x="155" y="95" class="svg-text" text-anchor="middle">C</text>
                            <text x="200" y="95" class="svg-text" text-anchor="middle">D</text>
                        </svg>
                    </div>

                    <div class="input-area">
                        <div class="equation-text">|AD| = 36 cm</div>
                        <div class="equation-text">r = <input type="text" id="in-a" class="math-input" data-ans="12" maxlength="3"> cm</div>
                    </div>
                </div>

                <!-- Soru b -->
                <div class="question-card">
                    <div class="q-label">b)</div>
                    
                    <div class="svg-container">
                        <!-- 2 Eş Çember: r=55, Merkezler: F(110), G(165) | Sol Kıyı E(55), Sağ Kıyı H(220) | Toplam EH=165 -->
                        <svg class="math-svg" viewBox="0 0 275 150">
                            <!-- Merkez Çizgisi -->
                            <line x1="55" y1="75" x2="220" y2="75" stroke="#1e293b" stroke-width="2.5" />
                            
                            <!-- Çemberler -->
                            <circle cx="110" cy="75" r="55" fill="none" stroke="#1e293b" stroke-width="2.5"/>
                            <circle cx="165" cy="75" r="55" fill="none" stroke="#1e293b" stroke-width="2.5"/>
                            
                            <!-- Noktalar (E, F, G, H) -->
                            <circle cx="55" cy="75" r="3.5" fill="#1e293b"/>
                            <circle cx="110" cy="75" r="3.5" fill="#1e293b"/>
                            <circle cx="165" cy="75" r="3.5" fill="#1e293b"/>
                            <circle cx="220" cy="75" r="3.5" fill="#1e293b"/>
                            
                            <!-- Etiketler -->
                            <text x="40" y="95" class="svg-text" text-anchor="middle">E</text>
                            <text x="100" y="95" class="svg-text" text-anchor="middle">F</text>
                            <text x="155" y="95" class="svg-text" text-anchor="middle">G</text>
                            <text x="235" y="95" class="svg-text" text-anchor="middle">H</text>
                        </svg>
                    </div>

                    <div class="input-area">
                        <div class="equation-text">|EH| = 48 cm</div>
                        <div class="equation-text">r = <input type="text" id="in-b" class="math-input" data-ans="16" maxlength="3"> cm</div>
                    </div>
                </div>

            </div>

            <div class="control-panel">
                <div id="q-fb" class="feedback-msg"></div>
                <button id="btn-check" class="btn-action" onclick="checkAnswers()">KONTROL ET</button>
            </div>

        </main>
    </div>

    <script>
        let audioCtx = null;
        function getAudioContext() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
        
        function playSfx(type) {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type==='click') { osc.type='triangle'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime+0.1); }
                else if(type==='success') { osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); }
                else if(type==='error') { osc.type='sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.linearRampToValueAtTime(150, ctx.currentTime+0.3); }
                gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }

        let isCompleted = false;
        let attempts = 0;

        function init() {
            // Sadece sayı girilmesine izin ver ve Enter ile geçişi sağla
            document.querySelectorAll('.math-input').forEach(input => {
                input.addEventListener('input', function() {
                    this.value = this.value.replace(/[^0-9]/g, '');
                    this.classList.remove('is-incorrect'); 
                    getAudioContext(); 
                });
                
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        const inputs = Array.from(document.querySelectorAll('.math-input:not(.is-correct)'));
                        const index = inputs.indexOf(this);
                        if (index > -1 && index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        } else if (index === inputs.length - 1) {
                            checkAnswers();
                        }
                    }
                });
            });

            document.getElementById('audio1').play().catch(()=>{});
        }

        function checkAnswers() {
            if(isCompleted) return;
            getAudioContext();
            
            let allCorrect = true;
            let allFilled = true;
            let inputs = document.querySelectorAll('.math-input');

            inputs.forEach(input => {
                if(input.classList.contains('is-correct')) return; 

                let val = input.value.trim();
                if (val === '') {
                    allFilled = false;
                    allCorrect = false;
                    input.classList.add('is-incorrect');
                } else {
                    let userAns = parseInt(val);
                    let correctAns = parseInt(input.getAttribute('data-ans'));

                    if (userAns === correctAns) {
                        input.classList.remove('is-incorrect');
                        input.classList.add('is-correct');
                    } else {
                        allCorrect = false;
                        input.classList.add('is-incorrect');
                    }
                }
            });

            const fbBox = document.getElementById('q-fb');
            const btnCheck = document.getElementById('btn-check');

            fbBox.className = "feedback-msg"; // Reset

            if(allCorrect) {
                // TAM BAŞARI
                isCompleted = true;
                playSfx('success');

                if(attempts === 0 || attempts === 1) {
                    fbBox.innerHTML = `TEBRİKLER! <br><span style="font-weight:600; font-size:11px; display:block; margin-top:4px;">Yarıçapları doğru hesapladınız.</span>`;
                    fbBox.classList.add('fb-success');
                    
                    btnCheck.innerText = "TAMAMLANDI ✓";
                    btnCheck.classList.add('completed');
                    
                    showToast("Etkinlik başarıyla tamamlandı. İlerleyebilirsiniz.", "text-emerald-400");
                    setVar('w16', true); // İLK VEYA 2. DENEME DOĞRU: w16 = true
                }
            } else {
                // HATA DURUMU
                attempts++;
                playSfx('error');

                if(attempts === 1) {
                    // 1. HATA
                    fbBox.innerHTML = !allFilled ? `Lütfen tüm boşlukları doldurun.` : `Hatalı hesaplamalarınız var. Lütfen verilen uzunlukların kaç adet 'r' (yarıçap) mesafesinden oluştuğuna dikkat edin.`;
                    fbBox.classList.add('fb-error');
                    
                    setTimeout(() => { fbBox.style.display = 'none'; }, 4000);

                } else {
                    // 2. HATA - OTOMATİK ÇÖZÜM VE SAYAÇ
                    isCompleted = true;
                    
                    fbBox.innerHTML = `Hakkınız bitti. Doğru hesaplamalar yazılıyor...`;
                    fbBox.classList.add('fb-error');

                    // Gecikmeli doğru cevap animasyonu
                    let delay = 0;
                    inputs.forEach(input => {
                        if(!input.classList.contains('is-correct')) {
                            let correctAns = input.getAttribute('data-ans');
                            
                            setTimeout(() => {
                                input.value = correctAns;
                                input.classList.remove('is-incorrect');
                                input.classList.add('is-correct');
                                playSfx('click');
                            }, delay);
                            delay += 300; 
                        }
                    });

                    // Tüm kutular dolduktan sonra sayacı başlat
                    setTimeout(() => {
                        fbBox.style.display = 'none';
                        triggerTimerAutoSolve("w17"); // HATA SONRASI OTOMATİK ÇÖZÜM: w17 = true
                    }, delay + 500);
                }
            }
        }

        // Sayaç fonksiyonu
        function triggerTimerAutoSolve(variableToSet) {
            const btnCheck = document.getElementById('btn-check');
            btnCheck.classList.add('timer-active'); 
            
            let countdown = 10;
            btnCheck.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
            
            const interval = setInterval(() => {
                countdown--;
                btnCheck.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
                
                if(countdown <= 0) {
                    clearInterval(interval);
                    btnCheck.innerText = "TAMAMLANDI ✓";
                    btnCheck.classList.remove('timer-active');
                    btnCheck.classList.add('completed');
                    
                    showToast("İnceleme tamamlandı, ilerleyebilirsiniz.", "text-emerald-400");
                    setVar(variableToSet, true); // w17 değişkenini tetikle
                }
            }, 1000);
        }

        function showToast(msg, iconColorClass) {
            const toast = document.getElementById('toast-msg');
            const iconSvg = toast.querySelector('svg');
            
            document.getElementById('toast-text').innerText = msg;
            
            iconSvg.className = `w-6 h-6 ${iconColorClass || 'text-emerald-400'}`;
            
            toast.className = ''; 
            toast.classList.add('show');
            
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        function setVar(n, v) { 
            try { 
                parent.GetPlayer().SetVar(n, v); 
                console.log(`Storyline Variable Set: ${n} = ${v}`); 
            } catch(e) { 
                console.log(`(Local) Storyline Variable: ${n} = ${v}`); 
            } 
        }

        window.addEventListener('resize', () => {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        });
        
        window.onload = () => { 
            window.dispatchEvent(new Event('resize')); 
            init(); 
        };
    </script>
</body>
</html>
