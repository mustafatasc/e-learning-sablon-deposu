<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Etkinlik: Uzunluk Bulma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            --bg-cream: #FCF9F2;
            --grid-line: rgba(185, 28, 28, 0.08);
            
            --primary-red: #B91C1C; 
            --light-red: #FEF2F2;
            --text-dark: #1E293B;
            --success-green: #10B981;
            --error-red: #EF4444;
            --warning-orange: #F59E0B;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0F172A; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; color: var(--text-dark);
            user-select: none; -webkit-user-select: none;
            touch-action: none; 
            visibility: hidden;
        }

        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--bg-cream); 
            background-image: 
                linear-gradient(var(--grid-line) 1.5px, transparent 1.5px), 
                linear-gradient(90deg, var(--grid-line) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-top: 6px solid var(--primary-red);
        }

        /* --- HEADER --- */
        .header {
            padding: 15px 40px 0 40px; height: 75px;
            display: flex; justify-content: space-between; align-items: start;
            flex-shrink: 0; z-index: 10;
        }

        .instruction-group {
            display: flex; align-items: center; gap: 15px; flex: 1;
            background: white; border-radius: 12px; padding: 8px 20px;
            border-left: 5px solid var(--primary-red);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            margin-top: 0;
        }

        .narrator-speaker {
            width: 32px; height: 32px; background: var(--primary-red); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(185, 28, 28, 0.4); cursor: pointer;
        }

        @keyframes pulsePlay {
            0% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(185, 28, 28, 0); }
            100% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0); }
        }

        .instruction-text-main { 
            font-size: 13.5px; line-height: 1.3; font-weight: 700; color: var(--text-dark);
        }

        .logo-right-container { width: 75px; height: 75px; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; margin-left: 20px; margin-top: -10px; }

        .content-wrapper {
            display: flex; flex-direction: column; flex: 1; padding: 5px 40px; gap: 10px; 
            z-index: 10; position: relative; min-height: 0;
        }

        /* --- SORU SATIRLARI --- */
        .q-row {
            display: flex; gap: 20px; height: 125px;
            background: white; border-radius: 16px; border: 2px solid #E2E8F0;
            padding: 10px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            align-items: center;
        }

        .q-letter {
            font-size: 20px; font-weight: 900; color: var(--primary-red); width: 30px; text-align: center; flex-shrink: 0;
        }

        /* Görsel Alanı */
        .visual-area {
            flex: 1; height: 100%; border-radius: 12px;
            background-image: linear-gradient(#f1f5f9 15px, transparent 1px), linear-gradient(90deg, #f1f5f9 15px, transparent 1px);
            background-size: 15px 15px; background-position: center; border: 1px solid #e2e8f0;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02); background-color: white;
            cursor: zoom-in; position: relative;
        }
        
        .visual-area img {
            width: 100%; height: 100%; object-fit: contain; pointer-events: none;
        }

        .zoom-hint-icon {
            position: absolute; top: 6px; right: 6px; color: #94A3B8; opacity: 0.8; pointer-events: none;
            background: white; border-radius: 50%; padding: 2px;
        }

        /* Girdi Alanı */
        .input-area {
            display: flex; align-items: center; gap: 10px; width: 180px; justify-content: flex-end;
        }

        .input-label { font-size: 16px; font-weight: 800; color: var(--text-dark); }
        
        .ans-input {
            width: 70px; height: 45px; border: 3px solid #CBD5E1; border-radius: 10px;
            font-size: 20px; font-weight: 900; color: var(--primary-red); text-align: center;
            outline: none; transition: all 0.2s; background: #F8FAFC;
        }
        
        .ans-input:focus { border-color: var(--primary-red); background: white; box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.1); }
        .ans-input.correct { border-color: var(--success-green); color: var(--success-green); background: #ecfdf5; pointer-events: none; }
        .ans-input.error { border-color: var(--error-red); color: var(--error-red); background: #fef2f2; animation: shake 0.4s ease-in-out; }

        .unit-label { font-size: 16px; font-weight: 800; color: #64748B; }

        /* --- ALT PANEL: KONTROL VE GERİ BİLDİRİM --- */
        .bottom-panel {
            display: flex; justify-content: space-between; align-items: center; height: 45px; flex-shrink: 0; margin-top: auto;
        }

        .feedback-msg {
            font-size: 13px; font-weight: 800; padding: 8px 15px; border-radius: 10px;
            display: none; line-height: 1.4; flex: 1; margin-right: 20px;
        }
        .fb-success { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #10b981; }
        .fb-error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #ef4444; }

        .btn-action {
            background: var(--primary-red); color: white; min-width: 220px; height: 42px;
            font-size: 14px; font-weight: 800; border-radius: 10px;
            box-shadow: 0 6px 15px rgba(185, 28, 28, 0.3); border: none;
            cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
            padding: 0 25px; margin-left: auto;
        }
        .btn-action:hover { background: #991b1b; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(185, 28, 28, 0.4); }
        .btn-action.completed { background: var(--success-green); pointer-events: none; transform: none; box-shadow: none;}
        .btn-action.timer-active { background: var(--warning-orange); pointer-events: none; transform: none; box-shadow: none;}

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* Lightbox for zooming images */
        #lightbox-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); z-index: 10000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }
        #lightbox-overlay.active { opacity: 1; pointer-events: auto; }
        
        #lightbox-content {
            width: 70%; height: 70%; background: white; border-radius: 24px;
            padding: 30px; position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-image: linear-gradient(#f1f5f9 2px, transparent 2px), linear-gradient(90deg, #f1f5f9 2px, transparent 2px);
            background-size: 30px 30px;
        }
        #lightbox-overlay.active #lightbox-content { transform: scale(1); }

        .close-btn {
            position: absolute; top: 15px; right: 20px; font-size: 36px; font-weight: 900;
            color: #94A3B8; cursor: pointer; transition: color 0.2s; line-height: 1; z-index: 10;
        }
        .close-btn:hover { color: var(--error-red); }

        #lightbox-svg-target {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: none;
        }

        /* Toast Bildirimi */
        #toast-msg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            font-weight: 800; font-size: 14px; padding: 12px 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000; color: white;
        }
        #toast-msg.show { transform: translateX(-50%) translateY(0); }
        .toast-success { background-color: var(--success-green) !important; }
        .toast-warning { background-color: var(--warning-orange) !important; }

    </style>
</head>
<body>

    <!-- Yönerge Sesi İçin -->
    <audio id="ses1" src="ses1.mp3" preload="auto" autoplay></audio>

    <div id="scale-container">
        
        <!-- LIGHTBOX ARAYÜZÜ -->
        <div id="lightbox-overlay" onclick="handleOverlayClick(event)">
            <div id="lightbox-content">
                <div class="close-btn" onclick="closeLightbox()">&times;</div>
                <div id="lightbox-svg-target"></div>
            </div>
        </div>

        <div id="toast-msg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="toast-text"></span>
        </div>

        <header class="header">
            <div class="instruction-group">
                <div id="main-speaker" class="narrator-speaker" onclick="playAudio('ses1')">
                    <svg class="w-4 h-4 pl-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.546-2.07-2.584-1.23L6.15 6.75H3A1.5 1.5 0 001.5 8.25v7.5A1.5 1.5 0 003 17.25h3.15l4.766 3.92c1.038.84 2.584.106 2.584-1.23V4.06z"/></svg>
                </div>
                <div class="instruction-text-main">
                    Aşağıda verilen şekillerde sorulan uzunluğun kaç cm olduğunu bulunuz.
                </div>
            </div>
            <div class="logo-right-container">
                <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none';">
            </div>
        </header>

        <main class="content-wrapper">
            
            <!-- Soru a -->
            <div class="q-row">
                <div class="q-letter">a)</div>
                <div class="visual-area" onclick="openLightbox(this)">
                    <svg class="zoom-hint-icon w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" /></svg>
                    <!-- Kendi resminizi buraya ekleyin -->
                    <img src="soru_a.png" alt="Soru A Görseli" onerror="this.src='https://placehold.co/300x120/f8fafc/b91c1c?text=Soru+A+Resmi+Ekle'">
                </div>
                <div class="input-area">
                    <span class="input-label">|AB| =</span>
                    <input type="text" id="ans-a" class="ans-input" maxlength="3" autocomplete="off" onkeypress="return isNumberKey(event)">
                    <span class="unit-label">cm</span>
                </div>
            </div>

            <!-- Soru b -->
            <div class="q-row">
                <div class="q-letter">b)</div>
                <div class="visual-area" onclick="openLightbox(this)">
                    <svg class="zoom-hint-icon w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" /></svg>
                    <!-- Kendi resminizi buraya ekleyin -->
                    <img src="soru_b.png" alt="Soru B Görseli" onerror="this.src='https://placehold.co/300x120/f8fafc/b91c1c?text=Soru+B+Resmi+Ekle'">
                </div>
                <div class="input-area">
                    <span class="input-label">|BC| =</span>
                    <input type="text" id="ans-b" class="ans-input" maxlength="3" autocomplete="off" onkeypress="return isNumberKey(event)">
                    <span class="unit-label">cm</span>
                </div>
            </div>

            <!-- Soru c -->
            <div class="q-row">
                <div class="q-letter">c)</div>
                <div class="visual-area" onclick="openLightbox(this)">
                    <svg class="zoom-hint-icon w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" /></svg>
                    <!-- Kendi resminizi buraya ekleyin -->
                    <img src="soru_c.png" alt="Soru C Görseli" onerror="this.src='https://placehold.co/300x120/f8fafc/b91c1c?text=Soru+C+Resmi+Ekle'">
                </div>
                <div class="input-area">
                    <span class="input-label">|DE| =</span>
                    <input type="text" id="ans-c" class="ans-input" maxlength="2" autocomplete="off" onkeypress="return isNumberKey(event)">
                    <span class="unit-label">cm</span>
                </div>
            </div>

            <!-- ALT PANEL: KONTROL VE GERİ BİLDİRİM -->
            <div class="bottom-panel">
                <div id="q-fb" class="feedback-msg"></div>
                <button id="btn-check" class="btn-action" onclick="checkAnswers()">KONTROL ET</button>
            </div>

        </main>
    </div>

    <script>
        let audioCtx = null;
        let isAudioPlaying = false;
        
        function getAudioContext() { 
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            return audioCtx; 
        }
        
        function playSfx(type) {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type==='click') { osc.type='triangle'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime+0.1); }
                else if(type==='success') { osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); }
                else if(type==='error') { osc.type='sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.linearRampToValueAtTime(150, ctx.currentTime+0.3); }
                gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }

        let isCompleted = false;
        let attempts = 0;
        
        const correctAnswers = {
            'a': 14,
            'b': 7,
            'c': 4
        };

        // Sadece rakam girişine izin ver
        function isNumberKey(evt) {
            var charCode = (evt.which) ? evt.which : evt.keyCode;
            if (charCode > 31 && (charCode < 48 || charCode > 57)) return false;
            return true;
        }

        // Büyütme Fonksiyonları (Resimler için güncellendi)
        function openLightbox(el) {
            const overlay = document.getElementById('lightbox-overlay');
            const target = document.getElementById('lightbox-svg-target');
            const imgEl = el.querySelector('img');
            
            if (imgEl) {
                target.innerHTML = `<img src="${imgEl.src}" style="max-width: 100%; max-height: 100%; object-fit: contain; transform: scale(1.3);">`;
                overlay.classList.add('active');
                playSfx('click');
            }
        }

        function closeLightbox() {
            document.getElementById('lightbox-overlay').classList.remove('active');
            setTimeout(() => { document.getElementById('lightbox-svg-target').innerHTML = ''; }, 300);
        }

        function handleOverlayClick(e) {
            if (e.target.id === 'lightbox-overlay' || e.target.id === 'lightbox-content') {
                closeLightbox();
            }
        }

        function forceAutoplay() {
            if (isAudioPlaying) return; 
            const audio = document.getElementById('ses1');
            const speaker = document.getElementById('main-speaker');
            
            if (audio) {
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                        window.removeEventListener('click', forceAutoplay);
                        window.removeEventListener('touchstart', forceAutoplay);
                    }).catch(error => {
                        if(speaker) speaker.style.animation = 'none';
                    });
                }
            }
        }

        function playAudio(id) {
            const audio = document.getElementById(id);
            const speaker = document.getElementById('main-speaker');
            if(audio) {
                audio.pause(); audio.currentTime = 0; 
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                    }).catch(e => console.log(e));
                }
            }
        }

        function init() {
            const s = document.getElementById('ses1');
            if(s) {
                s.addEventListener('ended', () => {
                    const speaker = document.getElementById('main-speaker');
                    if(speaker) speaker.style.animation = 'none'; 
                    isAudioPlaying = false; 
                });
            }

            forceAutoplay();
            window.addEventListener('click', forceAutoplay);
            window.addEventListener('touchstart', forceAutoplay);
        }

        function checkAnswers() {
            if(isCompleted) return;
            
            let allCorrect = true;
            let isEmpty = false;

            const keys = Object.keys(correctAnswers);
            keys.forEach(key => {
                const input = document.getElementById(`ans-${key}`);
                const val = input.value.trim();
                
                if (val === '') {
                    isEmpty = true;
                } else {
                    if (parseInt(val) === correctAnswers[key]) {
                        input.classList.remove('error');
                        input.classList.add('correct');
                    } else {
                        input.classList.add('error');
                        setTimeout(() => input.classList.remove('error'), 600);
                        allCorrect = false;
                    }
                }
            });

            if (isEmpty) {
                showToast("Lütfen tüm kutucukları doldurunuz.", "toast-warning");
                return;
            }

            const fbBox = document.getElementById('q-fb');
            const btnCheck = document.getElementById('btn-check');
            fbBox.className = "feedback-msg"; // Reset

            if(allCorrect) {
                // TAM BAŞARI
                isCompleted = true;
                playSfx('success');
                
                // b22 TETİKLENİYOR
                fbBox.innerHTML = `DOĞRU! <br><span style="font-weight:600; font-size:11px; display:block; margin-top:4px;">Harika! Çember ve üçgen özelliklerini kullanarak tüm uzunlukları doğru buldunuz.</span>`;
                fbBox.classList.add('fb-success');
                
                btnCheck.innerText = "TAMAMLANDI ✓";
                btnCheck.classList.add('completed');
                
                showToast("Etkinlik başarıyla tamamlandı. İlerleyebilirsiniz.", "toast-success");
                setVar('b22', true);

            } else {
                // HATA DURUMU
                attempts++;
                playSfx('error');

                if(attempts === 1) {
                    // 1. HATA
                    fbBox.innerHTML = `Hatalı cevaplarınız var. Çemberin yarıçapı bilgisini üçgenin kenarlarına uyarlayarak tekrar hesaplayın.`;
                    fbBox.classList.add('fb-error');
                    
                    keys.forEach(key => {
                        const input = document.getElementById(`ans-${key}`);
                        if (!input.classList.contains('correct')) {
                            input.value = '';
                        }
                    });
                    
                    setTimeout(() => { fbBox.style.display = 'none'; }, 6000);

                } else {
                    // 2. HATA - OTOMATİK ÇÖZÜM
                    isCompleted = true;
                    
                    fbBox.innerHTML = `Hakkınız bitti. Doğru cevaplar otomatik olarak dolduruluyor...`;
                    fbBox.classList.add('fb-error');
                    btnCheck.setAttribute('disabled', 'true');

                    keys.forEach((key, index) => {
                        setTimeout(() => {
                            const input = document.getElementById(`ans-${key}`);
                            input.value = correctAnswers[key];
                            input.classList.remove('error');
                            input.classList.add('correct');
                            playSfx('click');
                        }, (index + 1) * 600);
                    });

                    // Sayaç başlat ve sürenin sonunda b23 tetikle
                    setTimeout(() => {
                        fbBox.style.display = 'none';
                        triggerTimerAutoSolve('b23'); 
                    }, (keys.length + 1) * 600 + 500);
                }
            }
        }

        function triggerTimerAutoSolve(variableToSet) {
            const btnCheck = document.getElementById('btn-check');
            btnCheck.removeAttribute('disabled');
            btnCheck.classList.add('timer-active'); 
            
            let countdown = 10;
            btnCheck.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
            
            const interval = setInterval(() => {
                countdown--;
                btnCheck.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
                
                if(countdown <= 0) {
                    clearInterval(interval);
                    btnCheck.innerText = "TAMAMLANDI ✓";
                    btnCheck.classList.remove('timer-active');
                    btnCheck.classList.add('completed');
                    
                    showToast("İnceleme tamamlandı, ilerleyebilirsiniz.", "toast-success");
                    setVar(variableToSet, true); // Değişkeni tetikle (b23)
                }
            }, 1000);
        }

        function showToast(msg, typeCls) {
            const toast = document.getElementById('toast-msg');
            document.getElementById('toast-text').innerText = msg;
            
            toast.className = ''; 
            toast.classList.add('show');
            if(typeCls) toast.classList.add(typeCls);
            
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        function setVar(n, v) { 
            try { 
                parent.GetPlayer().SetVar(n, v); 
                console.log(`Storyline Variable Set: ${n} = ${v}`); 
            } catch(e) { 
                console.log(`(Local) Storyline Variable: ${n} = ${v}`); 
            } 
        }

        function applyScale() {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        }
        
        applyScale(); 
        document.body.style.visibility = 'visible'; 
        
        window.addEventListener('resize', applyScale);
        window.onload = () => { init(); };
    </script>
</body>
</html>
