<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Etkinlik: Verilmeyen Açıları Bulup Şifreyi Çözme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            --bg-cream: #FCF9F2;
            --grid-line: rgba(185, 28, 28, 0.08);
            
            --primary-red: #B91C1C; 
            --light-red: #FEF2F2;
            --text-dark: #1E293B;
            --success-green: #10B981;
            --error-red: #EF4444;
            --warning-orange: #F59E0B;
            --cyan-accent: #0ea5e9;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0F172A; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; color: var(--text-dark);
            user-select: none; -webkit-user-select: none;
            visibility: hidden;
        }

        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--bg-cream); 
            background-image: 
                linear-gradient(var(--grid-line) 1.5px, transparent 1.5px), 
                linear-gradient(90deg, var(--grid-line) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-top: 6px solid var(--primary-red);
        }

        /* --- HEADER --- */
        .header {
            padding: 15px 40px 0 40px; height: 75px;
            display: flex; justify-content: space-between; align-items: start;
            flex-shrink: 0; z-index: 10;
        }

        .instruction-container { flex: 1; padding: 0; }
        .instruction-text-main { font-size: 16px; line-height: 1.4; font-weight: 900; color: var(--primary-red); text-transform: uppercase; letter-spacing: 1px;}
        .logo-right-container { width: 75px; height: 75px; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; margin-left: 20px; margin-top: -10px; }

        .content-wrapper {
            display: flex; flex-direction: column; flex: 1; padding: 0 40px 10px 40px; gap: 8px; height: calc(540px - 75px);
            z-index: 10; position: relative; min-height: 0;
        }

        /* --- YÖNERGE KUTUSU --- */
        .instruction-group {
            display: flex; align-items: center; gap: 15px; width: 100%;
            background: white; border-radius: 12px; padding: 8px 20px 8px 15px;
            border-left: 5px solid #1D4ED8; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            margin-top: 0; z-index: 10;
        }

        .narrator-speaker {
            width: 32px; height: 32px; background: var(--primary-red); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(185, 28, 28, 0.4); cursor: pointer;
        }

        @keyframes pulsePlay {
            0% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(185, 28, 28, 0); }
            100% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0); }
        }

        .instruction-text-sub {
            font-size: 14px; line-height: 1.4; font-weight: 700; color: var(--text-dark);
        }

        /* --- ORTA PANEL: IZGARA KARTLARI --- */
        .grid-container {
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
            gap: 12px; flex: 1; min-height: 0;
        }

        .shape-card {
            background: white; border: 2px solid #e2e8f0; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.02); overflow: hidden;
            padding: 5px 10px 10px 10px; transition: all 0.3s;
        }

        .card-badge {
            position: absolute; top: 10px; left: 10px; background: #1E293B; color: white;
            width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 900; z-index: 5;
        }

        .svg-container {
            width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0;
            background-image: linear-gradient(#f1f5f9 1px, transparent 1px), linear-gradient(90deg, #f1f5f9 1px, transparent 1px);
            background-size: 15px 15px; background-position: center; border-radius: 10px;
        }

        .shape-img { width: 250px; height: 150px; max-width: 100%; max-height: 100%; object-fit: contain; }

        .math-svg { width: 100%; height: 100%; max-height: 120px; }

        .input-group {
            display: flex; align-items: center; gap: 8px; margin-top: 5px;
        }

        .num-input {
            width: 60px; height: 35px; border-radius: 8px; font-weight: 900; font-size: 16px;
            border: 2px solid #cbd5e1; background: #f8fafc; color: #1D4ED8; text-align: center;
            outline: none; transition: 0.2s; font-family: 'Montserrat', sans-serif;
        }
        .num-input:focus { border-color: #1D4ED8; background: #eff6ff; box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.1); }

        /* Şifre Kutusu (6. Slot) */
        .pw-card {
            background: #eff6ff; border: 2px solid #bfdbfe; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px; box-shadow: inset 0 0 10px rgba(59, 130, 246, 0.1);
        }

        .pw-title {
            font-size: 13px; font-weight: 900; color: #1e3a8a; text-transform: uppercase; margin-bottom: 8px; text-align: center;
        }

        .pw-inputs {
            display: flex; gap: 5px;
        }

        .pw-char {
            width: 35px; height: 45px; border-radius: 8px; font-weight: 900; font-size: 20px;
            border: 2px solid #94a3b8; background: white; color: #1E293B; text-align: center;
            outline: none; transition: 0.2s; text-transform: uppercase;
        }
        .pw-char:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2); }

        /* Hata / Doğru Durumları */
        .shape-card.is-correct { border-color: var(--success-green); background-color: #ecfdf5;}
        .shape-card.is-correct .num-input { border-color: var(--success-green); color: var(--success-green); background: white; pointer-events: none;}
        
        .shape-card.is-incorrect { border-color: var(--error-red); background-color: #fef2f2; animation: shake 0.4s ease-in-out;}
        .shape-card.is-incorrect .num-input { border-color: var(--error-red); color: var(--error-red); }

        .pw-char.is-correct { border-color: var(--success-green); color: var(--success-green); background: #ecfdf5; pointer-events: none;}
        .pw-char.is-incorrect { border-color: var(--error-red); color: var(--error-red); background: #fef2f2; animation: shake 0.4s ease-in-out;}

        /* --- ALT PANEL: KONTROL VE GERİ BİLDİRİM --- */
        .bottom-panel {
            display: flex; justify-content: space-between; align-items: center; height: 45px; flex-shrink: 0; margin-top: auto;
        }

        .feedback-msg {
            font-size: 13px; font-weight: 800; padding: 10px 20px; border-radius: 10px;
            display: none; line-height: 1.4; flex: 1; margin-right: 20px;
        }
        .fb-success { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #10b981; }
        .fb-error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #ef4444; }

        .btn-action {
            background: var(--primary-red); color: white; min-width: 240px; height: 45px;
            font-size: 14px; font-weight: 800; border-radius: 12px;
            box-shadow: 0 6px 15px rgba(185, 28, 28, 0.3); border: none;
            cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
            padding: 0 25px; margin-left: auto;
        }
        .btn-action:hover { background: #991b1b; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(185, 28, 28, 0.4); }
        .btn-action.completed { background: var(--success-green); pointer-events: none; transform: none; box-shadow: none;}
        .btn-action.timer-active { background: var(--warning-orange); pointer-events: none; transform: none; box-shadow: none;}

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* Toast Bildirimi */
        #toast-msg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            font-weight: 800; font-size: 14px;
            padding: 12px 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000; color: white;
        }
        #toast-msg.show { transform: translateX(-50%) translateY(0); }
        .toast-success { background-color: var(--success-green) !important; }
        .toast-warning { background-color: var(--warning-orange) !important; }

    </style>
</head>
<body>

    <audio id="ses1" src="ses1.mp3" preload="auto" autoplay></audio>

    <!-- ORTAK DEFS (Ok Uçları) -->
    <svg width="0" height="0" style="position:absolute; display:none;">
        <defs>
            <marker id="arr-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 2 L 10 5 L 0 8 z" fill="#1E293B"/>
            </marker>
        </defs>
    </svg>

    <div id="scale-container">
        
        <div id="toast-msg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="toast-text"></span>
        </div>

        <header class="header">
            <div class="instruction-container">
                <div class="instruction-text-main">AÇI VE ŞİFRE ETKİNLİĞİ</div>
            </div>
            <div class="logo-right-container">
                <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none';">
            </div>
        </header>

        <main class="content-wrapper">
            
            <div class="instruction-group">
                <div id="main-speaker" class="narrator-speaker" onclick="playAudio('ses1')">
                    <svg class="w-4 h-4 pl-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.546-2.07-2.584-1.23L6.15 6.75H3A1.5 1.5 0 001.5 8.25v7.5A1.5 1.5 0 003 17.25h3.15l4.766 3.92c1.038.84 2.584.106 2.584-1.23V4.06z"/></svg>
                </div>
                <div class="instruction-text-sub" onclick="playAudio('ses1')" style="cursor: pointer;">
                    Aşağıdaki şekillerde verilmeyen açı ölçülerini bulup <strong>küçükten büyüğe doğru sıralayarak</strong> şifreyi oluşturunuz.
                </div>
            </div>

            <!-- ORTA PANEL -->
            <div class="grid-container">

                <!-- KART N (70 Derece) -->
                <div class="shape-card" id="card-n">
                    <div class="card-badge">N</div>
                    <div class="svg-container">
                        <img src="r2.png" alt="Şekil N" class="shape-img" onerror="this.src='https://placehold.co/250x150/f8fafc/94a3b8?text=r2.png';">
                    </div>
                    <div class="input-group">
                        <span class="font-bold text-slate-700">? =</span>
                        <input type="number" id="inp-n" class="num-input" maxlength="3">
                        <span class="font-bold text-slate-700">°</span>
                    </div>
                </div>

                <!-- KART K (50 Derece) -->
                <div class="shape-card" id="card-k">
                    <div class="card-badge">K</div>
                    <div class="svg-container">
                        <img src="r3.png" alt="Şekil K" class="shape-img" onerror="this.src='https://placehold.co/250x150/f8fafc/94a3b8?text=r3.png';">
                    </div>
                    <div class="input-group">
                        <span class="font-bold text-slate-700">? =</span>
                        <input type="number" id="inp-k" class="num-input" maxlength="3">
                        <span class="font-bold text-slate-700">°</span>
                    </div>
                </div>

                <!-- KART R (120 Derece) -->
                <div class="shape-card" id="card-r">
                    <div class="card-badge">R</div>
                    <div class="svg-container">
                        <img src="r4.png" alt="Şekil R" class="shape-img" onerror="this.src='https://placehold.co/250x150/f8fafc/94a3b8?text=r4.png';">
                    </div>
                    <div class="input-group">
                        <span class="font-bold text-slate-700">? =</span>
                        <input type="number" id="inp-r" class="num-input" maxlength="3">
                        <span class="font-bold text-slate-700">°</span>
                    </div>
                </div>

                <!-- KART A (90 Derece) -->
                <div class="shape-card" id="card-a">
                    <div class="card-badge">A</div>
                    <div class="svg-container">
                        <img src="r5.png" alt="Şekil A" class="shape-img" onerror="this.src='https://placehold.co/250x150/f8fafc/94a3b8?text=r5.png';">
                    </div>
                    <div class="input-group">
                        <span class="font-bold text-slate-700">? =</span>
                        <input type="number" id="inp-a" class="num-input" maxlength="3">
                        <span class="font-bold text-slate-700">°</span>
                    </div>
                </div>

                <!-- KART E (60 Derece) -->
                <div class="shape-card" id="card-e">
                    <div class="card-badge">E</div>
                    <div class="svg-container">
                        <img src="r6.png" alt="Şekil E" class="shape-img" onerror="this.src='https://placehold.co/250x150/f8fafc/94a3b8?text=r6.png';">
                    </div>
                    <div class="input-group">
                        <span class="font-bold text-slate-700">? =</span>
                        <input type="number" id="inp-e" class="num-input" maxlength="3">
                        <span class="font-bold text-slate-700">°</span>
                    </div>
                </div>

                <!-- ŞİFRE KUTUSU -->
                <div class="pw-card" id="pw-card">
                    <div class="pw-title">
                        ŞİFRE <br>
                        <span style="font-size: 10px; color: #3b82f6;">(Açıları Küçükten Büyüğe Sıralayın)</span>
                    </div>
                    <div class="pw-inputs">
                        <input type="text" id="pw-1" maxlength="1" class="pw-char">
                        <input type="text" id="pw-2" maxlength="1" class="pw-char">
                        <input type="text" id="pw-3" maxlength="1" class="pw-char">
                        <input type="text" id="pw-4" maxlength="1" class="pw-char">
                        <input type="text" id="pw-5" maxlength="1" class="pw-char">
                    </div>
                </div>

            </div>

            <!-- ALT PANEL: KONTROL VE GERİ BİLDİRİM -->
            <div class="bottom-panel">
                <div id="q-fb" class="feedback-msg"></div>
                <button id="btn-check" class="btn-action" onclick="checkAnswers()">KONTROL ET</button>
            </div>

        </main>
    </div>

    <script>
        let audioCtx = null;
        let isAudioPlaying = false;
        
        function getAudioContext() { 
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            return audioCtx; 
        }
        
        function playSfx(type) {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type==='click') { osc.type='triangle'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime+0.1); }
                else if(type==='success') { osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); }
                else if(type==='error') { osc.type='sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.linearRampToValueAtTime(150, ctx.currentTime+0.3); }
                gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }

        let isCompleted = false;
        let attempts = 0;
        
        const correctAngles = { 'n': 70, 'k': 50, 'r': 120, 'a': 90, 'e': 60 };
        const correctPW = ['K', 'E', 'N', 'A', 'R'];

        function forceAutoplay() {
            if (isAudioPlaying) return; 
            const audio = document.getElementById('ses1');
            const speaker = document.getElementById('main-speaker');
            
            if (audio) {
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                        window.removeEventListener('click', forceAutoplay);
                        window.removeEventListener('touchstart', forceAutoplay);
                    }).catch(error => {
                        if(speaker) speaker.style.animation = 'none';
                    });
                }
            }
        }

        function playAudio(id) {
            const audio = document.getElementById(id);
            const speaker = document.getElementById('main-speaker');
            if(audio) {
                audio.pause(); audio.currentTime = 0; 
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                    }).catch(e => console.log(e));
                }
            }
        }

        function init() {
            const s = document.getElementById('ses1');
            if(s) {
                s.addEventListener('ended', () => {
                    const speaker = document.getElementById('main-speaker');
                    if(speaker) speaker.style.animation = 'none'; 
                    isAudioPlaying = false; 
                });
            }

            forceAutoplay();
            window.addEventListener('click', forceAutoplay);
            window.addEventListener('touchstart', forceAutoplay);

            // Şifre kutuları için otomatik ilerleme ve geri gelme
            const pwInputs = document.querySelectorAll('.pw-char');
            pwInputs.forEach((inp, idx) => {
                inp.addEventListener('input', () => {
                    inp.value = inp.value.replace(/[^A-Za-zçÇğĞıİöÖşŞüÜ]/g, ''); // Sadece harf
                    if(inp.value.length === 1 && idx < 4) {
                        pwInputs[idx+1].focus();
                    }
                });
                inp.addEventListener('keydown', (e) => {
                    if(e.key === 'Backspace' && inp.value === '' && idx > 0) {
                        pwInputs[idx-1].focus();
                    }
                    if(e.key === 'Enter') {
                        checkAnswers();
                    }
                });
            });

            // Sayı kutuları için enter
            document.querySelectorAll('.num-input').forEach(inp => {
                inp.addEventListener('keypress', (e) => {
                    if(e.key === 'Enter') checkAnswers();
                });
            });
        }

        function checkAnswers() {
            if(isCompleted) return;
            
            let allCorrect = true;
            let anyEmpty = false;
            let wrongCards = [];
            let pwWrong = false;
            let emptyPW = false;

            // Açıları kontrol et
            ['n', 'k', 'r', 'a', 'e'].forEach(id => {
                let val = document.getElementById(`inp-${id}`).value.trim();
                if(val === '') {
                    anyEmpty = true;
                } else if(parseInt(val) !== correctAngles[id]) {
                    allCorrect = false;
                    wrongCards.push(id);
                } else {
                    document.getElementById(`card-${id}`).classList.add('is-correct');
                }
            });

            // Şifreyi kontrol et
            for(let i=0; i<5; i++) {
                let val = document.getElementById(`pw-${i+1}`).value.trim().toUpperCase();
                if(val === '') {
                    anyEmpty = true;
                    emptyPW = true;
                } else if(val !== correctPW[i]) {
                    allCorrect = false;
                    pwWrong = true;
                }
            }

            const fbBox = document.getElementById('q-fb');
            const btnCheck = document.getElementById('btn-check');
            fbBox.className = "feedback-msg"; // Reset

            if (anyEmpty) {
                showToast("Lütfen tüm açıları ve şifreyi doldurunuz.", "toast-warning");
                playSfx('error');
                // Doğru stillerini sıfırla ki kafa karışmasın
                document.querySelectorAll('.shape-card').forEach(c => c.classList.remove('is-correct'));
                return;
            }

            if(allCorrect) {
                // TAM BAŞARI
                isCompleted = true;
                playSfx('success');

                for(let i=1; i<=5; i++) {
                    document.getElementById(`pw-${i}`).classList.add('is-correct');
                }
                
                if(attempts === 0) {
                    // İLK DENEMEDE DOĞRU
                    fbBox.innerHTML = `DOĞRU! <br><span style="font-weight:600; font-size:11px; display:block; margin-top:4px;">Harika! Hem açıları hem de şifreyi ilk seferde doğru buldunuz.</span>`;
                    fbBox.classList.add('fb-success');
                    
                    btnCheck.innerText = "TAMAMLANDI ✓";
                    btnCheck.classList.add('completed');
                    
                    showToast("Etkinlik başarıyla tamamlandı. İlerleyebilirsiniz.", "toast-success");
                    setVar('w14', true); // İLK DENEME DOĞRU: w14
                } else {
                    // İKİNCİ DENEMEDE KENDİSİ DÜZELTTİ İSE
                    triggerTimerAutoSolve('w15'); 
                }

            } else {
                // HATA DURUMU
                attempts++;
                playSfx('error');

                if(attempts === 1) {
                    // 1. HATA
                    fbBox.innerHTML = `Hatalı yerler var. Kesişen doğrularda komşu bütünler açıların toplamı 180° olmalıdır. Şifrede ise bulduğunuz açıları küçükten büyüğe sıralamalısınız.`;
                    fbBox.classList.add('fb-error');
                    
                    // Yanlış olan kartları titret ve temizle
                    wrongCards.forEach(id => {
                        const cardEl = document.getElementById(`card-${id}`);
                        cardEl.classList.remove('is-correct');
                        cardEl.classList.add('is-incorrect');
                        
                        setTimeout(() => { 
                            cardEl.classList.remove('is-incorrect'); 
                            document.getElementById(`inp-${id}`).value = ''; 
                        }, 1200);
                    });

                    // Şifre yanlışsa titret ve temizle
                    if (pwWrong) {
                        for(let i=1; i<=5; i++) {
                            let pwEl = document.getElementById(`pw-${i}`);
                            pwEl.classList.add('is-incorrect');
                            setTimeout(() => {
                                pwEl.classList.remove('is-incorrect');
                                pwEl.value = '';
                            }, 1200);
                        }
                    }
                    
                    setTimeout(() => { fbBox.style.display = 'none'; }, 5000);

                } else {
                    // 2. HATA - OTOMATİK ÇÖZÜM
                    isCompleted = true;
                    
                    fbBox.innerHTML = `Hakkınız bitti. Doğru cevaplar otomatik olarak yazılıyor...`;
                    fbBox.classList.add('fb-error');

                    // Açılar
                    ['n', 'k', 'r', 'a', 'e'].forEach((id, index) => {
                        document.getElementById(`card-${id}`).classList.remove('is-incorrect');
                        document.getElementById(`inp-${id}`).disabled = true;
                        
                        setTimeout(() => {
                            document.getElementById(`inp-${id}`).value = correctAngles[id];
                            document.getElementById(`card-${id}`).classList.add('is-correct');
                            playSfx('click');
                        }, (index + 1) * 300);
                    });

                    // Şifre
                    setTimeout(() => {
                        for(let i=1; i<=5; i++) {
                            setTimeout(() => {
                                let pwEl = document.getElementById(`pw-${i}`);
                                pwEl.classList.remove('is-incorrect');
                                pwEl.disabled = true;
                                pwEl.value = correctPW[i-1];
                                pwEl.classList.add('is-correct');
                                playSfx('click');
                            }, i * 200);
                        }
                    }, 1800);

                    // Sayaç başlat
                    setTimeout(() => {
                        fbBox.style.display = 'none';
                        triggerTimerAutoSolve('w15'); // OTOMATİK ÇÖZÜM: w15
                    }, 3500);
                }
            }
        }

        function triggerTimerAutoSolve(variableToSet) {
            const btnCheck = document.getElementById('btn-check');
            btnCheck.classList.add('timer-active'); 
            
            let countdown = 10;
            btnCheck.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
            
            const interval = setInterval(() => {
                countdown--;
                btnCheck.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
                
                if(countdown <= 0) {
                    clearInterval(interval);
                    btnCheck.innerText = "TAMAMLANDI ✓";
                    btnCheck.classList.remove('timer-active');
                    btnCheck.classList.add('completed');
                    
                    showToast("İnceleme tamamlandı, ilerleyebilirsiniz.", "toast-success");
                    setVar(variableToSet, true); // Değişkeni tetikle (w15)
                }
            }, 1000);
        }

        function showToast(msg, typeCls) {
            const toast = document.getElementById('toast-msg');
            document.getElementById('toast-text').innerText = msg;
            
            toast.className = ''; 
            toast.classList.add('show');
            if(typeCls) toast.classList.add(typeCls);
            
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        function setVar(n, v) { 
            try { 
                parent.GetPlayer().SetVar(n, v); 
                console.log(`Storyline Variable Set: ${n} = ${v}`); 
            } catch(e) { 
                console.log(`(Local) Storyline Variable: ${n} = ${v}`); 
            } 
        }

        function applyScale() {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        }
        
        applyScale(); 
        document.body.style.visibility = 'visible'; 
        
        window.addEventListener('resize', applyScale);
        window.onload = () => { init(); };
    </script>
</body>
</html>
