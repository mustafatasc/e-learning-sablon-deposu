<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tümler ve Bütünler Açılar - Soru Çözümü</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            --cream-bg: #FCF9F2;
            --paper-grid: rgba(185, 28, 28, 0.08);
            
            --primary-main: #B91C1C;
            --primary-dark: #7F1D1D;
            --primary-soft: #FCA5A5;
            --warm-grey: #334155;
            
            --success-green: #10B981;
            --error-red: #EF4444;
            --warning-orange: #F59E0B;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #030712; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; color: var(--warm-grey);
            user-select: none; -webkit-user-select: none;
        }

        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        *::-webkit-scrollbar { display: none !important; }

        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--cream-bg); 
            background-image: linear-gradient(var(--paper-grid) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--paper-grid) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border-top: 6px solid var(--primary-main);
        }

        #scale-container::before {
            content: ''; position: absolute; top: -20%; left: -20%; width: 150%; height: 150%;
            background: radial-gradient(circle, rgba(185, 28, 28, 0.08) 0%, transparent 60%);
            z-index: 0; pointer-events: none;
        }

        .header {
            padding: 20px 40px 0 40px; height: 95px;
            display: flex; justify-content: space-between; align-items: start;
            flex-shrink: 0; z-index: 10;
        }

        .instruction-container { flex: 1; padding: 0; }
        .instruction-text { font-size: 15px; line-height: 1.4; font-weight: 900; color: var(--primary-dark); text-align: left; text-transform: uppercase; letter-spacing: 0.5px;}
        .sub-instruction { font-size: 13.5px; font-weight: 600; color: #64748b; margin-top: 4px; }
        .logo-right-container { width: 85px; height: 85px; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; margin-left: 20px; margin-top: -10px; }

        .content-wrapper {
            display: flex; flex: 1; padding: 5px 40px 20px 40px; gap: 30px; height: calc(540px - 95px);
            z-index: 10;
        }

        .left-panel { width: 560px !important; display: flex; flex-direction: column; gap: 12px; }
        
        .question-card {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(185, 28, 28, 0.15); border-radius: 18px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            display: flex; flex-direction: column; min-height: 220px; position: relative; overflow: hidden;
        }

        .card-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;}
        .step-indicator { font-size: 12px; font-weight: 900; color: var(--primary-main); letter-spacing: 1px; }
        .progress-dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e1; transition: 0.3s; }
        .dot.active { background: var(--primary-main); transform: scale(1.3); }
        .dot.correct { background: var(--success-green); }
        .dot.incorrect { background: var(--error-red); }

        .question-text { font-size: 18px; font-weight: 800; color: #1e293b; line-height: 1.6; }

        .feedback-bubble {
            background: rgba(255, 255, 255, 0.95); border-left: 5px solid var(--primary-main);
            border-radius: 12px; padding: 15px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: none; flex-direction: column; gap: 8px; transform: translateY(10px); opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin-top: auto;
        }
        .feedback-bubble.show { display: flex; transform: translateY(0); opacity: 1; }
        .feedback-title { font-size: 12.5px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; display: flex; align-items: center; gap: 6px;}
        .feedback-text { font-size: 13px; font-weight: 700; line-height: 1.6; color: #475569; }

        /* 4 ŞIK İÇİN 2x2 GRID TASARIMI */
        .right-panel { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; gap: 15px; padding-top: 10px;}
        
        .options-container { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; justify-items: center; align-content: center;
        }
        
        .opt-btn {
            background: white; border: 3px solid #cbd5e1; border-radius: 30px;
            padding: 12px 20px; text-align: center; font-size: 20px; font-weight: 900; color: #334155;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            width: 100%; max-width: 150px; display: flex; align-items: center; justify-content: center; position: relative;
        }
        .opt-btn:hover:not(.disabled) { border-color: var(--primary-soft); background: #fef2f2; transform: translateY(-2px) scale(1.05); box-shadow: 0 6px 15px rgba(185, 28, 28, 0.1); color: var(--primary-main);}
        .opt-btn:active:not(.disabled) { transform: translateY(1px) scale(0.98); }
        
        .opt-btn.selected { border-color: var(--primary-main); background: var(--primary-main); color: white; transform: scale(1.05);}
        .opt-btn.correct { background: #10B981 !important; border-color: #10B981 !important; color: white !important; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); transform: scale(1.1);}
        .opt-btn.incorrect { background: #EF4444 !important; border-color: #EF4444 !important; color: white !important; box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); animation: shake 0.4s ease-in-out;}
        .opt-btn.disabled { pointer-events: none; opacity: 0.5; transform: scale(0.95) !important; }
        .opt-btn.correct.disabled { opacity: 1; transform: scale(1.05) !important;}
        .opt-btn.incorrect.disabled { opacity: 0.8; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .action-container { margin-top: auto; display: flex; flex-direction: column; gap: 10px; width: 100%; align-items: center;}
        
        .btn-check-ans {
            background: var(--primary-main); color: white; width: 100%; max-width: 250px; height: 50px;
            border-radius: 12px; font-size: 15px; font-weight: 900; display: flex;
            align-items: center; justify-content: center; transition: 0.2s; cursor: pointer;
            box-shadow: 0 6px 15px rgba(185, 28, 28, 0.2); border: none; letter-spacing: 1px;
            opacity: 0.5; pointer-events: none;
        }
        .btn-check-ans.ready { opacity: 1; pointer-events: auto; }
        .btn-check-ans.ready:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .btn-check-ans.completed { background: var(--success-green); box-shadow: none; pointer-events: none;}

        .btn-next {
            background: #1e293b; color: white; width: 100%; max-width: 250px; height: 50px;
            border-radius: 12px; font-size: 15px; font-weight: 900; display: none;
            align-items: center; justify-content: center; transition: 0.2s; cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2); border: none; letter-spacing: 1px;
        }
        .btn-next:hover { background: #0f172a; transform: translateY(-2px); }

        /* ÖZET EKRANI TAŞMA DÜZELTMELERİ */
        .summary-dashboard {
            position: absolute; inset: 0; background: var(--cream-bg); padding: 25px 40px;
            display: none; flex-direction: column; justify-content: space-between; z-index: 1000;
        }

        .summary-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(185, 28, 28, 0.1); padding-bottom: 10px; }
        .summary-title { font-size: 20px; font-weight: 900; color: var(--primary-dark); text-transform: uppercase;}
        .timer-badge { background: #fee2e2; color: #991b1b; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2);}

        .summary-content { display: flex; gap: 20px; flex: 1; margin: 15px 0; overflow: hidden; align-items: center;}
        .summary-chart-side { width: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        .summary-list-side { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-right: 5px; height: 100%;}

        .summary-row-card {
            background: white; border: 2px solid rgba(185, 28, 28, 0.1); border-radius: 12px;
            padding: 10px 14px; display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 700;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02); flex-shrink: 0;
        }
        .summary-row-card.correct { border-left: 6px solid var(--success-green); }
        .summary-row-card.incorrect { border-left: 6px solid var(--error-red); }

        .summary-badge-status { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px;}
        .summary-badge-status.correct { background: #d1fae5; color: #065f46; }
        .summary-badge-status.incorrect { background: #fee2e2; color: #991b1b; }

        .circular-progress {
            width: 140px; height: 140px; border-radius: 50%;
            background: conic-gradient(var(--success-green) 0deg, #cbd5e1 0deg);
            display: flex; align-items: center; justify-content: center; position: relative;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        .circular-progress::before {
            content: ''; position: absolute; width: 110px; height: 110px; border-radius: 50%; background: var(--cream-bg);
        }
        .score-text-center { position: relative; z-index: 10; font-size: 28px; font-weight: 900; color: var(--primary-dark); }

        #toast-msg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background-color: var(--primary-dark); color: white; font-weight: 800; font-size: 13px;
            padding: 12px 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
        }
        #toast-msg.show { transform: translateX(-50%) translateY(0); }
        .toast-warning { background-color: var(--warning-orange) !important; color: white !important; }
        .toast-success { background-color: var(--success-green) !important; color: white !important; }
    </style>
</head>
<body>

    <audio id="audio1" src="ses1.mp3" preload="auto"></audio>

    <div id="scale-container">
        
        <div id="toast-msg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="toast-text">Bildirim metni.</span>
        </div>

        <div id="summary-panel" class="summary-dashboard">
            <div class="summary-header">
                <div class="summary-title">Değerlendirme Sonuç Raporu</div>
                <div id="timer-wrapper" class="timer-badge" style="display: none;">
                    <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/></svg>
                    <span>İnceleme Süresi: <strong id="countdown-num">10</strong>s</span>
                </div>
            </div>

            <div class="summary-content">
                <div class="summary-chart-side">
                    <div id="circ-progress" class="circular-progress">
                        <div id="score-val" class="score-text-center">0/3</div>
                    </div>
                    <div id="result-status-txt" class="text-[14px] font-black text-emerald-800 text-center uppercase tracking-wide mt-4">Durum</div>
                    <p id="result-desc-txt" class="text-[11px] text-slate-500 text-center font-bold px-2 mt-2 leading-relaxed">Açıklama</p>
                </div>
                <div id="summary-cards-list" class="summary-list-side">
                    <!-- Dinamik Liste -->
                </div>
            </div>

            <div class="h-10 flex items-center justify-center border-t-2 border-slate-200">
                <div id="bottom-info-lbl" class="text-[12px] font-extrabold text-slate-400 uppercase tracking-widest mt-2">Değerlendirme tamamlandı. İlerleyebilirsiniz.</div>
            </div>
        </div>

        <header class="header">
            <div class="instruction-container">
                <div class="instruction-text">
                    TÜMLER VE BÜTÜNLER AÇILAR
                </div>
                <div class="sub-instruction">Aşağıdaki soruların doğru yanıtlarını butonlara tıklayarak işaretleyiniz.</div>
            </div>
            <div class="logo-right-container">
                <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none';">
            </div>
        </header>

        <main class="content-wrapper">
            <div class="left-panel">
                <div class="question-card">
                    <div class="card-header-bar">
                        <div id="step-lbl" class="step-indicator">SORU 1 / 3</div>
                        <div class="progress-dots">
                            <div class="dot active"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                    </div>
                    
                    <div id="q-txt" class="question-text">Soru yükleniyor...</div>
                </div>

                <div id="f-bubble" class="feedback-bubble">
                    <div id="f-title" class="feedback-title">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        MATEMATİKSEL ÇÖZÜM
                    </div>
                    <div id="f-desc" class="feedback-text">Açıklama metni.</div>
                </div>
            </div>

            <div class="right-panel">
                <!-- 4 ŞIKLI YAPI -->
                <div class="options-container" id="options-box">
                    <button id="opt-0" class="opt-btn" onclick="selectOption(0)">-</button>
                    <button id="opt-1" class="opt-btn" onclick="selectOption(1)">-</button>
                    <button id="opt-2" class="opt-btn" onclick="selectOption(2)">-</button>
                    <button id="opt-3" class="opt-btn" onclick="selectOption(3)">-</button>
                </div>
                
                <div class="action-container">
                    <button id="btn-check" class="btn-check-ans" onclick="checkAnswer()">KONTROL ET</button>
                    <button id="btn-next" class="btn-next" onclick="nextQuestion()">SIRADAKİ SORU ➜</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let audioCtx = null;
        function getAudioContext() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
        
        function playSfx(type) {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type==='correct') { osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); }
                else if(type==='incorrect') { osc.type='sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.linearRampToValueAtTime(150, ctx.currentTime+0.3); }
                else if(type==='click') { osc.type='triangle'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime+0.1); }
                gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }

        // ŞIKLAR 4'E ÇIKARILDI
        const data = [
            {
                q: "a) Tümler iki açıdan birinin ölçüsü diğerinin iki katıdır. Küçük açı kaç derecedir?",
                options: ["15", "30", "45", "60"],
                ans: 1, // 30
                desc: "Tümler iki açının toplamı 90°'dir. <br> Küçük açı = x <br> Büyük açı = 2x <br> x + 2x = 90° &nbsp;⇒&nbsp; 3x = 90° &nbsp;⇒&nbsp; x = 30°"
            },
            {
                q: "b) Bütünler iki açıdan birinin ölçüsü diğerinin üç katından 20° fazladır. Büyük açı kaç derecedir?",
                options: ["40", "80", "100", "140"],
                ans: 3, // 140
                desc: "Bütünler iki açının toplamı 180°'dir. <br> Küçük açı = x <br> Büyük açı = 3x + 20 <br> x + (3x + 20) = 180° &nbsp;⇒&nbsp; 4x = 160° &nbsp;⇒&nbsp; x = 40° <br> Büyük açı = 180 - 40 = 140°"
            },
            {
                q: "c) Tümler iki açıdan birinin ölçüsü diğerinin dört katından 10° eksiktir. Küçük açı kaç derecedir?",
                options: ["10", "20", "30", "40"],
                ans: 1, // 20
                desc: "Tümler iki açının toplamı 90°'dir. <br> Küçük açı = x <br> Büyük açı = 4x - 10 <br> x + (4x - 10) = 90° &nbsp;⇒&nbsp; 5x = 100° &nbsp;⇒&nbsp; x = 20°"
            }
        ];

        let index = 0, score = 0, answersLog = [];
        let isAnswered = false;
        let qAttempts = 0; 
        let selectedOption = null;

        function init() {
            document.getElementById('audio1').play().catch(()=>{});
            showQuestion();
        }

        function showQuestion() {
            isAnswered = false;
            qAttempts = 0;
            selectedOption = null;
            
            const current = data[index];
            document.getElementById('step-lbl').innerText = `SORU ${index + 1} / 3`;
            document.getElementById('q-txt').innerText = current.q;
            
            for(let i=0; i<4; i++) {
                const btn = document.getElementById(`opt-${i}`);
                btn.innerText = current.options[i];
                btn.className = "opt-btn"; 
            }

            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, idx) => {
                dot.className = 'dot';
                if(idx === index) dot.classList.add('active');
                else if(idx < index) {
                    dot.classList.add(answersLog[idx] ? 'correct' : 'incorrect');
                }
            });

            document.getElementById('btn-check').className = "btn-check-ans";
            document.getElementById('btn-check').innerText = "KONTROL ET";
            document.getElementById('btn-check').style.display = "flex";
            document.getElementById('btn-next').style.display = "none";
            document.getElementById('f-bubble').classList.remove('show');
        }

        function selectOption(idx) {
            if(isAnswered) return;
            
            // Eğer daha önce elenmişse tıklanamaz
            if(document.getElementById(`opt-${idx}`).classList.contains('disabled')) return;
            
            playSfx('click');
            selectedOption = idx;

            for(let i=0; i<4; i++) {
                const b = document.getElementById(`opt-${i}`);
                if(!b.classList.contains('incorrect')) {
                    b.classList.remove('selected');
                }
            }
            document.getElementById(`opt-${idx}`).classList.add('selected');
            document.getElementById('btn-check').classList.add('ready');
        }

        function checkAnswer() {
            if(isAnswered || selectedOption === null) return;
            getAudioContext();
            
            const current = data[index];
            const btn = document.getElementById(`opt-${selectedOption}`);
            const checkBtn = document.getElementById('btn-check');
            
            if(selectedOption === current.ans) {
                // DOĞRU CEVAP
                isAnswered = true;
                score++; 
                answersLog.push(true);
                playSfx('correct');
                
                btn.classList.add('correct', 'disabled');
                
                for(let i=0; i<4; i++) {
                    if(i !== selectedOption) document.getElementById(`opt-${i}`).classList.add('disabled');
                }
                
                showFeedback(true, current.desc);
                checkBtn.style.display = "none";
                document.getElementById('btn-next').style.display = "flex";
            } else {
                // YANLIŞ CEVAP
                qAttempts++;
                playSfx('incorrect');
                
                if(qAttempts >= 2) {
                    // 2. DENEMEDE DE YANLIŞ
                    isAnswered = true;
                    answersLog.push(false);
                    
                    btn.classList.add('incorrect', 'disabled');
                    
                    const correctBtn = document.getElementById(`opt-${current.ans}`);
                    correctBtn.classList.add('correct', 'disabled');
                    
                    for(let i=0; i<4; i++) {
                        if(i !== current.ans && i !== selectedOption) {
                            document.getElementById(`opt-${i}`).classList.add('disabled');
                        }
                    }
                    
                    showFeedback(false, current.desc);
                    checkBtn.style.display = "none";
                    document.getElementById('btn-next').style.display = "flex";
                } else {
                    // 1. YANLIŞ: Seçilen şıkkı kilitle ve elensin
                    btn.classList.add('incorrect', 'disabled');
                    showToast("Yanlış cevap! Lütfen işlemini tekrar kontrol edip kalan şıklardan birini seç.", "toast-warning");
                    
                    selectedOption = null;
                    checkBtn.classList.remove('ready');
                }
            }
        }

        function showFeedback(correct, desc) {
            const bubble = document.getElementById('f-bubble');
            const title = document.getElementById('f-title');
            const descEl = document.getElementById('f-desc');

            if(correct) {
                bubble.style.borderLeftColor = "var(--success-green)";
                title.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> DOĞRU YANIT! ÇÖZÜM:`;
                title.style.color = "var(--success-green)";
            } else {
                bubble.style.borderLeftColor = "var(--error-red)";
                title.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg> YANLIŞ YANIT! DOĞRU ÇÖZÜM:`;
                title.style.color = "var(--error-red)";
            }

            descEl.innerHTML = desc;
            bubble.classList.add('show');
        }

        function nextQuestion() {
            playSfx('click');
            index++;
            if(index < 3) {
                showQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById('summary-panel').style.display = "flex";
            
            const circ = document.getElementById('circ-progress');
            const percentage = (score / 3) * 360;
            circ.style.background = `conic-gradient(var(--success-green) ${percentage}deg, #cbd5e1 0deg)`;
            document.getElementById('score-val').innerText = `${score} / 3`;

            const statusTxt = document.getElementById('result-status-txt');
            const descTxt = document.getElementById('result-desc-txt');
            
            if(score === 3) {
                statusTxt.innerText = "KUSURSUZ BAŞARI! ⭐";
                statusTxt.style.color = "var(--success-green)";
                descTxt.innerText = "Tümler ve bütünler açılar konusunu mükemmel kavramışsın. Tebrikler!";
            } else if(score === 2) {
                statusTxt.innerText = "İYİ İŞ ÇIKARDIN! 👍";
                statusTxt.style.color = "var(--primary-main)";
                descTxt.innerText = "Sadece ufak bir işlem hatan var. Çözümleri inceleyerek eksiğini giderebilirsin.";
            } else {
                statusTxt.innerText = "BİRAZ DAHA PRATİK! 📝";
                statusTxt.style.color = "var(--error-red)";
                descTxt.innerText = "Açı problemleri denklemlerinde zorlanıyorsun. Lütfen çözüm adımlarını dikkatle incele.";
            }

            const cardsList = document.getElementById('summary-cards-list');
            cardsList.innerHTML = '';
            
            data.forEach((item, idx) => {
                const wasCorrect = answersLog[idx];
                const card = document.createElement('div');
                card.className = `summary-row-card ${wasCorrect ? 'correct' : 'incorrect'}`;
                
                let cleanQ = item.q.substring(3);
                // <br> etiketlerini kaldırarak özet sayfasında taşmayı engelle
                let cleanDesc = item.desc.replace(/<br>/g, " | ").replace(/&nbsp;/g, " ");
                
                card.innerHTML = `
                    <div class="summary-badge-status ${wasCorrect ? 'correct' : 'incorrect'}">
                        ${wasCorrect ? '✓' : '✗'}
                    </div>
                    <div class="flex flex-col gap-1">
                        <div class="text-[#1e293b] font-black">${idx + 1}. Soru: ${cleanQ}</div>
                        <div class="text-[10.5px] text-slate-500 font-semibold leading-relaxed">${cleanDesc}</div>
                    </div>
                `;
                cardsList.appendChild(card);
            });

            if(score === 3) {
                setVar('a14', true); 
                showToast("Tebrikler! Etkinliği kusursuz tamamladınız. ✓", "toast-success");
            } else {
                document.getElementById('timer-wrapper').style.display = "flex";
                let countdown = 10;
                const interval = setInterval(() => {
                    countdown--;
                    document.getElementById('countdown-num').innerText = countdown;
                    if(countdown <= 0) {
                        clearInterval(interval);
                        document.getElementById('timer-wrapper').style.display = "none";
                        setVar('a15', true); 
                        showToast("İnceleme tamamlandı, ilerleyebilirsiniz.", "toast-success");
                    }
                }, 1000);
            }
        }

        function showToast(txt, typeCls = '') {
            const toast = document.getElementById('toast-msg');
            const txtEl = document.getElementById('toast-text');
            
            toast.className = '';
            toast.classList.add('show');
            if (typeCls) toast.classList.add(typeCls);
            
            if(txt) txtEl.innerText = txt;
            
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function setVar(n, v) { try { parent.GetPlayer().SetVar(n, v); console.log(`${n} değişkeni Storyline'a gönderildi: ${v}`); } catch(e) { console.log(`${n} = ${v}`); } }

        window.addEventListener('resize', () => {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        });
        
        window.onload = () => { 
            window.dispatchEvent(new Event('resize')); 
            init(); 
        };
    </script>
</body>
</html>
