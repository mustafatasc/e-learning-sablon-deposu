<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maddenin Hâlleri - Sıralama Etkinliği</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            --cream-bg: #F8FAFC;
            --paper-grid: rgba(22, 163, 74, 0.08); /* Fen Bilimleri Yeşili Grid */
            
            /* Fen Bilimleri Yeşil Paleti */
            --primary-main: #16A34A; /* Green 600 */
            --primary-dark: #14532D; /* Green 900 */
            --primary-soft: #BBF7D0; /* Green 200 */
            --warm-grey: #334155;
            
            /* Başarı / Hata Renkleri */
            --success-green: #10B981;
            --error-red: #EF4444;
            --warning-orange: #F59E0B;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #030712; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; color: var(--warm-grey);
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }

        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        *::-webkit-scrollbar { display: none !important; }

        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--cream-bg); 
            background-image: linear-gradient(var(--paper-grid) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--paper-grid) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border-top: 6px solid var(--primary-main);
        }

        #scale-container::before {
            content: ''; position: absolute; top: -20%; left: -20%; width: 150%; height: 150%;
            background: radial-gradient(circle, rgba(187, 247, 208, 0.2) 0%, transparent 60%);
            z-index: 0; pointer-events: none;
        }

        .header {
            padding: 15px 40px 0 40px; height: 85px;
            display: flex; justify-content: space-between; align-items: start;
            flex-shrink: 0; z-index: 10;
        }

        .instruction-container { flex: 1; padding: 0; display: flex; flex-direction: column; justify-content: center; height: 100%;}
        .instruction-text { font-size: 15px; line-height: 1.4; font-weight: 900; color: var(--primary-dark); text-align: left; text-transform: uppercase; letter-spacing: 0.5px;}
        .sub-instruction { font-size: 12.5px; font-weight: 600; color: #64748b; margin-top: 2px; }
        .logo-right-container { width: 85px; height: 85px; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; margin-left: 20px; margin-top: -10px; }

        .content-wrapper {
            display: flex; flex-direction: row; flex: 1; padding: 0px 40px 15px 40px; gap: 20px; height: calc(540px - 85px);
            z-index: 10; position: relative;
        }

        /* --- Sol Panel: Senaryo ve Kontrol --- */
        .left-panel {
            width: 320px !important; display: flex; flex-direction: column; gap: 10px; justify-content: flex-start;
        }

        .scenario-box {
            background: rgba(255, 255, 255, 0.8); border: 2px solid rgba(22, 163, 74, 0.3); border-radius: 16px;
            padding: 20px; box-shadow: 0 4px 15px rgba(22, 163, 74, 0.05);
            display: flex; flex-direction: column; gap: 10px;
        }
        .scenario-title {
            font-size: 14px; font-weight: 900; color: var(--primary-main); text-transform: uppercase;
            display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;
        }
        .scenario-text {
            font-size: 13.5px; font-weight: 600; color: #334155; line-height: 1.6;
        }
        
        .control-panel { margin-top: auto; display: flex; flex-direction: column; gap: 8px; position: relative; }
        
        .btn-action {
            background: var(--primary-main); color: white; font-size: 15px; font-weight: 900;
            padding: 14px; border-radius: 12px; transition: 0.2s; cursor: pointer; width: 100%;
            text-align: center; border: none; box-shadow: 0 4px 10px rgba(22, 163, 74, 0.25); letter-spacing: 1px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-action:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(22, 163, 74, 0.35);}
        .btn-action:disabled { opacity: 0.5; pointer-events: none; box-shadow: none; transform: none; cursor: not-allowed; }
        .btn-action.completed-state {
            background-color: var(--success-green) !important; color: white !important;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3) !important; cursor: default; transform: none !important; pointer-events: none; opacity: 1;
        }
        .btn-action.timer-active { background: var(--warning-orange) !important; opacity: 1; pointer-events: none; transform: none; box-shadow: none;}

        /* --- Sağ Panel: Sıralama Listesi --- */
        .right-panel {
            flex: 1; display: flex; flex-direction: column; gap: 10px;
        }
        
        .list-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px; margin-bottom: 5px; border-bottom: 2px solid #cbd5e1; padding-bottom: 5px;
        }
        .list-header-title { font-size: 14px; font-weight: 900; color: var(--primary-dark); text-transform: uppercase;}
        .list-header-hint { font-size: 12px; font-weight: 700; color: #64748b; display: flex; align-items: center; gap: 5px;}

        .sortable-list {
            display: flex; flex-direction: column; gap: 8px; flex: 1;
            position: relative;
        }

        .sortable-item {
            background: white; border: 2px solid #e2e8f0; border-radius: 12px;
            padding: 12px 16px 12px 12px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02); transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            cursor: grab; user-select: none; position: relative; z-index: 1;
        }
        .sortable-item:hover { border-color: var(--primary-soft); }
        .sortable-item.dragging {
            z-index: 1000; cursor: grabbing; border-color: var(--primary-main);
            box-shadow: 0 10px 25px rgba(22, 163, 74, 0.2); transform: scale(1.02);
            opacity: 0.95; background: #f0fdf4;
        }
        /* Doğru/Yanlış Durumları */
        .sortable-item.correct-pos { border-color: var(--success-green); background: #f0fdf4; pointer-events: none;}
        .sortable-item.incorrect-pos { border-color: var(--error-red); background: #fef2f2; animation: shake 0.4s ease-in-out;}

        .drag-handle {
            color: #94a3b8; display: flex; align-items: center; justify-content: center;
            cursor: inherit;
        }

        .step-num {
            background: #f1f5f9; color: var(--primary-dark); width: 28px; height: 28px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 900; flex-shrink: 0; border: 2px solid #cbd5e1;
        }
        .sortable-item.correct-pos .step-num { background: var(--success-green); color: white; border-color: var(--success-green); }

        .item-text {
            font-size: 13.5px; font-weight: 700; color: #1e293b; line-height: 1.4; flex: 1; pointer-events: none;
        }

        /* Sıralama sırasında yer tutucu */
        .sortable-placeholder {
            border: 2px dashed var(--primary-soft); border-radius: 12px; background: rgba(241, 245, 249, 0.5);
            margin: 0; z-index: 0;
        }

        .message-box { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 800; padding: 8px 16px; border-radius: 8px; display: none; text-align: center; white-space: nowrap; z-index: 50;}
        .msg-success { background: #d1fae5; color: #065f46; border: 1px solid #10B981;}
        .msg-error { background: #fef2f2; color: #991b1b; border: 1px solid #EF4444;}

        #toast-msg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background-color: var(--primary-dark); color: white; font-weight: 800; font-size: 13px;
            padding: 10px 20px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000;
        }
        #toast-msg.show { transform: translateX(-50%) translateY(0); }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

    </style>
</head>
<body>

    <audio id="audio1" src="ses1.mp3" preload="auto"></audio>

    <div id="scale-container">
        
        <div id="toast-msg">
            <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="toast-text">Bildirim metni.</span>
        </div>

        <header class="header">
            <div class="instruction-container">
                <div class="instruction-text">MADDENİN HÂLLERİ: SIRALAMA ETKİNLİĞİ</div>
                <div class="sub-instruction">Kartları sürükleyerek istenen sıralamaya göre doğru yerlerine yerleştiriniz.</div>
            </div>
            <!-- Logo -->
            <div class="logo-right-container">
                <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none';">
            </div>
        </header>

        <main class="content-wrapper">
            
            <!-- Sol Panel: Senaryo ve Kontrol -->
            <div class="left-panel">
                
                <div class="scenario-box">
                    <div class="scenario-title">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        Görev
                    </div>
                    <div class="scenario-text">
                        Yandaki madde ve hâl örneklerini, <strong>tanecikler arası mesafe en AZ olandan en ÇOK olana</strong> doğru sıralayınız.
                    </div>
                </div>
                
                <div class="control-panel">
                    <div id="m-box" class="message-box"></div>
                    <button id="btn-c" class="btn-action" onclick="checkOrder()">KONTROL ET</button>
                </div>

            </div>

            <!-- Sağ Panel: Karışık Adımlar -->
            <div class="right-panel">
                <div class="list-header">
                    <div class="list-header-title">Madde Örnekleri</div>
                    <div class="list-header-hint">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 11l5-5m0 0l5 5m-5-5v12" /></svg>
                        Sürükleyerek sıralayın
                    </div>
                </div>

                <div class="sortable-list" id="sortable-list">
                    <!-- Items will be injected here dynamically in random order -->
                </div>
            </div>
            
        </main>
    </div>

    <!-- --- STREAMING_CHUNK:Initializing the logic and items... --- -->
    <script>
        let audioCtx = null;
        function getAudioContext() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
        
        function playSfx(type) {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type==='click') { osc.type='triangle'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime+0.1); }
                else if(type==='jump') { osc.type='sine'; osc.frequency.setValueAtTime(200, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime+0.1); }
                else if(type==='correct') { osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); }
                else if(type==='incorrect') { osc.type='sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.linearRampToValueAtTime(150, ctx.currentTime+0.3); }
                gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }

        // Doğru sıralama verileri
        const stepsData = [
            { id: 's1', order: 1, text: "Buz (katı hâl — 0°C altı)" },
            { id: 's2', order: 2, text: "Çelik levha (katı hâl)" },
            { id: 's3', order: 3, text: "Deniz suyu (sıvı hâl)" },
            { id: 's4', order: 4, text: "Nitrojen gazı (gaz hâl — oda koşulları)" },
            { id: 's5', order: 5, text: "Fırın içindeki buhar (su buharı — gaz hâl)" }
        ];

        let listEl, activeItem = null, placeholder = null;
        let startY, startTop, pointerId;
        let attempts = 0, done = false;

        function init() {
            listEl = document.getElementById('sortable-list');
            
            // Randomize items on load
            let shuffled = [...stepsData].sort(() => Math.random() - 0.5);
            
            // Render items
            shuffled.forEach(item => {
                const div = document.createElement('div');
                div.className = 'sortable-item';
                div.setAttribute('data-id', item.id);
                div.setAttribute('data-order', item.order);
                
                div.innerHTML = `
                    <div class="drag-handle">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
                    </div>
                    <div class="step-num">?</div>
                    <div class="item-text">${item.text}</div>
                `;
                
                div.addEventListener('pointerdown', dragStart);
                listEl.appendChild(div);
            });
            
            updateStepNumbers();

            const audio = document.getElementById('audio1');
            if(audio) {
                audio.play().catch(()=>{ console.log("Otomatik ses çalma engellendi."); });
            }
        }

        // --- STREAMING_CHUNK:Implementing vertical sorting drag events... ---
        function dragStart(e) {
            if (done || e.button !== 0 && e.type !== 'touchstart') return;
            
            activeItem = e.currentTarget;
            if (activeItem.classList.contains('correct-pos')) return; // Zaten doğruysa oynatma
            
            pointerId = e.pointerId;
            const rect = activeItem.getBoundingClientRect();
            const listRect = listEl.getBoundingClientRect();
            
            // Create placeholder
            placeholder = document.createElement('div');
            placeholder.className = 'sortable-placeholder';
            placeholder.style.height = `${rect.height}px`;
            activeItem.parentNode.insertBefore(placeholder, activeItem);
            
            // Absolute positioning relative to list
            activeItem.style.position = 'absolute';
            activeItem.style.top = `${rect.top - listRect.top}px`;
            activeItem.style.left = '0';
            activeItem.style.width = `${listRect.width}px`;
            activeItem.style.zIndex = '1000';
            activeItem.classList.add('dragging');
            
            const scale = document.getElementById('scale-container').getBoundingClientRect().width / 960;
            startY = e.clientY / scale;
            startTop = (rect.top - listRect.top) / scale; // scale compensation
            
            try { activeItem.setPointerCapture(pointerId); } catch(err){}
            
            window.addEventListener('pointermove', dragMove);
            window.addEventListener('pointerup', dragEnd);
            window.addEventListener('pointercancel', dragEnd);
            
            playSfx('click');
        }

        function dragMove(e) {
            if (!activeItem) return;
            e.preventDefault();
            
            const scale = document.getElementById('scale-container').getBoundingClientRect().width / 960;
            const currentY = e.clientY / scale;
            const dy = currentY - startY;
            
            // Yeni pozisyon
            let newTop = startTop + dy;
            
            // Sınırlar
            const maxTop = (listEl.getBoundingClientRect().height / scale) - (activeItem.getBoundingClientRect().height / scale);
            newTop = Math.max(0, Math.min(newTop, maxTop));
            
            activeItem.style.top = `${newTop}px`;

            // Swap logic (find which item we are hovering over)
            const items = Array.from(listEl.children).filter(child => child !== activeItem && !child.classList.contains('sortable-placeholder'));
            
            const activeCenter = newTop + (activeItem.getBoundingClientRect().height / scale) / 2;

            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                // Do not swap with locked items
                if (item.classList.contains('correct-pos')) continue;

                const itemTop = (item.getBoundingClientRect().top - listEl.getBoundingClientRect().top) / scale;
                const itemHeight = item.getBoundingClientRect().height / scale;
                const itemCenter = itemTop + itemHeight / 2;

                if (activeCenter < itemCenter && newTop < itemTop + itemHeight * 0.5) {
                    listEl.insertBefore(placeholder, item);
                    break;
                } else if (i === items.length - 1 && activeCenter > itemCenter) {
                    listEl.appendChild(placeholder);
                    break;
                }
            }
        }

        function dragEnd(e) {
            if (!activeItem) return;
            
            window.removeEventListener('pointermove', dragMove);
            window.removeEventListener('pointerup', dragEnd);
            window.removeEventListener('pointercancel', dragEnd);
            
            try { activeItem.releasePointerCapture(pointerId); } catch(err){}
            
            activeItem.classList.remove('dragging');
            activeItem.style.position = '';
            activeItem.style.top = '';
            activeItem.style.left = '';
            activeItem.style.width = '';
            activeItem.style.zIndex = '';
            
            // Put it where placeholder is
            listEl.insertBefore(activeItem, placeholder);
            placeholder.remove();
            placeholder = null;
            activeItem = null;
            
            updateStepNumbers();
            playSfx('jump');
            
            // Remove previous error states
            document.querySelectorAll('.sortable-item').forEach(el => el.classList.remove('incorrect-pos'));
        }

        function updateStepNumbers() {
            const items = Array.from(listEl.children).filter(c => c.classList.contains('sortable-item'));
            items.forEach((item, index) => {
                const numBox = item.querySelector('.step-num');
                numBox.innerText = index + 1;
            });
        }

        // --- STREAMING_CHUNK:Adding evaluation functions... ---
        function checkOrder() {
            if (done) return;
            
            const items = Array.from(listEl.children).filter(c => c.classList.contains('sortable-item'));
            let allCorrect = true;
            let correctCount = 0;

            items.forEach((item, index) => {
                const expectedOrder = parseInt(item.getAttribute('data-order'));
                const currentPos = index + 1;
                
                if (expectedOrder === currentPos) {
                    item.classList.add('correct-pos');
                    item.classList.remove('incorrect-pos');
                    correctCount++;
                } else {
                    item.classList.add('incorrect-pos');
                    item.classList.remove('correct-pos');
                    allCorrect = false;
                }
            });

            const btnCheck = document.getElementById('btn-c');

            if (allCorrect) {
                done = true;
                btnCheck.className = "btn-action completed-state";
                btnCheck.innerText = "TAMAMLANDI ✓";
                btnCheck.disabled = true;

                playSfx('correct');
                showToast("Tebrikler! Maddeleri mesafe kuralına göre doğru sıraladınız. ✓", "msg-success");
                
                // Storyline Değişkeni (c13)
                setVar('c13', true); 
            } else {
                attempts++;
                if (attempts === 1) {
                    playSfx('incorrect');
                    showMsg('Bazı örneklerin sırası yanlış. Kırmızı olanları tekrar düzenleyin.', 'msg-error');
                    
                    setTimeout(() => { 
                        if(!done) { 
                            document.getElementById('m-box').style.display = 'none'; 
                            document.querySelectorAll('.sortable-item').forEach(el => el.classList.remove('incorrect-pos'));
                        } 
                    }, 3000);
                } else { 
                    done = true; 
                    btnCheck.style.display = 'none'; 
                    solveAll(); 
                }
            }
        }

        function solveAll() {
            // Animasyonlu bir şekilde otomatik çözme
            const currentItems = Array.from(listEl.children).filter(c => c.classList.contains('sortable-item'));
            
            // Önce kırmızıları temizle
            currentItems.forEach(el => el.classList.remove('incorrect-pos'));

            showMsg('Hakkınız bitti. Doğru sıralama yapılıyor...', 'msg-error');
            
            let delay = 0;
            // 1'den 5'e kadar doğru sıraya koy
            for (let i = 1; i <= 5; i++) {
                setTimeout(() => {
                    const targetItem = currentItems.find(el => parseInt(el.getAttribute('data-order')) === i);
                    if (targetItem) {
                        listEl.appendChild(targetItem); // Sona ekle (sırayla eklediğimiz için doğru dizilir)
                        targetItem.classList.add('correct-pos');
                        updateStepNumbers();
                        playSfx('jump');
                    }
                }, delay);
                delay += 400;
            }

            setTimeout(() => {
                playSfx('correct');
                document.getElementById('m-box').style.display = 'none';
                const actionBtn = document.getElementById('btn-c');
                actionBtn.style.display = 'flex';
                actionBtn.disabled = true;
                actionBtn.className = "btn-action timer-active";
                
                let countdown = 10;
                actionBtn.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
                
                const interval = setInterval(() => {
                    countdown--;
                    actionBtn.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
                    if(countdown <= 0) {
                        clearInterval(interval);
                        actionBtn.innerText = "TAMAMLANDI ✓";
                        actionBtn.classList.remove('timer-active');
                        actionBtn.classList.add('completed-state');
                        
                        // Storyline Değişkeni (c14)
                        setVar('c14', true); 
                        
                        showToast("İnceleme tamamlandı, ilerleyebilirsiniz.", "toast-success");
                    }
                }, 1000);
            }, delay + 500);
        }

        function showMsg(t, cls) { const b = document.getElementById('m-box'); b.innerText = t; b.className = 'message-box ' + cls; b.style.display = 'block'; }
        function setVar(n, v) { try { parent.GetPlayer().SetVar(n, v); console.log(`Storyline Variable: ${n} = ${v}`); } catch(e) { console.log(`(Lokal) ${n} = ${v}`); } }

        function showToast(msg, typeCls = '') {
            const toast = document.getElementById('toast-msg');
            const txtEl = document.getElementById('toast-text');
            
            toast.className = '';
            toast.classList.add('show');
            if (typeCls) toast.classList.add(typeCls);
            
            if(msg) txtEl.innerText = msg;
            
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        window.addEventListener('resize', () => {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        });
        
        window.onload = () => { window.dispatchEvent(new Event('resize')); init(); };
    </script>
</body>
</html>
