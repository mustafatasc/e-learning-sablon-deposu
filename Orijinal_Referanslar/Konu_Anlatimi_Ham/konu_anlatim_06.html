<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Günlük Hayatta Açılar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            --bg-cream: #FCF9F2;
            --grid-line: rgba(185, 28, 28, 0.08);
            
            --primary-red: #B91C1C; 
            --light-red: #FEF2F2;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            
            --success-green: #10B981;
            --warning-orange: #F59E0B;
            --cyan-accent: #0ea5e9;
            --pink-accent: #ec4899;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0F172A; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; color: var(--text-dark);
            user-select: none; -webkit-user-select: none;
            visibility: hidden;
        }

        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        *::-webkit-scrollbar { display: none !important; }

        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--bg-cream); 
            background-image: 
                linear-gradient(var(--grid-line) 1.5px, transparent 1.5px), 
                linear-gradient(90deg, var(--grid-line) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-top: 6px solid var(--primary-red);
        }

        /* --- HEADER --- */
        .header {
            padding: 20px 40px 0 40px; height: 85px;
            display: flex; justify-content: space-between; align-items: start;
            flex-shrink: 0; z-index: 10;
        }

        .instruction-container { flex: 1; padding: 0; }
        .instruction-text-main { font-size: 16px; line-height: 1.4; font-weight: 900; color: var(--primary-red); text-transform: uppercase; letter-spacing: 1px;}
        .logo-right-container { width: 80px; height: 80px; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; margin-left: 20px; margin-top: -10px; }

        .content-wrapper {
            display: flex; flex-direction: column; flex: 1; padding: 0 40px 20px 40px; gap: 15px; height: calc(540px - 85px);
            z-index: 10;
        }

        /* --- YÖNERGE KUTUSU --- */
        .instruction-group {
            display: flex; align-items: center; gap: 15px; width: 100%;
            background: white; border-radius: 12px; padding: 10px 20px 10px 15px;
            border-left: 5px solid #1D4ED8; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            margin-top: 0;
        }

        .narrator-speaker {
            width: 34px; height: 34px; background: var(--primary-red); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(185, 28, 28, 0.4); cursor: pointer;
        }

        @keyframes pulsePlay {
            0% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(185, 28, 28, 0); }
            100% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0); }
        }

        .instruction-text {
            font-size: 15px; line-height: 1.4; font-weight: 700; color: var(--text-dark);
        }

        /* --- ORTA PANEL: GÖRSELLER VE METİN --- */
        .main-activity-area {
            display: flex; flex-direction: column; gap: 20px; flex: 1; min-height: 0; justify-content: center;
        }

        /* Görseller (SVG) */
        .visuals-row {
            display: flex; justify-content: space-evenly; align-items: center; gap: 20px;
            height: 150px;
        }

        .visual-card {
            background: white; border: 3px solid #e2e8f0; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 10px 15px; width: 160px; height: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .svg-container {
            flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;
        }

        .math-svg { width: 100%; height: 100%; max-height: 90px; }
        .visual-img { max-width: 100%; max-height: 90px; object-fit: contain; }

        .visual-label {
            font-size: 13px; font-weight: 800; color: var(--cyan-accent); font-family: 'Montserrat', sans-serif;
            margin-top: 5px; text-transform: uppercase;
        }

        /* Bilgi Metni Kutusu */
        .info-box {
            background: white; border: 2px dashed #cbd5e1; border-radius: 16px;
            padding: 20px 30px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02); position: relative;
        }

        .info-paragraph {
            font-size: 16.5px; font-weight: 600; line-height: 1.6; color: var(--text-dark);
        }

        /* Soru İşaretleri Animasyonu */
        .q-marks-container {
            display: flex; justify-content: center; gap: 8px; margin-top: 15px;
            height: 40px; /* Sabit yükseklik, zıplamayı önler */
        }

        .q-mark {
            font-size: 32px; font-weight: 900; color: var(--primary-red);
            opacity: 0; transform: translateX(40px); /* Sağdan gelecek şekilde ayarlandı */
            animation: slideInRight 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideInRight {
            to { opacity: 1; transform: translateX(0); }
        }

        /* --- ALT PANEL: KONTROL --- */
        .bottom-panel {
            display: flex; justify-content: flex-end; align-items: center; height: 45px; flex-shrink: 0; margin-top: auto;
        }

        .btn-action {
            background: var(--success-green); color: white; min-width: 240px; height: 45px;
            font-size: 15px; font-weight: 800; border-radius: 12px;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3); border: none;
            cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
            padding: 0 25px; margin-left: auto;
        }
        
        .btn-action:hover { background: #059669; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); }
        .btn-action.completed { background: #64748b; pointer-events: none; transform: none; box-shadow: none;}

        /* Toast Bildirimi */
        #toast-msg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            font-weight: 800; font-size: 14px;
            padding: 12px 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000; color: white; background-color: var(--success-green);
        }
        #toast-msg.show { transform: translateX(-50%) translateY(0); }

    </style>
</head>
<body>

    <audio id="ses1" src="ses1.mp3" preload="auto" autoplay></audio>

    <div id="scale-container">
        
        <div id="toast-msg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="toast-text"></span>
        </div>

        <header class="header">
            <div class="instruction-container">
                <div class="instruction-text-main">GÜNLÜK HAYATTA AÇILAR</div>
            </div>
            <div class="logo-right-container">
                <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none';">
            </div>
        </header>

        <main class="content-wrapper">
            
            <div class="instruction-group">
                <div id="main-speaker" class="narrator-speaker" onclick="playAudio('ses1')">
                    <svg class="w-4 h-4 pl-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.546-2.07-2.584-1.23L6.15 6.75H3A1.5 1.5 0 001.5 8.25v7.5A1.5 1.5 0 003 17.25h3.15l4.766 3.92c1.038.84 2.584.106 2.584-1.23V4.06z"/></svg>
                </div>
                <div class="instruction-text">
                    Görselleri inceleyerek günlük hayatta gözlemlediğimiz açıları düşünelim.
                </div>
            </div>

            <!-- ORTA PANEL -->
            <div class="main-activity-area">
                
                <!-- GÖRSELLER -->
                <div class="visuals-row">
                    
                    <!-- 1. Makas -->
                    <div class="visual-card">
                        <div class="svg-container">
                            <img src="r2.png" alt="Makas" class="visual-img" onerror="this.style.display='none';">
                        </div>
                        <div class="visual-label">Makas</div>
                    </div>

                    <!-- 2. Saat -->
                    <div class="visual-card">
                        <div class="svg-container">
                            <img src="r3.png" alt="Saat" class="visual-img" onerror="this.style.display='none';">
                        </div>
                        <div class="visual-label">Saat</div>
                    </div>

                    <!-- 3. Açık Pencere -->
                    <div class="visual-card">
                        <div class="svg-container">
                            <img src="r4.png" alt="Açık Pencere" class="visual-img" onerror="this.style.display='none';">
                        </div>
                        <div class="visual-label">Açık Pencere</div>
                    </div>

                </div>

                <!-- BİLGİ METNİ KUTUSU -->
                <div class="info-box">
                    <div class="info-paragraph">
                        Yukarıdaki görsellerde günlük hayatta gözlemlediğimiz açıların bulunduğu bazı yerler verilmiştir. Görselleri inceleyerek bu açıları nasıl ölçebileceğimizi düşünelim.
                    </div>
                    
                    <!-- Kayarak Çıkan Soru İşaretleri -->
                    <div class="q-marks-container">
                        <span class="q-mark" style="animation-delay: 1.5s;">?</span>
                        <span class="q-mark" style="animation-delay: 1.8s;">?</span>
                        <span class="q-mark" style="animation-delay: 2.1s;">?</span>
                    </div>
                </div>

            </div>

            <!-- ALT PANEL: TAMAMLA BUTONU -->
            <div class="bottom-panel">
                <button id="btn-complete" class="btn-action" onclick="completeTopic()">
                    TAMAMLA ✓
                </button>
            </div>

        </main>
    </div>

    <script>
        let audioCtx = null;
        let isAudioPlaying = false;
        
        function getAudioContext() { 
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            return audioCtx; 
        }
        
        function playSfx(type) {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type==='success') { osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); }
                gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }

        let isCompleted = false;

        // Zorunlu Otomatik Oynatma Fonksiyonu
        function forceAutoplay() {
            if (isAudioPlaying) return; 
            const audio = document.getElementById('ses1');
            const speaker = document.getElementById('main-speaker');
            
            if (audio) {
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                        window.removeEventListener('click', forceAutoplay);
                        window.removeEventListener('touchstart', forceAutoplay);
                    }).catch(error => {
                        if(speaker) speaker.style.animation = 'none';
                    });
                }
            }
        }

        function playAudio(id) {
            const audio = document.getElementById(id);
            const speaker = document.getElementById('main-speaker');
            if(audio) {
                audio.pause(); audio.currentTime = 0; 
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                    }).catch(e => console.log(e));
                }
            }
        }

        function init() {
            const s = document.getElementById('ses1');
            if(s) {
                s.addEventListener('ended', () => {
                    const speaker = document.getElementById('main-speaker');
                    if(speaker) speaker.style.animation = 'none'; 
                    isAudioPlaying = false; 
                });
            }

            forceAutoplay();
            window.addEventListener('click', forceAutoplay);
            window.addEventListener('touchstart', forceAutoplay);
        }

        function completeTopic() {
            if (isCompleted) return;
            isCompleted = true;
            
            playSfx('success');
            
            const btn = document.getElementById('btn-complete');
            btn.innerHTML = `TAMAMLANDI ✓`;
            btn.classList.add('completed');
            
            showToast("İnceleme başarıyla tamamlandı. İlerleyebilirsiniz.");
            
            // d7 değişkenini tetikle
            setVar('d7', true);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-msg');
            document.getElementById('toast-text').innerText = msg;
            
            toast.className = ''; 
            toast.classList.add('show');
            
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        function setVar(n, v) { 
            try { 
                parent.GetPlayer().SetVar(n, v); 
                console.log(`Storyline Variable Set: ${n} = ${v}`); 
            } catch(e) { 
                console.log(`(Local) Storyline Variable: ${n} = ${v}`); 
            } 
        }

        function applyScale() {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        }
        
        applyScale(); 
        document.body.style.visibility = 'visible'; 
        
        window.addEventListener('resize', applyScale);
        window.onload = () => { init(); };
    </script>
</body>
</html>
