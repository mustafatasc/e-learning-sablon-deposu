<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Düzgün Çokgenler - Konu Anlatımı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            --bg-cream: #FCF9F2;
            --grid-line: rgba(185, 28, 28, 0.08);
            
            --primary-red: #B91C1C; 
            --primary-dark: #7F1D1D;
            --text-dark: #1E293B;
            --success-green: #10B981;
            --cyan-accent: #0ea5e9;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0F172A; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; color: var(--text-dark);
            user-select: none; -webkit-user-select: none;
            visibility: hidden;
        }

        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--bg-cream); 
            background-image: 
                linear-gradient(var(--grid-line) 1.5px, transparent 1.5px), 
                linear-gradient(90deg, var(--grid-line) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-top: 6px solid var(--primary-red);
        }

        /* */
        .header {
            padding: 15px 40px 0 40px; height: 75px;
            display: flex; justify-content: space-between; align-items: start;
            flex-shrink: 0; z-index: 10;
        }

        .instruction-container { flex: 1; padding: 0; }
        .instruction-text-main { font-size: 16px; line-height: 1.4; font-weight: 900; color: var(--primary-red); text-transform: uppercase; letter-spacing: 1px;}
        .logo-right-container { width: 75px; height: 75px; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; margin-left: 20px; margin-top: -10px; }

        .content-wrapper {
            display: flex; flex-direction: column; flex: 1; padding: 0 40px 15px 40px; gap: 15px; height: calc(540px - 75px);
            z-index: 10; position: relative; min-height: 0;
        }

        /* --- BİLGİ KUTUSU --- */
        .info-box {
            display: flex; align-items: center; gap: 15px; width: 100%;
            background: white; border-radius: 12px; padding: 15px 25px 15px 15px;
            border-left: 5px solid #1D4ED8; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            margin-top: 0; z-index: 10;
        }

        .narrator-speaker {
            width: 36px; height: 36px; background: var(--primary-red); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(185, 28, 28, 0.4); cursor: pointer; transition: transform 0.2s;
        }
        
        .narrator-speaker:hover { transform: scale(1.1); }

        @keyframes pulsePlay {
            0% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(185, 28, 28, 0); }
            100% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0); }
        }

        .info-text {
            font-size: 15px; line-height: 1.5; font-weight: 600; color: var(--text-dark);
        }
        
        .info-text strong {
            color: #1D4ED8; font-weight: 800;
        }

        /* */
        /* --- KARTLAR (4 SÜTUNLU YAPI) --- */
        .cards-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; flex: 1; min-height: 0;
        }

        .poly-card {
            background: white; border: 2px solid #e2e8f0; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: all 0.3s ease;
            position: relative; overflow: hidden;
            background-image: 
                linear-gradient(#f1f5f9 1px, transparent 1px), 
                linear-gradient(90deg, #f1f5f9 1px, transparent 1px);
            background-size: 15px 15px; background-position: center;
        }
        
        .poly-card:hover {
            border-color: #cbd5e1; box-shadow: 0 8px 20px rgba(0,0,0,0.06); transform: translateY(-3px);
        }

        .svg-container {
            width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0;
        }

        .math-svg { width: 100%; height: 100%; max-height: 140px; }

        .poly-name {
            font-size: 14px; font-weight: 800; color: var(--primary-red); text-transform: uppercase;
            background: rgba(255,255,255,0.9); padding: 5px 10px; border-radius: 8px; margin-top: 5px;
            border: 1px dashed #cbd5e1; width: 100%; text-align: center;
        }

        /* --- ALT PANEL VE BUTON --- */
        .bottom-panel {
            display: flex; justify-content: flex-end; align-items: center; height: 45px; flex-shrink: 0; margin-top: auto;
        }

        .btn-action {
            background: var(--primary-red); color: white; min-width: 200px; height: 45px;
            font-size: 14px; font-weight: 800; border-radius: 12px;
            box-shadow: 0 6px 15px rgba(185, 28, 28, 0.3); border: none;
            cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            opacity: 0; pointer-events: none; transform: translateY(15px);
        }
        
        .btn-action.show-btn { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .btn-action:hover { background: #991b1b; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(185, 28, 28, 0.4); }
        .btn-action.completed { background: var(--success-green); pointer-events: none; transform: none; box-shadow: none;}

        /* Toast Bildirimi */
        #toast-msg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            font-weight: 800; font-size: 14px;
            padding: 12px 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000; color: white; background-color: var(--success-green);
        }
        #toast-msg.show { transform: translateX(-50%) translateY(0); }

    </style>
</head>

    <script>
        let audioCtx = null;
        let isAudioPlaying = false;

        function getAudioContext() { 
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            return audioCtx; 
        }

        function playSfx(type) {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type==='click') { osc.type='triangle'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime+0.1); }
                else if(type==='success') { osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); }
                gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }

        function forceAutoplay() {
            if (isAudioPlaying) return; 
            
            const audio = document.getElementById('ses1');
            const speaker = document.getElementById('main-speaker');
            
            if (audio) {
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                        
                        window.removeEventListener('click', forceAutoplay);
                        window.removeEventListener('touchstart', forceAutoplay);
                    }).catch(error => {
                        if(speaker) speaker.style.animation = 'none';
                    });
                }
            }
        }
        
        function init() {
            const s = document.getElementById('ses1');
            if(s) {
                s.addEventListener('ended', () => {
                    const speaker = document.getElementById('main-speaker');
                    if(speaker) speaker.style.animation = 'none'; 
                    isAudioPlaying = false; 

                    // Ses bitince TAMAMLA butonunu göster
                    const btnComplete = document.getElementById('btn-complete');
                    if(btnComplete) btnComplete.classList.add('show-btn');
                });
            }

            forceAutoplay();
            window.addEventListener('click', forceAutoplay);
            window.addEventListener('touchstart', forceAutoplay);

            // Ses çalışmazsa hata payı olarak 5 saniye sonra butonu göster
            setTimeout(() => {
                const btnComplete = document.getElementById('btn-complete');
                if(btnComplete && !btnComplete.classList.contains('show-btn')) {
                    btnComplete.classList.add('show-btn');
                }
            }, 5000);
        }

        function playAudio(id) {
            const audio = document.getElementById(id);
            const speaker = document.getElementById('main-speaker');
            
            if(audio) {
                audio.pause(); 
                audio.currentTime = 0; 
                let playPromise = audio.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                    }).catch(e => console.log(e));
                }
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-msg');
            document.getElementById('toast-text').innerText = msg;
            toast.className = ''; toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        function setVar(n, v) { 
            try { 
                parent.GetPlayer().SetVar(n, v); 
                console.log(`Storyline Variable Set: ${n} = ${v}`); 
            } catch(e) { 
                console.log(`(Local) Storyline Variable: ${n} = ${v}`); 
            } 
        }

        function completeTopic() {
            playSfx('success');
            const btn = document.getElementById('btn-complete');
            btn.innerHTML = `TAMAMLANDI ✓`;
            btn.classList.add('completed');
            
            // w23 değişkenini tetikle
            setVar('w23', true);
            showToast("İncelemeyi tamamladınız. İlerleyebilirsiniz.");
        }

        function applyScale() {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        }

        window.onload = () => {
            init();
        };

        applyScale(); 
        document.body.style.visibility = 'visible'; 
        window.addEventListener('resize', applyScale);

    </script>
</body>
</html>
