<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{SAYFA_BASLIGI}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            --bg-cream: #FCF9F2;
            
            --primary-blue: #2563EB; 
            --primary-dark: #1E3A8A;
            --light-blue: #EFF6FF;
            --text-dark: #1E293B;
            --success-green: #10B981;
            --error-red: #EF4444;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0F172A; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; color: var(--text-dark);
            user-select: none; -webkit-user-select: none;
            touch-action: none; 
        }
        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        *::-webkit-scrollbar { display: none !important; }
        
        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--bg-cream); 
            background-image: 
                linear-gradient(rgba(37, 99, 235, 0.04) 1.5px, transparent 1.5px), 
                linear-gradient(90deg, rgba(37, 99, 235, 0.04) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-top: 6px solid var(--primary-blue);
        }
        
        /* --- ÜST YÖNERGE ALANI --- */
        .header {
            padding: 20px 40px 0 40px; height: 90px;
            display: flex; justify-content: space-between; align-items: start;
            flex-shrink: 0; z-index: 10;
        }
        .instruction-group {
            display: flex; align-items: center; gap: 15px; flex: 1;
            background: white; border-radius: 12px; padding: 12px 20px;
            border-left: 5px solid var(--primary-blue);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }
        .instruction-text {
            font-size: 15px; line-height: 1.4; font-weight: 800; color: var(--text-dark); cursor: pointer;
        }
        .logo-right-container {
            width: 80px; height: 80px; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; margin-left: 20px; margin-top: -5px;
        }
        .narrator-speaker {
            width: 36px; height: 36px; background: var(--primary-blue); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4); cursor: pointer;
        }
        @keyframes pulsePlay {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
        
        .content-wrapper {
            display: flex; flex-direction: column; flex: 1; padding: 15px 40px 25px 40px; height: calc(540px - 90px);
            z-index: 10; position: relative; gap: 15px; min-height: 0;
        }
        
        /* --- ORTA ALAN --- */
        .main-activity-area {
            display: flex; gap: 30px; flex: 1; min-height: 0; align-items: stretch;
        }
        
        /* Sol: SVG Etkileşim Alanı */
        .svg-board {
            flex: 2.2; background-color: white; border: 3px solid #cbd5e1; border-radius: 16px;
            position: relative; overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.02);
            display: flex; justify-content: center; align-items: center;
        }
        .svg-board svg {
            width: 100%; height: 100%; object-fit: contain; max-height: 100%;
        }
        
        /* Sağ: Durum Paneli */
        .status-panel {
            flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center;
            overflow-y: auto; padding-right: 5px;
        }
        .status-header {
            font-size: 14px; font-weight: 900; color: var(--primary-blue); text-align: center; 
            text-transform: uppercase; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; margin-bottom: 5px;
        }
        .status-card {
            background: white; border: 2px dashed #cbd5e1; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; padding: 12px;
            font-size: 10px; font-weight: 800; color: #94a3b8; transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02); flex-shrink: 0; text-align: center; line-height: 1.2;
        }
        .status-card.matched {
            background: #ecfdf5; border-color: var(--success-green); border-style: solid;
            color: var(--success-green); box-shadow: 0 4px 10px rgba(16, 185, 129, 0.1);
        }
        
        /* --- SVG KART VE NOKTA STİLLERİ --- */
        .pt-group { cursor: pointer; }
        
        /* Kart Kutusu */
        .item-card {
            fill: white; stroke: #e2e8f0; stroke-width: 2.5px; transition: all 0.2s ease;
        }
        /* Kart Metni */
        .item-text {
            font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 800; fill: var(--text-dark);
            pointer-events: none; user-select: none; transition: all 0.2s ease;
        }
        
        /* Bağlantı Noktaları */
        .hitbox { fill: transparent; }
        .dot { fill: #cbd5e1; transition: all 0.2s; transform-box: fill-box; transform-origin: center; }
        .ring { fill: transparent; stroke: transparent; stroke-width: 3px; transition: all 0.2s; }
        
        /* Hover, Seçili, Doğru/Yanlış Durumları */
        .pt-group:hover .item-card { stroke: var(--primary-blue); }
        .pt-group:hover .ring { stroke: #cbd5e1; }
        
        .pt-group.selected .item-card { stroke: var(--primary-blue); fill: var(--light-blue); }
        .pt-group.selected .item-text { fill: var(--primary-blue); }
        .pt-group.selected .dot { fill: var(--primary-blue); transform: scale(1.4); }
        .pt-group.selected .ring { stroke: var(--primary-blue); }
        
        .pt-group.is-error { animation: shake 0.4s ease-in-out; }
        .pt-group.is-error .item-card { stroke: var(--error-red); fill: #fef2f2; }
        .pt-group.is-error .item-text { fill: var(--error-red); }
        .pt-group.is-error .dot { fill: var(--error-red); }
        
        .pt-group.matched .item-card { stroke: var(--success-green); fill: #ecfdf5; }
        .pt-group.matched .item-text { fill: var(--success-green); }
        .pt-group.matched .dot { fill: var(--success-green); }
        .pt-group.matched { pointer-events: none; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }
        
        /* Çizilen Doğrular */
        .drawn-line {
            stroke: var(--success-green); stroke-width: 4.5; stroke-linecap: round;
            stroke-dasharray: 1000; stroke-dashoffset: 1000;
            animation: drawLine 0.6s cubic-bezier(0.2, 0, 0.2, 1) forwards;
        }
        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }
        
        /* --- ALT PANEL VE BUTON --- */
        .bottom-panel {
            display: flex; justify-content: flex-end; align-items: center; height: 50px; flex-shrink: 0;
        }
        .btn-action {
            background: var(--success-green); color: white; min-width: 220px; height: 50px;
            font-size: 15px; font-weight: 900; border-radius: 12px;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3); border: none;
            cursor: pointer; transition: all 0.4s; letter-spacing: 1px;
            opacity: 0; pointer-events: none; transform: translateY(15px);
        }
        
        .btn-action.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .btn-action:hover { background: #059669; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); }
        .btn-action.completed { background: var(--primary-blue); pointer-events: none; transform: none; box-shadow: none;}
        
        /* Toast Bildirimi */
        #toast-msg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background-color: var(--success-green); color: white; font-weight: 800; font-size: 14px;
            padding: 12px 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000;
        }
        #toast-msg.show { transform: translateX(-50%) translateY(0); }
        .toast-error { background-color: var(--error-red) !important; }
    </style>
</head>
<body>
    
    <audio id="audio1" src="{{SES_DOSYASI_URL}}" preload="auto"></audio>
    
    <div id="scale-container">
        
        <div id="toast-msg">
            <svg id="toast-icon" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="toast-text"></span>
        </div>

        <header class="header">
            <div class="instruction-group">
                <div id="speaker" class="narrator-speaker" onclick="playAudio()">
                    <svg class="w-5 h-5 pl-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.546-2.07-2.584-1.23L6.15 6.75H3A1.5 1.5 0 001.5 8.25v7.5A1.5 1.5 0 003 17.25h3.15l4.766 3.92c1.038.84 2.584.106 2.584-1.23V4.06z"/></svg>
                </div>
                <div class="instruction-text" onclick="playAudio()">
                    {{ANA_YONERGE_METNI_ORN_Soldaki_kavramlari_sagdaki_kavramlarla_eslestiriniz}}
                </div>
            </div>
            <div class="logo-right-container">
                <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none';">
            </div>
        </header>

        <main class="content-wrapper">
            <div class="main-activity-area">
                
                <!-- SOL: SVG Etkileşim Alanı -->
                <div class="svg-board">
                    <svg width="100%" height="100%" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
                        
                        <!-- Eşleşen Çizgiler Arka Planda Kalsın Diye En Üste Yazıldı -->
                        <g id="matched-lines"></g>
                        
                        <!-- SOL SÜTUN KARTLARI (L1, L2, L3, L4) -->
                        <g class="pt-group" id="pt-L1" onclick="handlePtClick('L1')">
                            <rect x="20" y="40" width="160" height="50" rx="10" class="item-card" />
                            <text x="100" y="70" class="item-text" text-anchor="middle">{{SOL_KART_1_METNI}}</text>
                            <circle cx="180" cy="65" r="20" class="hitbox" />
                            <circle cx="180" cy="65" r="10" class="ring" />
                            <circle cx="180" cy="65" r="5" class="dot" />
                        </g>

                        <g class="pt-group" id="pt-L2" onclick="handlePtClick('L2')">
                            <rect x="20" y="130" width="160" height="50" rx="10" class="item-card" />
                            <text x="100" y="160" class="item-text" text-anchor="middle">{{SOL_KART_2_METNI}}</text>
                            <circle cx="180" cy="155" r="20" class="hitbox" />
                            <circle cx="180" cy="155" r="10" class="ring" />
                            <circle cx="180" cy="155" r="5" class="dot" />
                        </g>

                        <g class="pt-group" id="pt-L3" onclick="handlePtClick('L3')">
                            <rect x="20" y="220" width="160" height="50" rx="10" class="item-card" />
                            <text x="100" y="250" class="item-text" text-anchor="middle">{{SOL_KART_3_METNI}}</text>
                            <circle cx="180" cy="245" r="20" class="hitbox" />
                            <circle cx="180" cy="245" r="10" class="ring" />
                            <circle cx="180" cy="245" r="5" class="dot" />
                        </g>

                        <g class="pt-group" id="pt-L4" onclick="handlePtClick('L4')">
                            <rect x="20" y="310" width="160" height="50" rx="10" class="item-card" />
                            <text x="100" y="340" class="item-text" text-anchor="middle">{{SOL_KART_4_METNI}}</text>
                            <circle cx="180" cy="335" r="20" class="hitbox" />
                            <circle cx="180" cy="335" r="10" class="ring" />
                            <circle cx="180" cy="335" r="5" class="dot" />
                        </g>

                        <!-- SAĞ SÜTUN KARTLARI (R1, R2, R3, R4) -->
                        <g class="pt-group" id="pt-R1" onclick="handlePtClick('R1')">
                            <rect x="420" y="40" width="160" height="50" rx="10" class="item-card" />
                            <text x="500" y="70" class="item-text" text-anchor="middle">{{SAG_KART_1_METNI}}</text>
                            <circle cx="420" cy="65" r="20" class="hitbox" />
                            <circle cx="420" cy="65" r="10" class="ring" />
                            <circle cx="420" cy="65" r="5" class="dot" />
                        </g>

                        <g class="pt-group" id="pt-R2" onclick="handlePtClick('R2')">
                            <rect x="420" y="130" width="160" height="50" rx="10" class="item-card" />
                            <text x="500" y="160" class="item-text" text-anchor="middle">{{SAG_KART_2_METNI}}</text>
                            <circle cx="420" cy="155" r="20" class="hitbox" />
                            <circle cx="420" cy="155" r="10" class="ring" />
                            <circle cx="420" cy="155" r="5" class="dot" />
                        </g>

                        <g class="pt-group" id="pt-R3" onclick="handlePtClick('R3')">
                            <rect x="420" y="220" width="160" height="50" rx="10" class="item-card" />
                            <text x="500" y="250" class="item-text" text-anchor="middle">{{SAG_KART_3_METNI}}</text>
                            <circle cx="420" cy="245" r="20" class="hitbox" />
                            <circle cx="420" cy="245" r="10" class="ring" />
                            <circle cx="420" cy="245" r="5" class="dot" />
                        </g>

                        <g class="pt-group" id="pt-R4" onclick="handlePtClick('R4')">
                            <rect x="420" y="310" width="160" height="50" rx="10" class="item-card" />
                            <text x="500" y="340" class="item-text" text-anchor="middle">{{SAG_KART_4_METNI}}</text>
                            <circle cx="420" cy="335" r="20" class="hitbox" />
                            <circle cx="420" cy="335" r="10" class="ring" />
                            <circle cx="420" cy="335" r="5" class="dot" />
                        </g>

                    </svg>
                </div>
                
                <!-- SAĞ: Durum Paneli -->
                <div class="status-panel">
                    <div class="status-header">{{DURUM_PANELI_BASLIGI_ORN_Eslestirmeler}}</div>
                    <div id="status-panel-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
                </div>
            </div>
            
            <!-- ALT PANEL: Buton -->
            <div class="bottom-panel">
                <button id="btn-complete" class="btn-action" onclick="completeTopic()">
                    TAMAMLA ✓
                </button>
            </div>
            
        </main>
    </div>
    
    <script>
        let audioCtx = null;
        let isAudioPlaying = false;
        
        // --- ETKİNLİK AYARLARI ---
        const TOTAL_PAIRS = 4; 

        // Tıklanan Noktaların Çizim Merkezleri (SVG boyutlarına göre kodlanmıştır, değiştirmeyin)
        const coords = {
            'L1': {x: 180, y: 65},
            'L2': {x: 180, y: 155},
            'L3': {x: 180, y: 245},
            'L4': {x: 180, y: 335},
            'R1': {x: 420, y: 65},
            'R2': {x: 420, y: 155},
            'R3': {x: 420, y: 245},
            'R4': {x: 420, y: 335}
        };

        // DOĞRU EŞLEŞME İKİLİLERİ (Çarpraz kurgulanmıştır)
        // Kullanıcı sağdan sola veya soldan sağa tıklayabilir, sistem çift yönlü algılar.
        const validPairs = [
            ['L1', 'R3'], // Sol 1 ile Sağ 3 eşleşir
            ['L2', 'R1'], // Sol 2 ile Sağ 1 eşleşir
            ['L3', 'R4'], // Sol 3 ile Sağ 4 eşleşir
            ['L4', 'R2']  // Sol 4 ile Sağ 2 eşleşir
        ];
        // -------------------------

        function getAudioContext() { 
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            return audioCtx; 
        }

        function playSfx(type) {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type==='click') { osc.type='triangle'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime+0.1); }
                else if(type==='success') { osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); }
                else if(type==='error') { osc.type='sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.linearRampToValueAtTime(150, ctx.currentTime+0.3); }
                gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }

        function forceAutoplay() {
            if (isAudioPlaying) return; 
            const audio = document.getElementById('audio1');
            const speaker = document.getElementById('speaker');
            if (audio) {
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                        window.removeEventListener('click', forceAutoplay);
                        window.removeEventListener('touchstart', forceAutoplay);
                    }).catch(error => { if(speaker) speaker.style.animation = 'none'; });
                }
            }
        }
        
        function playAudio() {
            const audio = document.getElementById('audio1');
            const speaker = document.getElementById('speaker');
            if(audio) {
                audio.pause(); audio.currentTime = 0; 
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                    }).catch(e => console.log(e));
                }
            }
        }

        let selectedPoint = null;
        let matchedCount = 0;
        let isCompleted = false;

        function init() {
            // Dinamik Durum Paneli Kutularını Oluştur
            const statusPanel = document.getElementById('status-panel-container');
            statusPanel.innerHTML = '';
            for(let i=1; i<=TOTAL_PAIRS; i++) {
                let div = document.createElement('div');
                div.className = 'status-card';
                div.id = 'slot-' + i;
                div.innerText = '? - ?';
                statusPanel.appendChild(div);
            }

            const audio = document.getElementById('audio1');
            if(audio) {
                audio.addEventListener('ended', () => {
                    const speaker = document.getElementById('speaker');
                    if(speaker) speaker.style.animation = 'none'; 
                    isAudioPlaying = false; 
                });
            }
            forceAutoplay();
            window.addEventListener('click', forceAutoplay);
            window.addEventListener('touchstart', forceAutoplay);
        }

        function handlePtClick(id) {
            if (isCompleted) return;
            let el = document.getElementById(`pt-${id}`);
            if (!el || el.classList.contains('matched')) return;
            
            if (!selectedPoint) {
                // İlk noktayı seç
                selectedPoint = id;
                el.classList.add('selected');
                playSfx('click');
            } else if (selectedPoint === id) {
                // Aynı noktaya tıklarsa seçimi kaldır
                selectedPoint = null;
                el.classList.remove('selected');
                playSfx('click');
            } else if (selectedPoint.charAt(0) === id.charAt(0)) {
                // Aynı sütundan (örn: Sol ve Sol) başka bir maddeye tıklarsa, seçimi değiştir
                document.getElementById(`pt-${selectedPoint}`).classList.remove('selected');
                selectedPoint = id;
                el.classList.add('selected');
                playSfx('click');
            } else {
                // İkinci nokta (karşı sütun) seçildi, eşleşmeyi ÇİFT YÖNLÜ kontrol et
                let isValid = validPairs.some(p => 
                    (p[0] === selectedPoint && p[1] === id) || 
                    (p[1] === selectedPoint && p[0] === id)
                );
                
                let p1El = document.getElementById(`pt-${selectedPoint}`);
                let p2El = el;
                
                if (isValid) {
                    // Doğru Eşleşme
                    drawLine(selectedPoint, id);
                    p1El.classList.remove('selected');
                    p1El.classList.add('matched');
                    p2El.classList.add('matched');
                    
                    matchedCount++;
                    updateStatusPanel(selectedPoint, id, matchedCount);
                    playSfx('success');
                    selectedPoint = null;
                    
                    if (matchedCount === TOTAL_PAIRS) {
                        isCompleted = true;
                        document.getElementById('btn-complete').classList.add('show');
                        showToast("{{BASARI_GERI_BILDIRIM_METNI}}", "toast-success");
                    }
                } else {
                    // Yanlış Eşleşme
                    playSfx('error');
                    p1El.classList.add('is-error');
                    p2El.classList.add('is-error');
                    
                    setTimeout(() => {
                        p1El.classList.remove('is-error', 'selected');
                        p2El.classList.remove('is-error');
                        selectedPoint = null;
                    }, 500);
                }
            }
        }

        function drawLine(id1, id2) {
            if (!coords[id1] || !coords[id2]) return;
            
            let svg = document.getElementById('matched-lines');
            let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", coords[id1].x);
            line.setAttribute("y1", coords[id1].y);
            line.setAttribute("x2", coords[id2].x);
            line.setAttribute("y2", coords[id2].y);
            line.setAttribute("class", "drawn-line");
            svg.appendChild(line);
        }

        function updateStatusPanel(id1, id2, count) {
            let slot = document.getElementById(`slot-${count}`);
            if(slot) {
                // İsme göre eşleştirme (AD etiketlerini DOM'dan çek)
                let name1 = document.getElementById(`pt-${id1}`).querySelector('.item-text').textContent;
                let name2 = document.getElementById(`pt-${id2}`).querySelector('.item-text').textContent;
                slot.innerHTML = `<span style="color:var(--primary-main)">${name1}</span><br>➖<br><span style="color:var(--primary-main)">${name2}</span>`;
                slot.classList.add('matched');
            }
        }

        function completeTopic() {
            playSfx('success');
            const btn = document.getElementById('btn-complete');
            btn.innerHTML = `TAMAMLANDI ✓`;
            btn.classList.add('completed');
            
            setVar('{{STORYLINE_VAR_TAMAMLANDI}}', true);
            showToast("Etkinlik başarıyla kaydedildi. İlerleyebilirsiniz.", "toast-success");
        }

        function showToast(msg, typeCls = '') {
            const toast = document.getElementById('toast-msg');
            const icon = toast.querySelector('svg');
            document.getElementById('toast-text').innerText = msg;
            toast.className = ''; toast.classList.add('show');
            
            if(typeCls === 'toast-error') {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>';
                toast.style.backgroundColor = 'var(--error-red)';
            } else {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />';
                toast.style.backgroundColor = 'var(--success-green)';
            }
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        function setVar(n, v) { 
            try { 
                parent.GetPlayer().SetVar(n, v); 
                console.log(`Storyline Variable Set: ${n} = ${v}`); 
            } catch(e) { 
                console.log(`(Lokal) Storyline Variable: ${n} = ${v}`); 
            } 
        }

        function applyScale() {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        }
        
        window.addEventListener('resize', applyScale);
        window.onload = () => { applyScale(); init(); };
    </script>
</body>
</html>
