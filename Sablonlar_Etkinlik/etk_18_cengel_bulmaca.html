<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{SAYFA_BASLIGI}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            --cream-bg: #FCF9F2;
            --paper-grid: rgba(65, 82, 196, 0.05);
            
            /* Ana Tema Renkleri */
            --primary-main: #4152C4;
            --primary-dark: #2A3680;
            --primary-soft: #7E8CDE;
            --text-dark: #1E293B;
            
            --success-green: #10B981;
            --error-red: #EF4444;
            --warning-orange: #F59E0B;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0F172A; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; color: var(--text-dark);
            user-select: none; -webkit-user-select: none;
        }
        * { scrollbar-width: thin; scrollbar-color: var(--primary-soft) transparent; }
        *::-webkit-scrollbar { width: 4px; }
        *::-webkit-scrollbar-track { background: transparent; }
        *::-webkit-scrollbar-thumb { background-color: var(--primary-soft); border-radius: 10px; }
        
        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--cream-bg); 
            background-image: linear-gradient(var(--paper-grid) 1px, transparent 1px), linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px);
            background-size: 25px 25px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-top: 6px solid var(--primary-main);
        }
        
        /* --- HEADER --- */
        .header {
            padding: 15px 30px 0 30px; height: 85px;
            display: flex; justify-content: space-between; align-items: flex-start;
            flex-shrink: 0; z-index: 10;
        }
        .instruction-container { flex: 1; padding: 0; }
        .instruction-text { font-size: 16px; line-height: 1.4; font-weight: 900; color: var(--primary-dark); text-align: left; text-transform: uppercase; letter-spacing: 0.5px;}
        .sub-instruction { font-size: 13px; font-weight: 600; color: #64748b; margin-top: 4px; }
        .logo-right-container { width: 80px; height: 80px; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; margin-left: 20px; margin-top: -10px; }
        
        .content-wrapper {
            display: flex; flex: 1; padding: 5px 30px 20px 30px; gap: 20px; height: calc(540px - 85px); min-height: 0;
        }
        
        /* --- SOL PANEL: İPUÇLARI LİSTESİ --- */
        .left-panel { width: 360px !important; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; min-height: 0; }
        
        .clues-container {
            flex: 1; overflow-y: auto; background: rgba(255,255,255,0.85);
            border: 1px solid rgba(0,0,0,0.06); border-radius: 12px; padding: 12px;
            display: flex; flex-direction: column; gap: 6px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.02); min-height: 0;
        }
        .clue-group-title { font-size: 11px; font-weight: 900; color: var(--primary-main); text-transform: uppercase; margin-top: 2px; margin-bottom: 2px; border-bottom: 2px solid #e2e8f0; padding-bottom: 2px; letter-spacing: 1px;}
        
        .clue-item {
            font-size: 10.5px; font-weight: 700; color: #475569; line-height: 1.35;
            padding: 7px 10px; border-radius: 8px; cursor: pointer; transition: all 0.2s;
            border: 1.5px solid transparent; background: white;
            display: flex; gap: 8px; align-items: start; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .clue-item:hover { background: #f8fafc; border-color: #cbd5e1; }
        .clue-item.active { background: #eff6ff; border-color: var(--primary-soft); color: var(--primary-dark); box-shadow: 0 3px 12px rgba(65, 82, 196, 0.15); transform: translateX(4px); }
        .clue-item.solved { opacity: 0.5; background: #f1f5f9; text-decoration: line-through; border-color: transparent;}
        
        .clue-num-badge {
            background: var(--primary-main); color: white; width: 18px; height: 18px;
            border-radius: 4px; display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 900; flex-shrink: 0; margin-top: 1px;
        }
        .clue-item.active .clue-num-badge { background: var(--primary-dark); }
        
        /* KONTROL BUTONU ALANI */
        .control-area {
            background: white; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); flex-shrink: 0; height: 65px;
        }
        .btn-check {
            width: 100%; height: 100%; background: var(--primary-main); color: white;
            font-size: 14px; font-weight: 800; border-radius: 8px; transition: 0.2s;
            cursor: pointer; text-align: center; border: none; letter-spacing: 1px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-check:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(42, 54, 128, 0.3);}
        .btn-check:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none;}
        .btn-check.completed { background: var(--success-green) !important; color: white !important; pointer-events: none;}
        .btn-check.timer-active { background: var(--warning-orange) !important; pointer-events: none;}
        
        /* --- SAĞ PANEL: ÇENGEL BULMACA IZGARASI --- */
        .right-panel { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            position: relative; overflow: hidden; background: rgba(255,255,255,0.4); 
            border-radius: 16px; border: 2px dashed #cbd5e1; padding: 15px; min-width: 0; min-height: 0;
        }
        
        /* Artık %100 değil, JS'in vereceği tam pixel değerlerini dinleyecek */
        #cw-grid { 
            display: grid; gap: 1px; background-color: transparent; border: none; 
            justify-content: center; align-content: center;
        }
        
        .cw-cell-wrapper {
            position: relative; background: white;
            display: flex; align-items: center; justify-content: center;
            border: 1.5px solid #94a3b8;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.06);
            border-radius: 4px; overflow: hidden;
            width: 100%; height: 100%; /* JS'ten gelen pixel boyutunu doldur */
        }
        
        .cw-input {
            width: 100%; height: 100%; border: none; outline: none; background: transparent;
            text-align: center; font-weight: 900; color: var(--primary-dark);
            text-transform: uppercase; cursor: text; caret-color: var(--primary-main);
            padding: 0; margin: 0; min-width: 0; min-height: 0;
        }
        .cw-input:focus { background: #fffbeb; }
        
        .cw-cell-wrapper.active-path { background: #eff6ff; border-color: var(--primary-main);}
        .cw-cell-wrapper.active-path .cw-input { background: transparent; }
        
        .cw-input.error { color: var(--error-red); background: #fef2f2; }
        .cw-input.correct { color: var(--success-green); font-weight: 900; }
        .cw-cell-wrapper.solved-auto { background: #d1fae5; border-color: #10b981; transition: background 0.5s; }
        .cw-cell-wrapper.solved-auto .cw-input { color: #065f46; font-weight: 900; pointer-events: none;}
        .cw-empty { background: transparent; border: none; box-shadow: none; pointer-events: none;}
        
        .cw-num { position: absolute; top: 1px; left: 2px; font-size: 8px; color: #334155; font-weight: 800; line-height: 1; pointer-events: none; z-index: 5;}
        
        /* Toast & Modal */
        #toast-msg {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px);
            background-color: var(--primary-dark); color: white; font-weight: 700; font-size: 13px;
            padding: 12px 24px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000; text-align: center; letter-spacing: 0.5px;
        }
        #toast-msg.show { transform: translateX(-50%) translateY(0); }
        .toast-error { background-color: var(--error-red) !important; }
        .toast-warning { background-color: var(--warning-orange) !important; color: #fff !important; }
        .toast-success { background-color: var(--success-green) !important; }
        
        #success-modal {
            position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px);
            z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        #success-modal.show { display: flex; }
    </style>
</head>
<body>
    <audio id="audio1" src="{{SES_DOSYASI_URL}}" preload="auto"></audio>
    <div id="scale-container">
        
        <div id="toast-msg">
            <span id="toast-text"></span>
        </div>
        
        <!-- Başarı Modalı -->
        <div id="success-modal">
            <div class="bg-white p-8 rounded-3xl shadow-2xl flex flex-col items-center max-w-sm text-center mx-auto mt-10 transform transition-all duration-500 scale-95" id="modal-content">
                <div class="w-24 h-24 bg-gradient-to-tr from-emerald-400 to-emerald-600 rounded-full flex items-center justify-center shadow-lg shadow-emerald-500/50 mb-6">
                    <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
                <h2 class="text-2xl font-black text-slate-800 mb-2">HARİKA!</h2>
                <p class="text-sm font-semibold text-slate-500 mb-6">{{BASARI_GERI_BILDIRIM_METNI}}</p>
                <button onclick="closeModal()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold hover:bg-slate-700 transition shadow-md">Devam Et</button>
            </div>
        </div>

        <header class="header">
            <div class="instruction-container">
                <div class="instruction-text">{{ANA_BASLIK}}</div>
                <div class="sub-instruction">{{ALT_YONERGE_METNI_ORN_Ipuclarini_okuyup_bulmacayi_cozunuz}}</div>
            </div>
            <div class="logo-right-container">
                <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none';">
            </div>
        </header>

        <main class="content-wrapper">
            
            <!-- SOL PANEL: İPUÇLARI -->
            <div class="left-panel">
                <div class="clues-container" id="clues-list">
                    
                    <div class="clue-group-title">Yatay İpuçları</div>
                    <div id="clues-horizontal">
                        <!-- JS ile otomatik oluşturulacak -->
                    </div>
                    
                    <div class="clue-group-title mt-2">Düşey İpuçları</div>
                    <div id="clues-vertical">
                        <!-- JS ile otomatik oluşturulacak -->
                    </div>

                </div>
                
                <div class="control-area">
                    <button id="btn-check" onclick="checkAnswers()" class="btn-check">
                        KONTROL ET
                    </button>
                </div>
            </div>
            
            <!-- SAĞ PANEL: ÇENGEL BULMACA IZGARASI -->
            <div class="right-panel" id="grid-wrapper">
                <!-- Izgara buraya JS ile pixel pixel tam sığacak şekilde çizilecek -->
                <div id="cw-grid"></div>
            </div>
            
        </main>
    </div>

    <!-- JS MANTIĞI VE DİNAMİK YAPILANDIRMA -->
    <script>
        // =========================================================================
        // DİNAMİK BULMACA AYARLARI (GELİŞTİRİCİ DÜZENLEME ALANI)
        // dir: 'H' (Yatay), 'V' (Düşey) | r: Satır (0'dan başlar) | c: Sütun (0'dan başlar)
        // =========================================================================
        const BULMACA_AYARLARI = [
            { id: 'w1', dir: 'H', r: 6, c: 7, word: 'YALITKAN', num: 1, clue: 'Tava sapında kullanılan ve eli ısıdan koruyan özellik.' },
            { id: 'w3', dir: 'H', r: 3, c: 16, word: 'YALITIM', num: 3, clue: 'Kışın evi ısıtırken ısının dışarı kaçmaması için alınan önlem.' },
            { id: 'w5', dir: 'H', r: 8, c: 5, word: 'İLETKEN', num: 5, clue: 'Tencere tabanında yemeği çabuk pişiren özellik.' },
            { id: 'w7', dir: 'H', r: 5, c: 0, word: 'KATRAN', num: 7, clue: 'Çatı yalıtımında kullanılan siyah malzeme.' },
            { id: 'w9', dir: 'H', r: 4, c: 12, word: 'CAMYÜNÜ', num: 9, clue: 'Bina duvarlarına uygulanan sarımsı yalıtım malzemesi.' },
            
            { id: 'w2', dir: 'V', r: 1, c: 14, word: 'ALÜMİNYUM', num: 2, clue: 'Isıyı çok hızlı ileten bir metal türü.' },
            { id: 'w4', dir: 'V', r: 3, c: 5, word: 'TANECİK', num: 4, clue: 'Madde ısı aldığında hareketleri artan yapı.' },
            { id: 'w6', dir: 'V', r: 4, c: 8, word: 'PLASTİK', num: 6, clue: 'Çaydanlık sapının yapılma nedeni (yavaş ısı iletimi).' },
            { id: 'w8', dir: 'V', r: 0, c: 16, word: 'TAŞYÜNÜ', num: 8, clue: 'Cam yününe alternatif yanmaz yalıtım.' },
            { id: 'w10', dir: 'V', r: 4, c: 1, word: 'VAKUM', num: 10, clue: 'Termos duvarlarındaki ısıyı kesen havasız boşluk.' }
        ];
        
        // Matrisi ekrana kusursuz oturtabilmek için sınırları belirtmeliyiz:
        const ROWS = 11;
        const COLS = 23;
        // =========================================================================

        let audioCtx = null;
        function getAudioContext() { 
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            return audioCtx; 
        }
        
        function playSfx(type) {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type==='correct') { osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); }
                else if(type==='incorrect') { osc.type='sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.linearRampToValueAtTime(150, ctx.currentTime+0.3); }
                else if(type==='click') { osc.type='triangle'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime+0.1); }
                gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }

        let gridMap = Array(ROWS).fill().map(() => Array(COLS).fill(null));
        let activeWordId = null;
        let attempts = 0;
        let done = false;

        function init() {
            renderClues();
            buildGrid();
            
            const audio = document.getElementById('audio1');
            if(audio) audio.play().catch(()=>{});
        }
        
        function renderClues() {
            const hContainer = document.getElementById('clues-horizontal');
            const vContainer = document.getElementById('clues-vertical');
            
            BULMACA_AYARLARI.forEach(w => {
                const clueHtml = `
                    <div id="clue-${w.id}" class="clue-item" onclick="selectWord('${w.id}')">
                        <div class="clue-num-badge">${w.num}</div> ${w.clue}
                    </div>
                `;
                if(w.dir === 'H') hContainer.innerHTML += clueHtml;
                else vContainer.innerHTML += clueHtml;
            });
        }

        function buildGrid() {
            // Matrisi kelimelerle doldur
            BULMACA_AYARLARI.forEach(w => {
                for (let i = 0; i < w.word.length; i++) {
                    let r = w.dir === 'H' ? w.r : w.r + i;
                    let c = w.dir === 'H' ? w.c + i : w.c;
                    if (!gridMap[r][c]) {
                        gridMap[r][c] = { char: w.word[i], ids: [], num: null };
                    }
                    gridMap[r][c].ids.push(w.id);
                    if (i === 0) gridMap[r][c].num = w.num;
                }
            });
            
            const gridContainer = document.getElementById('cw-grid');
            
            // --- CSS GRID ÇÖKMESİNİ ENGELLEYEN KESİN BOYUT HESAPLAMASI ---
            const wrapper = document.getElementById('grid-wrapper');
            const wrapW = wrapper.clientWidth || 450; // Fallback genişlik
            const wrapH = wrapper.clientHeight || 400; // Fallback yükseklik
            
            // Panelin padding (30px) ve grid boşluklarını (gap: 1px) hesaptan düşüyoruz
            const availW = wrapW - 30 - (COLS * 1);
            const availH = wrapH - 30 - (ROWS * 1);
            
            // Bulmacanın ekrana tam ve kare sığması için tek bir 'cellSize' buluyoruz
            let cellSize = Math.floor(Math.min(availW / COLS, availH / ROWS));
            
            // Boyutun çok küçük veya aşırı büyük olmasını engelle (Zırh)
            if (cellSize < 16) cellSize = 16; 
            if (cellSize > 40) cellSize = 40; 
            
            gridContainer.style.gridTemplateColumns = `repeat(${COLS}, ${cellSize}px)`;
            gridContainer.style.gridTemplateRows = `repeat(${ROWS}, ${cellSize}px)`;
            
            // -------------------------------------------------------------

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cellData = gridMap[r][c];
                    const cellDiv = document.createElement('div');
                    
                    if (cellData) {
                        cellDiv.className = `cw-cell-wrapper ${cellData.ids.map(id => `cell-${id}`).join(' ')}`;
                        
                        if (cellData.num) {
                            const numSpan = document.createElement('span');
                            numSpan.className = 'cw-num';
                            numSpan.innerText = cellData.num;
                            cellDiv.appendChild(numSpan);
                        }
                        
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.maxLength = 1;
                        input.className = 'cw-input';
                        input.dataset.r = r;
                        input.dataset.c = c;
                        
                        // Kutular büyüyüp küçüldüğünde font boyutu da ona göre esnesin
                        input.style.fontSize = `${Math.max(10, cellSize * 0.55)}px`;
                        
                        input.addEventListener('focus', () => handleFocus(r, c, cellData.ids));
                        input.addEventListener('input', (e) => handleInput(e, r, c));
                        input.addEventListener('keydown', (e) => handleKeyDown(e, r, c));
                        cellDiv.appendChild(input);
                    } else {
                        cellDiv.className = 'cw-empty';
                    }
                    gridContainer.appendChild(cellDiv);
                }
            }
        }

        function normalizeTR(str) {
            return str.replace(/\s+/g, '').replace(/i/g, 'İ').replace(/ı/g, 'I')
                      .replace(/ğ/g, 'Ğ').replace(/ü/g, 'Ü').replace(/ş/g, 'Ş')
                      .replace(/ö/g, 'Ö').replace(/ç/g, 'Ç').toUpperCase();
        }

        function handleFocus(r, c, ids) {
            if(done) return;
            if (!activeWordId || !ids.includes(activeWordId)) {
                selectWord(ids[0], false); 
            }
        }

        function handleInput(e, r, c) {
            if(done) return;
            const input = e.target;
            let val = normalizeTR(input.value);
            input.value = val;
            input.classList.remove('error'); 
            
            if (val && activeWordId) {
                const w = BULMACA_AYARLARI.find(x => x.id === activeWordId);
                const nextR = w.dir === 'H' ? r : r + 1;
                const nextC = w.dir === 'H' ? c + 1 : c;
                
                const nextInput = document.querySelector(`input[data-r="${nextR}"][data-c="${nextC}"]`);
                if(nextInput) {
                    nextInput.focus();
                    nextInput.select();
                }
            }
        }

        function handleKeyDown(e, r, c) {
            if(done) return;
            if (e.key === 'Backspace' && !e.target.value && activeWordId) {
                const w = BULMACA_AYARLARI.find(x => x.id === activeWordId);
                const prevR = w.dir === 'H' ? r : r - 1;
                const prevC = w.dir === 'H' ? c - 1 : c;
                
                const prevInput = document.querySelector(`input[data-r="${prevR}"][data-c="${prevC}"]`);
                if(prevInput) {
                    prevInput.focus();
                    prevInput.value = ''; 
                }
            }
        }

        function selectWord(id, focusFirst = true) {
            if(done) return;
            activeWordId = id;
            
            document.querySelectorAll('.clue-item').forEach(el => el.classList.remove('active'));
            const clueEl = document.getElementById(`clue-${id}`);
            if(clueEl) {
                clueEl.classList.add('active');
                clueEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            
            document.querySelectorAll('.cw-cell-wrapper').forEach(el => el.classList.remove('active-path'));
            document.querySelectorAll(`.cell-${id}`).forEach(el => el.classList.add('active-path'));
            
            if (focusFirst) {
                const w = BULMACA_AYARLARI.find(x => x.id === id);
                const firstInput = document.querySelector(`input[data-r="${w.r}"][data-c="${w.c}"]`);
                if (firstInput) {
                    firstInput.focus();
                    firstInput.select();
                }
            }
        }

        function checkAnswers() {
            if (done) return;
            
            let allCorrect = true;
            let emptyCount = 0;
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (gridMap[r][c]) {
                        const input = document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
                        const userVal = normalizeTR(input.value);
                        const correctVal = gridMap[r][c].char;
                        input.classList.remove('error', 'correct');
                        
                        if(userVal === '') emptyCount++;
                        
                        if (userVal !== correctVal) {
                            allCorrect = false;
                            if (userVal !== '') {
                                input.classList.add('error');
                            }
                        } else {
                            input.classList.add('correct');
                        }
                    }
                }
            }
            
            if(emptyCount > 0 && attempts === 0 && !allCorrect) {
                showToast("Lütfen tüm kutuları doldurunuz.", "toast-warning");
                playSfx('click');
                return;
            }
            
            if (allCorrect) {
                done = true;
                playSfx('correct');
                lockGrid();
                
                const btn = document.getElementById('btn-check');
                btn.innerText = "TAMAMLANDI ✓";
                btn.classList.add('completed');
                
                document.getElementById('success-modal').classList.add('show');
                document.getElementById('modal-content').classList.remove('scale-95', 'opacity-0');
                showToast("Tebrikler! Bulmacayı kusursuz tamamladınız.", "toast-success");
                
                setVar('{{STORYLINE_VAR_TAMAMLANDI}}', true);
            } else {
                attempts++;
                playSfx('incorrect');
                
                if (attempts === 1) {
                    showToast("Hatalı veya eksik harfler var. Lütfen kırmızı harfleri düzeltiniz.", "toast-warning");
                } else {
                    done = true;
                    showToast("Hakkınız bitti. Cevaplar otomatik yerleşiyor...", "toast-error");
                    autoSolve();
                }
            }
        }

        function lockGrid() {
            document.querySelectorAll('.cw-input').forEach(inp => {
                inp.disabled = true;
                inp.style.pointerEvents = 'none';
            });
            document.querySelectorAll('.cw-cell-wrapper').forEach(w => w.classList.remove('active-path'));
            document.querySelectorAll('.clue-item').forEach(c => c.classList.remove('active'));
        }

        function autoSolve() {
            lockGrid();
            let delay = 0;
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (gridMap[r][c]) {
                        setTimeout(() => {
                            const input = document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
                            const wrapper = input.parentElement;
                            input.value = gridMap[r][c].char;
                            input.classList.remove('error', 'correct');
                            wrapper.classList.add('solved-auto');
                        }, delay);
                        delay += 30; 
                    }
                }
            }
            
            setTimeout(() => {
                const btn = document.getElementById('btn-check');
                btn.classList.add('timer-active');
                
                let countdown = 10;
                btn.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
                
                const interval = setInterval(() => {
                    countdown--;
                    btn.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
                    
                    if(countdown <= 0) {
                        clearInterval(interval);
                        btn.classList.remove('timer-active');
                        btn.classList.add('completed');
                        btn.innerText = "TAMAMLANDI ✓";
                        
                        showToast("İnceleme süresi doldu. İlerleyebilirsiniz.", "toast-success");
                        setVar('{{STORYLINE_VAR_INCELEME_BITTI}}', true);
                    }
                }, 1000);
            }, delay + 500);
        }

        function closeModal() {
            document.getElementById('success-modal').classList.remove('show');
        }

        function showToast(txt, typeCls = '') {
            const toast = document.getElementById('toast-msg');
            const txtEl = document.getElementById('toast-text');
            
            toast.className = '';
            toast.classList.add('show');
            if (typeCls) toast.classList.add(typeCls);
            if (txt) txtEl.innerText = txt;
            
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        function setVar(n, v) { 
            try { parent.GetPlayer().SetVar(n, v); console.log(`Storyline Variable: ${n} = ${v}`); } 
            catch(e) { console.log(`(Lokal) ${n} = ${v}`); } 
        }

        function applyScale() {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        }
        
        window.addEventListener('resize', applyScale);
        window.onload = () => { applyScale(); init(); };
    </script>
</body>
</html>
