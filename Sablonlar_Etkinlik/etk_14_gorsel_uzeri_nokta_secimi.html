<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{SAYFA_BASLIGI}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            --bg-cream: #FCF9F2;
            --grid-line: rgba(185, 28, 28, 0.08);
            
            --primary-red: #B91C1C; 
            --light-red: #FEF2F2;
            --text-dark: #1E293B;
            --success-green: #10B981;
            --error-red: #EF4444;
            --warning-orange: #F59E0B;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0F172A; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; 
            color: var(--text-dark);
            user-select: none; -webkit-user-select: none;
        }
        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        *::-webkit-scrollbar { display: none !important; }
        
        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--bg-cream); 
            background-image: 
                linear-gradient(var(--grid-line) 1.5px, transparent 1.5px), 
                linear-gradient(90deg, var(--grid-line) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-top: 6px solid var(--primary-red);
        }
        
        /* --- HEADER --- */
        .header {
            padding: 15px 40px 0 40px; height: 85px;
            display: flex; justify-content: space-between; align-items: start;
            flex-shrink: 0; z-index: 10;
        }
        .instruction-group {
            display: flex; align-items: center; gap: 15px; flex: 1;
            background: white; border-radius: 12px; padding: 10px 20px 10px 15px;
            border-left: 5px solid var(--primary-red);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            margin-top: 5px;
        }
        .instruction-text {
            font-size: 15px; line-height: 1.4; font-weight: 800; color: var(--text-dark); cursor: pointer; transition: color 0.2s;
        }
        .instruction-text:hover { color: var(--primary-red); }
        .logo-right-container {
            width: 80px; height: 80px; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; margin-left: 20px; margin-top: -5px;
        }
        .narrator-speaker {
            width: 36px; height: 36px; background: var(--primary-red); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(185, 28, 28, 0.4); cursor: pointer;
        }
        @keyframes pulsePlay {
            0% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(185, 28, 28, 0); }
            100% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0); }
        }
        
        .content-wrapper {
            display: flex; flex-direction: column; flex: 1; padding: 15px 40px 20px 40px; height: calc(540px - 85px);
            z-index: 10; position: relative; gap: 15px;
        }
        
        /* --- ORTA ALAN: SVG KARELİ/GÖRSEL ZEMİN --- */
        .svg-board {
            flex: 1; background-color: white; border: 2.5px solid #cbd5e1; border-radius: 16px;
            position: relative; overflow: hidden;
            background-image: 
                linear-gradient(#e2e8f0 1px, transparent 1px), 
                linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 25px 25px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.02);
            display: flex; justify-content: center; align-items: center;
        }
        .svg-board svg {
            width: 100%; height: 100%; max-height: 100%; object-fit: contain;
        }
        
        /* İnteraktif Nokta Stilleri */
        .point-group {
            cursor: pointer;
        }
        .point-hitbox {
            fill: transparent;
        }
        .point-dot {
            fill: #1E293B;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-box: fill-box; transform-origin: center;
        }
        .point-ring {
            fill: transparent;
            stroke: transparent;
            stroke-width: 3px;
            transition: all 0.2s;
        }
        .point-label {
            font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 18px; fill: #1E293B;
            pointer-events: none; user-select: none; transition: all 0.2s;
        }
        
        .point-group:hover .point-ring { stroke: #cbd5e1; }
        
        /* Seçili Durum */
        .point-group.selected .point-dot { fill: var(--primary-red); transform: scale(1.5); }
        .point-group.selected .point-ring { stroke: var(--primary-red); }
        .point-group.selected .point-label { fill: var(--primary-red); }
        
        /* Animasyon Durumları */
        .point-group.is-correct .point-dot { fill: var(--success-green); transform: scale(1.5); }
        .point-group.is-correct .point-ring { stroke: var(--success-green); }
        .point-group.is-correct .point-label { fill: var(--success-green); }
        
        .point-group.is-incorrect { animation: shake 0.4s ease-in-out; }
        .point-group.is-incorrect .point-dot { fill: var(--error-red); transform: scale(1.5); }
        .point-group.is-incorrect .point-ring { stroke: var(--error-red); }
        .point-group.is-incorrect .point-label { fill: var(--error-red); }
        
        .point-group.disabled { pointer-events: none; }
        
        /* Alt Panel (Geri Bildirim ve Buton) */
        .bottom-panel {
            display: flex; justify-content: space-between; align-items: center; height: 50px; flex-shrink: 0;
        }
        .feedback-msg {
            font-size: 13px; font-weight: 800; padding: 12px 20px; border-radius: 10px;
            display: none; line-height: 1.4; flex: 1; margin-right: 20px; text-align: center;
        }
        .fb-success { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #10b981; }
        .fb-error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #ef4444; }
        
        .btn-action {
            background: var(--primary-red); color: white; min-width: 250px; height: 50px;
            font-size: 15px; font-weight: 900; border-radius: 12px;
            box-shadow: 0 6px 15px rgba(185, 28, 28, 0.3); border: none;
            cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
            padding: 0 25px; margin-left: auto;
        }
        
        .btn-action:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(185, 28, 28, 0.4); }
        .btn-action.completed { background: var(--success-green); pointer-events: none; transform: none; box-shadow: none;}
        .btn-action.timer-active { background: var(--warning-orange); pointer-events: none; transform: none; box-shadow: none;}
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        
        /* Toast Bildirimi */
        #toast-msg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background-color: var(--primary-dark); color: white; font-weight: 800; font-size: 14px;
            padding: 12px 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000;
        }
        #toast-msg.show { transform: translateX(-50%) translateY(0); }
        .toast-success { background-color: var(--success-green) !important; color: white !important;}
        .toast-warning { background-color: var(--warning-orange) !important; color: white !important;}
        .toast-error { background-color: var(--error-red) !important; color: white !important;}
    </style>
</head>
<body>
    <div id="scale-container">
        
        <audio id="audio1" src="{{SES_DOSYASI_URL}}" preload="auto"></audio>
        
        <div id="toast-msg">
            <svg id="toast-icon" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="toast-text"></span>
        </div>

        <header class="header">
            <div class="instruction-group">
                <div id="speaker" class="narrator-speaker" onclick="playAudio()">
                    <svg class="w-5 h-5 pl-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.546-2.07-2.584-1.23L6.15 6.75H3A1.5 1.5 0 001.5 8.25v7.5A1.5 1.5 0 003 17.25h3.15l4.766 3.92c1.038.84 2.584.106 2.584-1.23V4.06z"/></svg>
                </div>
                <div class="instruction-text" onclick="playAudio()">
                    {{ANA_YONERGE_METNI_ORN_Cemberlerin_merkezini_seciniz}}
                </div>
            </div>
            <div class="logo-right-container">
                <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none';">
            </div>
        </header>

        <main class="content-wrapper">
            
            <!-- ORTA ALAN: SVG KARELİ/GÖRSEL ZEMİN -->
            <div class="svg-board">
                <!-- SVG boyutları (viewBox) kullanılacak grafiğe göre değiştirilebilir -->
                <svg width="100%" height="100%" viewBox="0 0 900 350" xmlns="http://www.w3.org/2000/svg">
                    
                    <!-- SVG GÖRSELLERİ VEYA ARKA PLAN ÇİZİMLERİ (Örnek Geometri Çizimi Eklenmiştir) -->
                    <circle cx="350" cy="175" r="80" fill="none" stroke="#1E293B" stroke-width="3"/>
                    <circle cx="550" cy="175" r="80" fill="none" stroke="#1E293B" stroke-width="3"/>
                    <line x1="150" y1="175" x2="750" y2="175" stroke="#1E293B" stroke-width="3"/>
                    
                    <!-- İNTERAKTİF NOKTALAR (Orijinal {{}} Etiketleri Çıkarılıp Sabit Rakamlar Konuldu) -->
                    <!-- DİKKAT: Doğru cevap olmasını istediğiniz noktalara data-ans="true" yazınız. -->
                    
                    <!-- Nokta A (Yanlış) -->
                    <g class="point-group" id="pt-1" data-ans="false" onclick="togglePt('1')">
                        <circle cx="270" cy="175" r="24" class="point-hitbox" />
                        <circle cx="270" cy="175" r="14" class="point-ring" />
                        <circle cx="270" cy="175" r="6" class="point-dot" />
                        <text x="262" y="215" class="point-label">A</text>
                    </g>
                    
                    <!-- Nokta B (Doğru - Sol Çember Merkezi) -->
                    <g class="point-group" id="pt-2" data-ans="true" onclick="togglePt('2')">
                        <circle cx="350" cy="175" r="24" class="point-hitbox" />
                        <circle cx="350" cy="175" r="14" class="point-ring" />
                        <circle cx="350" cy="175" r="6" class="point-dot" />
                        <text x="342" y="215" class="point-label">B</text>
                    </g>
                    
                    <!-- Nokta C (Yanlış - Kesişim Noktası) -->
                    <g class="point-group" id="pt-3" data-ans="false" onclick="togglePt('3')">
                        <circle cx="450" cy="175" r="24" class="point-hitbox" />
                        <circle cx="450" cy="175" r="14" class="point-ring" />
                        <circle cx="450" cy="175" r="6" class="point-dot" />
                        <text x="442" y="215" class="point-label">C</text>
                    </g>
                    
                    <!-- Nokta D (Doğru - Sağ Çember Merkezi) -->
                    <g class="point-group" id="pt-4" data-ans="true" onclick="togglePt('4')">
                        <circle cx="550" cy="175" r="24" class="point-hitbox" />
                        <circle cx="550" cy="175" r="14" class="point-ring" />
                        <circle cx="550" cy="175" r="6" class="point-dot" />
                        <text x="542" y="215" class="point-label">D</text>
                    </g>

                    <!-- Nokta E (Yanlış) -->
                    <g class="point-group" id="pt-5" data-ans="false" onclick="togglePt('5')">
                        <circle cx="630" cy="175" r="24" class="point-hitbox" />
                        <circle cx="630" cy="175" r="14" class="point-ring" />
                        <circle cx="630" cy="175" r="6" class="point-dot" />
                        <text x="622" y="215" class="point-label">E</text>
                    </g>

                </svg>
            </div>
            
            <!-- ALT PANEL: Geri Bildirim ve Buton -->
            <div class="bottom-panel">
                <div id="q-fb" class="feedback-msg"></div>
                <button id="btn-check" class="btn-action" onclick="checkAnswers()">KONTROL ET</button>
            </div>
            
        </main>
    </div>
    
    <script>
        let audioCtx = null;
        let isAudioPlaying = false;
        let isCompleted = false;
        let attempts = 0;
        
        function getAudioContext() { 
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            return audioCtx; 
        }
        
        function playSfx(type) {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type==='click') { osc.type='triangle'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime+0.1); }
                else if(type==='success') { osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); }
                else if(type==='error') { osc.type='sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.linearRampToValueAtTime(150, ctx.currentTime+0.3); }
                gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }

        function forceAutoplay() {
            if (isAudioPlaying) return; 
            const audio = document.getElementById('audio1');
            const speaker = document.getElementById('main-speaker');
            
            if (audio) {
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                        window.removeEventListener('click', forceAutoplay);
                        window.removeEventListener('touchstart', forceAutoplay);
                    }).catch(error => {
                        if(speaker) speaker.style.animation = 'none';
                    });
                }
            }
        }
        
        function init() {
            const s = document.getElementById('audio1');
            if(s) {
                s.addEventListener('ended', () => {
                    const speaker = document.getElementById('main-speaker');
                    if(speaker) speaker.style.animation = 'none'; 
                    isAudioPlaying = false; 
                });
            }
            forceAutoplay();
            window.addEventListener('click', forceAutoplay);
            window.addEventListener('touchstart', forceAutoplay);
        }

        function playAudio() {
            const audio = document.getElementById('audio1');
            const speaker = document.getElementById('main-speaker');
            if(audio) {
                audio.pause(); audio.currentTime = 0; 
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                    }).catch(e => console.log(e));
                }
            }
        }

        function togglePt(id) {
            if(isCompleted) return;
            getAudioContext();
            playSfx('click');
            
            const pt = document.getElementById(`pt-${id}`);
            pt.classList.toggle('selected');
            document.getElementById('q-fb').style.display = 'none';
        }

        function checkAnswers() {
            if(isCompleted) return;
            
            const points = document.querySelectorAll('.point-group');
            const selectedPoints = document.querySelectorAll('.point-group.selected');
            
            if(selectedPoints.length === 0) {
                showToast("Lütfen en az bir noktayı işaretleyiniz.", "toast-warning");
                return;
            }
            
            let allCorrect = true;
            let wrongSelected = [];
            
            points.forEach(pt => {
                const isSelected = pt.classList.contains('selected');
                const isAns = pt.getAttribute('data-ans').toLowerCase().trim() === 'true';
                
                if ((isAns && !isSelected) || (!isAns && isSelected)) {
                    allCorrect = false;
                    if(isSelected) wrongSelected.push(pt);
                }
            });

            const fbBox = document.getElementById('q-fb');
            const btnCheck = document.getElementById('btn-check');
            fbBox.className = "feedback-msg"; 
            
            if(allCorrect) {
                // TAM BAŞARI
                isCompleted = true;
                playSfx('success');
                
                points.forEach(pt => pt.classList.add('disabled'));
                selectedPoints.forEach(pt => {
                    pt.classList.remove('selected');
                    pt.classList.add('is-correct');
                });
                
                fbBox.innerHTML = `TEBRİKLER! <br><span style="font-weight:600; font-size:11.5px; display:block; margin-top:2px;">{{BASARI_GERI_BILDIRIM_METNI}}</span>`;
                fbBox.classList.add('fb-success');
                
                btnCheck.innerText = "TAMAMLANDI ✓";
                btnCheck.classList.add('completed');
                
                showToast("Etkinlik başarıyla tamamlandı. İlerleyebilirsiniz.", "toast-success");
                setVar('{{STORYLINE_VAR_TAMAMLANDI}}', true); 
                
            } else {
                // HATA DURUMU
                attempts++;
                playSfx('error');
                
                if(attempts === 1) {
                    fbBox.innerHTML = `{{HATA_GERI_BILDIRIM_METNI}}`;
                    fbBox.classList.add('fb-error');
                    
                    wrongSelected.forEach(pt => {
                        pt.classList.add('is-incorrect');
                        setTimeout(() => { pt.classList.remove('is-incorrect', 'selected'); }, 1200);
                    });
                    
                    setTimeout(() => { fbBox.style.display = 'none'; }, 4000);
                } else {
                    // OTOMATİK ÇÖZÜM
                    isCompleted = true;
                    
                    fbBox.innerHTML = `Hakkınız bitti. Doğru cevaplar işaretleniyor...`;
                    fbBox.classList.add('fb-error');
                    
                    points.forEach(pt => {
                        pt.classList.remove('selected', 'is-incorrect');
                        pt.classList.add('disabled');
                    });
                    
                    let delayCount = 1;
                    points.forEach((pt) => {
                        if(pt.getAttribute('data-ans').toLowerCase().trim() === 'true') {
                            setTimeout(() => {
                                pt.classList.remove('disabled');
                                pt.classList.add('is-correct');
                                playSfx('click');
                            }, delayCount * 600);
                            delayCount++;
                        }
                    });
                    
                    setTimeout(() => {
                        fbBox.style.display = 'none';
                        triggerTimerAutoSolve('{{STORYLINE_VAR_INCELEME_BITTI}}'); 
                    }, (delayCount * 600) + 500);
                }
            }
        }

        function triggerTimerAutoSolve(variableToSet) {
            const btnCheck = document.getElementById('btn-check');
            btnCheck.classList.add('timer-active'); 
            
            let countdown = 10;
            btnCheck.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
            
            const interval = setInterval(() => {
                countdown--;
                btnCheck.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
                
                if(countdown <= 0) {
                    clearInterval(interval);
                    btnCheck.innerText = "TAMAMLANDI ✓";
                    btnCheck.classList.remove('timer-active');
                    btnCheck.classList.add('completed');
                    
                    showToast("İnceleme tamamlandı, ilerleyebilirsiniz.", "toast-success");
                    setVar(variableToSet, true); 
                }
            }, 1000);
        }

        function showToast(msg, typeCls = '') {
            const toast = document.getElementById('toast-msg');
            const icon = toast.querySelector('svg');
            document.getElementById('toast-text').innerText = msg;
            toast.className = ''; toast.classList.add('show');
            
            if(typeCls === 'toast-error') {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>';
                icon.classList.remove('text-emerald-400', 'text-amber-400'); icon.classList.add('text-white');
                toast.style.backgroundColor = 'var(--error-red)';
            } else if (typeCls === 'toast-warning') {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />';
                icon.classList.remove('text-emerald-400', 'text-white'); icon.classList.add('text-white');
                toast.style.backgroundColor = 'var(--warning-orange)';
            } else {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />';
                icon.classList.remove('text-red-400', 'text-amber-400', 'text-white'); icon.classList.add('text-emerald-400');
                toast.style.backgroundColor = 'var(--success-green)';
            }
            
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function setVar(n, v) { 
            try { parent.GetPlayer().SetVar(n, v); console.log(`Storyline Variable: ${n} = ${v}`); } 
            catch(e) { console.log(`(Lokal) ${n} = ${v}`); } 
        }

        function applyScale() {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        }
        
        window.addEventListener('resize', applyScale);
        window.onload = () => { applyScale(); init(); };
    </script>
</body>
</html>
