<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{SAYFA_BASLIGI}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            --cream-bg: #FCF9F2;
            --paper-grid: rgba(185, 28, 28, 0.08);
            
            --primary-main: #B91C1C;
            --primary-dark: #7F1D1D;
            --primary-soft: #FCA5A5;
            --warm-grey: #334155;
            
            --success-green: #10B981;
            --error-red: #EF4444;
            --warning-orange: #F59E0B;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #030712; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; color: var(--warm-grey);
            user-select: none; -webkit-user-select: none;
        }
        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        *::-webkit-scrollbar { display: none !important; }
        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--cream-bg); 
            background-image: linear-gradient(var(--paper-grid) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--paper-grid) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border-top: 6px solid var(--primary-main);
        }
        #scale-container::before {
            content: ''; position: absolute; top: -20%; left: -20%; width: 150%; height: 150%;
            background: radial-gradient(circle, rgba(185, 28, 28, 0.08) 0%, transparent 60%);
            z-index: 0; pointer-events: none;
        }
        .header {
            padding: 20px 40px 0 40px; height: 85px;
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; z-index: 10;
        }
        .instruction-container { flex: 1; padding: 0; display: flex; align-items: center;}
        .instruction-text { font-size: 16px; line-height: 1.4; font-weight: 800; color: var(--primary-dark); text-align: left;}
        .logo-right-container { width: 85px; height: 85px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; margin-left: 20px; }
        .content-wrapper {
            display: flex; flex: 1; padding: 0px 40px 20px 40px; gap: 30px; height: calc(540px - 85px);
            z-index: 10;
        }
        .left-panel { width: 560px !important; display: flex; flex-direction: column; gap: 12px; justify-content: center; }
        
        .match-row {
            display: flex; align-items: center; justify-content: space-between; gap: 15px;
            background: white; border: 2px solid rgba(185, 28, 28, 0.15); border-radius: 16px;
            padding: 10px 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            height: 100px; 
        }
        .match-row:nth-child(even) { background-color: #fffaf0; }
        .svg-container {
            width: 220px; height: 80px; display: flex; align-items: center; justify-content: center;
            border-right: 2px dashed #cbd5e1; padding-right: 15px;
            background-image: 
                linear-gradient(rgba(185, 28, 28, 0.06) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(185, 28, 28, 0.06) 1px, transparent 1px);
            background-size: 15px 15px;
            border-radius: 12px 0 0 12px;
            overflow: hidden;
        }
        .drop-zone {
            width: 240px; height: 46px; border: 2px dashed var(--primary-soft); background: rgba(254, 242, 242, 0.6);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; position: relative; cursor: pointer;
        }
        .drop-zone.active-hover { border-color: var(--primary-main); background: rgba(185, 28, 28, 0.1); }
        .drop-zone.has-card { border: none; background: transparent; }
        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        
        .pool-title { font-size: 14px; font-weight: 900; color: var(--primary-main); text-align: center; border-bottom: 2px solid #ddd; padding-bottom: 8px; letter-spacing: 0.5px;}
        
        .pool-container {
            background: rgba(255, 255, 255, 0.7); border: 2px dashed var(--primary-soft); border-radius: 16px;
            padding: 15px; display: flex; flex-direction: column; gap: 15px; flex: 1; align-items: center; justify-content: center;
        }
        .pool-slot { width: 100%; max-width: 240px; height: 46px; position: relative; }
        
        .draggable-card {
            position: absolute; width: 100%; height: 46px; background: white;
            border: 2px solid var(--primary-main); border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 800; cursor: grab; box-shadow: 0 4px 8px rgba(185, 28, 28, 0.15);
            z-index: 100; touch-action: none; text-align: center; padding: 0 8px;
            color: var(--primary-dark); letter-spacing: 0.5px;
        }
        
        .draggable-card.dragging { cursor: grabbing; box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 1000; transition: none; transform: scale(1.02); }
        .draggable-card.selected { border-color: var(--warning-orange); background: #fffbeb; }
        .draggable-card.correct-state { border-color: var(--success-green) !important; background: #f0fdf4 !important; color: var(--success-green) !important; box-shadow: none;}
        .draggable-card.incorrect-state { border-color: var(--error-red) !important; background: #fef2f2 !important; color: var(--error-red) !important; }
        .draggable-card.disabled { cursor: not-allowed; pointer-events: none; opacity: 0.9;}
        .control-panel { height: 60px; display: flex; flex-direction: column; justify-content: center; gap: 3px; position: relative;}
        
        .btn-action {
            background: var(--primary-main); color: white; font-size: 15px; font-weight: 900;
            padding: 12px; border-radius: 12px; transition: 0.2s; cursor: pointer; display: none; width: 100%;
            text-align: center; border: none; box-shadow: 0 4px 10px rgba(185, 28, 28, 0.2); letter-spacing: 1px;
        }
        .btn-action:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .btn-action.completed-state {
            background-color: var(--success-green) !important; color: white !important;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3) !important; cursor: default; transform: none !important;
        }
        .message-box { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 800; padding: 8px 16px; border-radius: 8px; display: none; text-align: center; white-space: nowrap; z-index: 50;}
        .msg-success { background: #d1fae5; color: #065f46; border: 1px solid #10B981;}
        .msg-error { background: #fee2e2; color: #991b1b; border: 1px solid #EF4444;}
        #toast-msg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background-color: var(--primary-dark); color: white; font-weight: 800; font-size: 14px;
            padding: 12px 24px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
        }
        #toast-msg.show { transform: translateX(-50%) translateY(0); }
        .toast-warning { background-color: var(--warning-orange) !important; color: white !important; }
    </style>
</head>
<body>
    <audio id="audio1" src="{{SES_DOSYASI}}" preload="auto"></audio>
    <div id="scale-container">
        
        <div id="toast-msg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="toast-text">Bildirim metni.</span>
        </div>
        <header class="header">
            <div class="instruction-container">
                <div class="instruction-text">{{YONERGE_METNI}}</div>
            </div>
            <div class="logo-right-container">
                <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none';">
            </div>
        </header>

        <!-- SVG Ok Ucu Tanımlamaları (İsteğe bağlı, global) -->
        <svg width="0" height="0" class="hidden">
            <defs>
                <marker id="arrow-start-black" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
                    <path d="M 7 1 L 1 4 L 7 7 Z" fill="#1e293b" />
                </marker>
                <marker id="arrow-end-black" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#1e293b" />
                </marker>
            </defs>
        </svg>

        <main class="content-wrapper">
            
            <div class="left-panel" style="width: 620px !important;">
                
                <!-- 1. Satır -->
                <div class="match-row">
                    <div class="svg-container">
                        <!-- {{GORSEL_1_SVG_KODU_VEYA_IMG_BURAYA}} -->
                        <div style="width: 100%; height: 100%; display:flex; justify-content:center; align-items:center; font-weight:700; color:#64748B;">GÖRSEL 1</div>
                    </div>
                    <div id="zone-1" class="drop-zone" data-ans="{{CEVAP_1}}" onclick="onDropZoneClick(event)"></div>
                </div>

                <!-- 2. Satır -->
                <div class="match-row">
                    <div class="svg-container">
                        <!-- {{GORSEL_2_SVG_KODU_VEYA_IMG_BURAYA}} -->
                        <div style="width: 100%; height: 100%; display:flex; justify-content:center; align-items:center; font-weight:700; color:#64748B;">GÖRSEL 2</div>
                    </div>
                    <div id="zone-2" class="drop-zone" data-ans="{{CEVAP_2}}" onclick="onDropZoneClick(event)"></div>
                </div>

                <!-- 3. Satır -->
                <div class="match-row">
                    <div class="svg-container">
                        <!-- {{GORSEL_3_SVG_KODU_VEYA_IMG_BURAYA}} -->
                        <div style="width: 100%; height: 100%; display:flex; justify-content:center; align-items:center; font-weight:700; color:#64748B;">GÖRSEL 3</div>
                    </div>
                    <div id="zone-3" class="drop-zone" data-ans="{{CEVAP_3}}" onclick="onDropZoneClick(event)"></div>
                </div>

                <!-- 4. Satır -->
                <div class="match-row">
                    <div class="svg-container">
                        <!-- {{GORSEL_4_SVG_KODU_VEYA_IMG_BURAYA}} -->
                        <div style="width: 100%; height: 100%; display:flex; justify-content:center; align-items:center; font-weight:700; color:#64748B;">GÖRSEL 4</div>
                    </div>
                    <div id="zone-4" class="drop-zone" data-ans="{{CEVAP_4}}" onclick="onDropZoneClick(event)"></div>
                </div>
            </div>

            <!-- Sağ Panel -->
            <div class="right-panel">
                <div class="pool-title">{{HAVUZ_BASLIGI}}</div>
                <div class="pool-container">
                    
                    <div class="pool-slot">
                        <div id="c-1" class="draggable-card" data-val="{{CEVAP_1}}" onclick="onCardClick(event)">{{KAVRAM_1}}</div>
                    </div>
                    <div class="pool-slot">
                        <div id="c-2" class="draggable-card" data-val="{{CEVAP_2}}" onclick="onCardClick(event)">{{KAVRAM_2}}</div>
                    </div>
                    <div class="pool-slot">
                        <div id="c-3" class="draggable-card" data-val="{{CEVAP_3}}" onclick="onCardClick(event)">{{KAVRAM_3}}</div>
                    </div>
                    <div class="pool-slot">
                        <div id="c-4" class="draggable-card" data-val="{{CEVAP_4}}" onclick="onCardClick(event)">{{KAVRAM_4}}</div>
                    </div>

                </div>
                <div class="control-panel">
                    <div id="m-box" class="message-box"></div>
                    <button id="btn-c" class="btn-action" onclick="checkAnswers()">KONTROL ET</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        /* ORİJİNAL REFERANS KODUNDAN BİREBİR ALINMIŞTIR */
        let audioCtx = null;
        function getAudioContext() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
        
        function playSfx(type) {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination);
                if(type==='click') { osc.type='triangle'; osc.frequency.setValueAtTime(220, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime+0.1); }
                else if(type==='jump') { osc.type='sine'; osc.frequency.setValueAtTime(150, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime+0.15); }
                else if(type==='correct') { osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); }
                else if(type==='incorrect') { osc.type='sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.linearRampToValueAtTime(150, ctx.currentTime+0.3); }
                gain.gain.setValueAtTime(0.08, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }
        let activeDrag = null, pointerId = null, startDragX=0, startDragY=0, cardStartX=0, cardStartY=0, selCard=null, attempts=0, done=false, preventClick=false;
        function init() {
            shufflePool();
            document.querySelectorAll('.draggable-card').forEach(c => {
                c.addEventListener('pointerdown', down);
            });
            document.getElementById('audio1').play().catch(()=>{});
        }
        function shufflePool() {
            const container = document.querySelector('.pool-container');
            const slots = Array.from(container.children);
            for (let i = slots.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                container.insertBefore(slots[j], slots[i].nextSibling);
            }
        }
        function down(e) {
            if(done || activeDrag) return; 
            if(selCard) { selCard.classList.remove('selected'); selCard=null; }
            
            activeDrag = e.currentTarget;
            pointerId = e.pointerId;
            activeDrag.setPointerCapture(pointerId);
            
            activeDrag.classList.add('dragging');
            
            startDragX = e.clientX; startDragY = e.clientY;
            
            const matrix = new DOMMatrixReadOnly(window.getComputedStyle(activeDrag).transform);
            cardStartX = matrix.m41; cardStartY = matrix.m42;
            
            activeDrag.addEventListener('pointermove', move);
            activeDrag.addEventListener('pointerup', up);
            activeDrag.addEventListener('pointercancel', up);
            
            playSfx('click');
        }
        function move(e) {
            if(!activeDrag || e.pointerId !== pointerId) return;
            const scale = document.getElementById('scale-container').getBoundingClientRect().width / 960;
            const dx = (e.clientX - startDragX) / scale, dy = (e.clientY - startDragY) / scale;
            if(Math.abs(dx) > 3 || Math.abs(dy) > 3) preventClick = true;
            activeDrag.style.transform = `translate(${cardStartX + dx}px, ${cardStartY + dy}px)`;
        }
        function up(e) {
            if(!activeDrag || e.pointerId !== pointerId) return;
            activeDrag.removeEventListener('pointermove', move); activeDrag.removeEventListener('pointerup', up); activeDrag.removeEventListener('pointercancel', up);
            activeDrag.releasePointerCapture(pointerId);
            activeDrag.classList.remove('dragging');
            
            const zones = document.querySelectorAll('.drop-zone');
            let bestZone = null, maxOverlap = 0;
            const scale = document.getElementById('scale-container').getBoundingClientRect().width / 960;
            
            zones.forEach(zone => {
                const r1 = activeDrag.getBoundingClientRect(), r2 = zone.getBoundingClientRect();
                const ox = Math.max(0, Math.min(r1.right, r2.right) - Math.max(r1.left, r2.left));
                const oy = Math.max(0, Math.min(r1.bottom, r2.bottom) - Math.max(r1.top, r2.top));
                const unscaledOverlap = (ox * oy) / (scale * scale);
                if(unscaledOverlap > 100) { maxOverlap = unscaledOverlap; bestZone = zone; }
            });
            
            if(bestZone && maxOverlap > 100) dock(activeDrag, bestZone); else back(activeDrag);
            if(preventClick) setTimeout(() => { preventClick = false; }, 50);
            activeDrag = null; pointerId = null; refreshUI();
        }
        function dock(c, z, duration = '0.2s') {
            const oldCardId = z.getAttribute('data-card');
            if(oldCardId && oldCardId !== c.id) back(document.getElementById(oldCardId));
            
            const oldZoneId = c.getAttribute('data-zone');
            if(oldZoneId) {
                const oldZone = document.getElementById(oldZoneId);
                oldZone.removeAttribute('data-card'); oldZone.classList.remove('has-card');
            }
            
            const scale = document.getElementById('scale-container').getBoundingClientRect().width / 960;
            const parentSlot = c.parentNode.getBoundingClientRect();
            const zoneRect = z.getBoundingClientRect();
            
            const dx = (zoneRect.left - parentSlot.left) / scale;
            const dy = (zoneRect.top - parentSlot.top) / scale;
            c.style.width = z.offsetWidth + 'px';
            c.style.height = z.offsetHeight + 'px';
            c.style.transition = `all ${duration} cubic-bezier(0.2, 0, 0.2, 1)`;
            c.style.transform = `translate(${dx}px, ${dy}px)`;
            
            c.setAttribute('data-zone', z.id); z.setAttribute('data-card', c.id); z.classList.add('has-card');
            playSfx('jump');
        }
        function back(c) {
            const zId = c.getAttribute('data-zone');
            if(zId) {
                const z = document.getElementById(zId);
                z.removeAttribute('data-card'); z.classList.remove('has-card');
            }
            c.removeAttribute('data-zone');
            c.style.width = '100%';
            c.style.height = '46px';
            c.style.transition = 'all 0.3s cubic-bezier(0.2, 0, 0.2, 1)';
            c.style.transform = 'translate(0px, 0px)';
        }
        function onCardClick(e) {
            if(done || preventClick) return; const c = e.currentTarget;
            if(c.getAttribute('data-zone')) { back(c); refreshUI(); return; }
            if(selCard) selCard.classList.remove('selected');
            if(selCard === c) selCard = null; else { selCard = c; selCard.classList.add('selected'); playSfx('click'); }
        }
        function onDropZoneClick(e) {
            if(done || !selCard) return; dock(selCard, e.currentTarget); selCard.classList.remove('selected'); selCard = null; refreshUI();
        }
        function refreshUI() {
            const zones = document.querySelectorAll('.drop-zone');
            const allFilled = Array.from(zones).every(z => z.getAttribute('data-card'));
            document.getElementById('btn-c').style.display = allFilled ? 'block' : 'none';
        }
        function checkAnswers() {
            if(done) return;
            let correctCount = 0;
            const zones = document.querySelectorAll('.drop-zone');
            
            zones.forEach(z => {
                const cardId = z.getAttribute('data-card');
                if(cardId) {
                    const c = document.getElementById(cardId);
                    if(c.getAttribute('data-val') === z.getAttribute('data-ans')) {
                        correctCount++; c.className = "draggable-card correct-state disabled";
                        c.style.width = z.offsetWidth + 'px'; c.style.height = z.offsetHeight + 'px';
                    } else { c.className = "draggable-card incorrect-state"; c.style.width = z.offsetWidth + 'px'; c.style.height = z.offsetHeight + 'px';}
                }
            });
            
            if(correctCount === zones.length) {
                done = true;
                const actionBtn = document.getElementById('btn-c');
                actionBtn.className = "btn-action completed-state";
                actionBtn.innerText = "TAMAMLANDI ✓"; actionBtn.disabled = true;
                playSfx('correct');
                
                setVar('{{STORYLINE_VAR_ILK_DOGRU}}', true); 
                showToast("Tebrikler! Etkinliği kusursuz tamamladınız. ✓", "msg-success");
            } else {
                attempts++;
                if(attempts === 1) {
                    playSfx('incorrect');
                    showMsg('Bazı eşleşmeler hatalı, lütfen tekrar deneyiniz.', 'msg-error');
                    zones.forEach(z => {
                        const cardId = z.getAttribute('data-card');
                        if(cardId) {
                            const c = document.getElementById(cardId);
                            if(c.getAttribute('data-val') !== z.getAttribute('data-ans')) {
                                setTimeout(() => { if(!done){ back(c); c.className="draggable-card"; refreshUI(); } }, 1500); 
                            }
                        }
                    });
                    setTimeout(() => { if(!done) { document.getElementById('m-box').style.display = 'none'; } }, 2000);
                } else { 
                    done = true; 
                    document.getElementById('btn-c').style.display = 'none'; 
                    solveAll(); 
                }
            }
        }
        function solveAll() {
            const zones = document.querySelectorAll('.drop-zone'), cards = document.querySelectorAll('.draggable-card');
            if(selCard) { selCard.classList.remove('selected'); selCard = null; }
            cards.forEach(c => {
                c.removeAttribute('data-zone'); c.style.transition = 'none'; c.style.transform = 'translate(0px, 0px)'; 
                c.className = "draggable-card disabled"; c.style.width = '100%'; c.style.height = '46px';
            });
            zones.forEach(z => { z.removeAttribute('data-card'); z.classList.remove('has-card'); });
            
            document.body.offsetHeight; 
            setTimeout(() => {
                zones.forEach((z, i) => {
                    const targetVal = z.getAttribute('data-ans');
                    const correctCard = Array.from(cards).find(c => c.getAttribute('data-val') === targetVal);
                    if(correctCard) { 
                        setTimeout(() => { 
                            dock(correctCard, z, '1.5s'); 
                            correctCard.className = "draggable-card correct-state disabled"; 
                        }, i * 400); 
                    }
                });
            }, 100);
            showMsg('Hakkınız bitti. Doğru cevaplar yerleştiriliyor...', 'msg-error');
            
            setTimeout(() => {
                document.getElementById('m-box').style.display = 'none';
                const actionBtn = document.getElementById('btn-c');
                actionBtn.style.display = 'block';
                actionBtn.disabled = true;
                actionBtn.className = "btn-action completed-state";
                
                let countdown = 10;
                actionBtn.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
                
                const interval = setInterval(() => {
                    countdown--;
                    actionBtn.innerText = `İNCELEME SÜRESİ: ${countdown}S`;
                    if(countdown <= 0) {
                        clearInterval(interval);
                        actionBtn.innerText = "TAMAMLANDI ✓";
                        setVar('{{STORYLINE_VAR_INCELEME_BITTI}}', true); 
                        showToast("İnceleme tamamlandı, ilerleyebilirsiniz.", "msg-success");
                    }
                }, 1000);
            }, 3500);
        }
        function showMsg(t, cls) { const b = document.getElementById('m-box'); b.innerText = t; b.className = 'message-box ' + cls; b.style.display = 'block'; }
        
        function setVar(n, v) { try { parent.GetPlayer().SetVar(n, v); console.log(`${n} -> ${v}`); } catch(e) { console.log(`${n} -> ${v}`); } }
        function showToast(msg, typeCls = '') {
            const toast = document.getElementById('toast-msg');
            const txtEl = document.getElementById('toast-text');
            
            toast.className = '';
            toast.classList.add('show');
            if (typeCls) toast.classList.add(typeCls);
            
            if(msg) txtEl.innerText = msg;
            
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }
        window.addEventListener('resize', () => {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        });
        
        window.onload = () => { window.dispatchEvent(new Event('resize')); init(); };
    </script>
</body>
</html>
