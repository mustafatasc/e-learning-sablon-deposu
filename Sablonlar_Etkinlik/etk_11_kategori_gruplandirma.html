<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{SAYFA_BASLIGI}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --slide-width: 960px;
            --slide-height: 540px;
            --cream-bg: #FCF9F2;
            --paper-grid: rgba(59, 130, 246, 0.05);
            
            --primary-main: #2563EB; 
            --primary-dark: #1E3A8A;
            --primary-soft: #93C5FD;
            --warm-grey: #475569;
            --text-dark: #1E293B;
            
            --success-green: #10B981;
            --error-red: #EF4444;
            --warning-orange: #F59E0B;
            
            --grup-1-renk: #DC2626; 
            --grup-2-renk: #059669; 
        }
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0F172A; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; color: var(--text-dark);
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }
        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        *::-webkit-scrollbar { display: none !important; }
        
        #scale-container {
            width: var(--slide-width); height: var(--slide-height);
            background-color: var(--cream-bg);
            background-image: linear-gradient(var(--paper-grid) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--paper-grid) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            border-top: 6px solid var(--primary-main);
        }
        
        .header {
            padding: 20px 40px 0 40px; height: 90px;
            display: flex; justify-content: space-between; align-items: start;
            flex-shrink: 0; z-index: 10;
        }
        .instruction-container { flex: 1; padding: 0; display: flex; align-items: center; gap: 15px; }
        .narrator-speaker {
            width: 36px; height: 36px; background: var(--primary-main); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4); cursor: pointer;
        }
        @keyframes pulsePlay {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
        .instruction-text { font-size: 15px; line-height: 1.4; font-weight: 800; color: var(--text-dark); text-align: left; }
        .logo-right-container { width: 80px; height: 80px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; margin-left: 20px; margin-top: -5px; }
        
        .main-content { 
            display: flex; flex: 1; padding: 5px 40px 20px 40px; gap: 20px; 
            height: calc(540px - 90px); z-index: 10; box-sizing: border-box; min-height: 0;
        }
        
        /* --- SOL PANEL --- */
        .left-panel { 
            width: 260px !important; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; min-height: 0; 
        }
        .pool-title { font-size: 13px; font-weight: 900; color: var(--primary-main); text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 4px; letter-spacing: 0.5px; }
        
        .pool-area {
            background: rgba(255, 255, 255, 0.6); border: 2px dashed #cbd5e1; border-radius: 16px;
            padding: 15px 10px; display: flex; flex-direction: column; gap: 10px; flex: 1; 
            align-items: center; justify-content: flex-start; overflow-y: auto;
        }
        
        .pool-slot { width: 100%; max-width: 200px; height: 42px; position: relative; flex-shrink: 0;}
        
        .draggable-card {
            position: absolute; width: 100%; height: 100%; background: white;
            border: 2px solid var(--primary-main); border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13.5px; font-weight: 800; cursor: grab; box-shadow: 0 4px 8px rgba(37, 99, 235, 0.15);
            z-index: 100; touch-action: none; text-align: center; padding: 0 8px;
            color: var(--primary-dark); transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1);
            line-height: 1.1; word-break: break-word; white-space: normal; overflow: hidden;
        }
        
        .draggable-card.dragging { cursor: grabbing; box-shadow: 5px 8px 25px rgba(0,0,0,0.25); z-index: 1000 !important; transition: none; transform: scale(1.05); }
        .draggable-card.selected { border-color: var(--warning-orange); background: #fffbeb; color: #b45309; }
        .draggable-card.correct { border-color: var(--success-green) !important; background: #d1fae5 !important; color: #065f46 !important; box-shadow: none; }
        .draggable-card.incorrect { border-color: var(--error-red) !important; background: #fef2f2 !important; color: #991b1b !important; animation: shake 0.4s ease-in-out;}
        .draggable-card.disabled { cursor: not-allowed; pointer-events: none; }
        
        /* --- SAĞ PANEL --- */
        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 15px; min-height: 0; min-width: 0;}
        
        .group-box {
            flex: 1; min-height: 0; background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 18px;
            display: flex; flex-direction: column; padding: 12px 15px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }
        
        .group-title { text-align: center; font-weight: 900; font-size: 15px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 2px solid #f1f5f9; letter-spacing: 0.5px; text-transform: uppercase;}
        .group-title.grup-1-stil { color: var(--grup-1-renk); border-bottom-color: rgba(220, 38, 38, 0.2); }
        .group-title.grup-2-stil { color: var(--grup-2-renk); border-bottom-color: rgba(5, 150, 105, 0.2); }
        
        .drop-zone-container { flex: 1; position: relative; min-height: 0; }
        
        .group-drop-area {
            position: absolute; inset: 0; border: 2.5px dashed #cbd5e1; border-radius: 12px;
            background: rgba(248, 250, 252, 0.4); transition: all 0.2s ease; z-index: 1;
        }
        .group-drop-area.active-hover { border-color: var(--primary-main); background: #eff6ff; }
        
        .card-container {
             display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; align-content: center;
             z-index: 5; position: absolute; inset: 0; padding: 10px; overflow-y: auto;
        }
        .placed-card-slot { width: 140px; height: 40px; position: relative; flex-shrink: 0; }
        
        /* --- KONTROL --- */
        .control-panel { height: 50px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 5px; position: relative; }
        
        .btn-check {
            background: var(--primary-main); color: white; font-size: 15px; font-weight: 900;
            height: 48px; border-radius: 12px; transition: 0.2s; cursor: pointer; display: none; width: 100%;
            text-align: center; border: none; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); letter-spacing: 1px;
        }
        .btn-check:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(37, 99, 235, 0.4); }
        .btn-check:disabled { pointer-events: none; opacity: 0.5;}
        .btn-check.completed { background-color: var(--text-dark) !important; color: white !important; box-shadow: none !important; cursor: default; transform: none; opacity: 1;}
        .btn-check.timer { background-color: var(--warning-orange) !important; color: white !important; pointer-events: none; box-shadow: none; transform: none; opacity: 1;}
        
        .feedback-msg { font-size: 12px; font-weight: 800; padding: 8px; border-radius: 8px; display: none; text-align: center; position: absolute; top: -45px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
        .fb-succ { background: #d1fae5; color: #065f46; border: 1px solid #10B981; }
        .fb-err { background: #fef2f2; color: #991b1b; border: 1px solid #EF4444; }
        
        #toast {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px);
            background-color: var(--text-dark); color: white; font-weight: 800; font-size: 13.5px;
            padding: 12px 24px; border-radius: 10px; box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
        
        #drag-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
    </style>
</head>
<body>
    
    <audio id="audio1" src="{{SES_DOSYASI_URL}}" preload="auto"></audio>
    
    <div id="scale-container">
        
        <div id="toast">
            <svg id="toast-icon" class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            <span id="toast-text"></span>
        </div>
        
        <div class="header">
            <div class="instruction-container">
                <div id="speaker" class="narrator-speaker" onclick="playAudio()">
                    <svg class="w-4 h-4 pl-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.546-2.07-2.584-1.23L6.15 6.75H3A1.5 1.5 0 001.5 8.25v7.5A1.5 1.5 0 003 17.25h3.15l4.766 3.92c1.038.84 2.584.106 2.584-1.23V4.06z"/></svg>
                </div>
                <div class="instruction-text" onclick="playAudio()" style="cursor: pointer;">
                    {{ANA_YONERGE_METNI_ORN_Kartlari_dogru_gruba_surukleyiniz}}
                </div>
            </div>
            <div class="logo-right-container">
                <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none'">
            </div>
        </div>
        
        <div class="main-content">
            
            <div class="left-panel">
                <div class="pool-title">{{HAVUZ_BASLIGI}}</div>
                <div class="pool-area" id="pool">
                    
                    <!-- DATA-VAL değerleri grup data-group id'leri ile eşleşmek ZORUNDA (örn: grup1, grup2) -->
                    <div class="pool-slot"><div id="c1" class="draggable-card" data-val="grup1" onclick="onCardClick(event)">{{KART_1_METNI}}</div></div>
                    <div class="pool-slot"><div id="c2" class="draggable-card" data-val="grup2" onclick="onCardClick(event)">{{KART_2_METNI}}</div></div>
                    <div class="pool-slot"><div id="c3" class="draggable-card" data-val="grup1" onclick="onCardClick(event)">{{KART_3_METNI}}</div></div>
                    <div class="pool-slot"><div id="c4" class="draggable-card" data-val="grup2" onclick="onCardClick(event)">{{KART_4_METNI}}</div></div>
                    <div class="pool-slot"><div id="c5" class="draggable-card" data-val="grup1" onclick="onCardClick(event)">{{KART_5_METNI}}</div></div>
                    <div class="pool-slot"><div id="c6" class="draggable-card" data-val="grup2" onclick="onCardClick(event)">{{KART_6_METNI}}</div></div>
                    
                </div>
            </div>
            
            <div class="right-panel">
                
                <!-- Grup 1 Kutusu -->
                <div class="group-box" id="grup-1-box">
                    <div class="group-title grup-1-stil">{{GRUP_1_BASLIK}}</div>
                    <div class="drop-zone-container">
                        <div class="group-drop-area" id="drop-grup1" data-group="grup1" onclick="onAreaClick(event)"></div>
                        <!-- Kutu ID'si container-{data-group} formatında olmak zorundadır -->
                        <div class="card-container" id="container-grup1"></div>
                    </div>
                </div>
                
                <!-- Grup 2 Kutusu -->
                <div class="group-box" id="grup-2-box">
                    <div class="group-title grup-2-stil">{{GRUP_2_BASLIK}}</div>
                    <div class="drop-zone-container">
                        <div class="group-drop-area" id="drop-grup2" data-group="grup2" onclick="onAreaClick(event)"></div>
                        <div class="card-container" id="container-grup2"></div>
                    </div>
                </div>
                
                <div class="control-panel">
                    <div id="fb-msg" class="feedback-msg"></div>
                    <button id="btn-check" class="btn-check" onclick="checkAns()">KONTROL ET</button>
                </div>
            </div>
        </div>
        
        <div id="drag-layer"></div>
    </div>
    
    <script>
        let audioCtx = null;
        let isAudioPlaying = false;
        
        // Bu şablondaki toplam kart sayısını buradan belirliyoruz. (Kontrol butonunun açılması için)
        const TOTAL_CARDS = 6; 
        
        function getAudioCtx() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        
        function playSfx(type) {
            try {
                const ctx = getAudioCtx(); const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                
                if(type==='click'){ osc.type='triangle'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime+0.1); }
                else if(type==='jump'){ osc.type='sine'; osc.frequency.setValueAtTime(200, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime+0.15); }
                else if(type==='correct'){ osc.type='sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+0.25); }
                else if(type==='err'){ osc.type='sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.linearRampToValueAtTime(150, ctx.currentTime+0.3); }
                
                gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime+0.15);
                osc.start(); osc.stop(ctx.currentTime+0.3);
            } catch(e){}
        }

        let activeDrag = null, pointerId = null;
        let startX = 0, startY = 0, cardX = 0, cardY = 0, selCard = null;
        let preventClick = false, done = false, attempts = 0;
        
        const origPositions = {};

        function forceAutoplay() {
            if (isAudioPlaying) return; 
            const audio = document.getElementById('audio1');
            const speaker = document.getElementById('speaker');
            
            if (audio) {
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                        window.removeEventListener('pointerdown', forceAutoplay);
                    }).catch(error => {
                        if(speaker) speaker.style.animation = 'none';
                    });
                }
            }
        }

        function playAudio() {
            const audio = document.getElementById('audio1');
            const speaker = document.getElementById('speaker');
            if(audio) {
                audio.pause(); audio.currentTime = 0; 
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.style.animation = 'pulsePlay 2s infinite';
                    }).catch(e => console.log(e));
                }
            }
        }

        function init() {
            const pool = document.getElementById('pool');
            const slots = Array.from(pool.children);
            for(let i = slots.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                pool.insertBefore(slots[j], slots[i].nextSibling);
            }
            
            document.querySelectorAll('.draggable-card').forEach(c => {
                c.addEventListener('pointerdown', down);
                origPositions[c.id] = c.parentNode; 
            });
            
            const audio1 = document.getElementById('audio1');
            if(audio1) {
                audio1.addEventListener('ended', () => {
                    const speaker = document.getElementById('speaker');
                    if(speaker) speaker.style.animation = 'none'; 
                    isAudioPlaying = false; 
                });
            }
            window.addEventListener('pointerdown', forceAutoplay);
        }

        function down(e) {
            if(done || activeDrag) return;
            if(e.button !== 0 && e.type !== 'touchstart') return; 
            if(selCard) { selCard.classList.remove('selected'); selCard = null; }
            
            activeDrag = e.currentTarget;
            pointerId = e.pointerId;
            
            const rect = activeDrag.getBoundingClientRect();
            const dl = document.getElementById('drag-layer');
            const dlRect = dl.getBoundingClientRect();
            const scale = dlRect.width / 960;
            
            // Eğer kutudaysa eski yeri silinir
            if(activeDrag.parentNode && activeDrag.parentNode.classList.contains('placed-card-slot')) {
                activeDrag.parentNode.parentNode.removeChild(activeDrag.parentNode);
                activeDrag.removeAttribute('data-current-group');
            }
            
            dl.appendChild(activeDrag);
            activeDrag.classList.add('dragging');
            
            cardX = (rect.left - dlRect.left) / scale;
            cardY = (rect.top - dlRect.top) / scale;
            
            activeDrag.style.position = 'absolute';
            activeDrag.style.width = (rect.width / scale) + 'px';
            activeDrag.style.height = (rect.height / scale) + 'px';
            activeDrag.style.margin = '0';
            activeDrag.style.left = cardX + 'px';
            activeDrag.style.top = cardY + 'px';
            activeDrag.style.transition = 'none';
            activeDrag.style.transform = 'translate(0px, 0px)';
            
            startX = e.clientX; startY = e.clientY;
            
            activeDrag.addEventListener('pointermove', move);
            activeDrag.addEventListener('pointerup', up);
            activeDrag.addEventListener('pointercancel', up);
            
            try { activeDrag.setPointerCapture(pointerId); } catch(err){}
            playSfx('click');
        }

        function move(e) {
            if(!activeDrag || e.pointerId !== pointerId) return;
            const scale = document.getElementById('scale-container').getBoundingClientRect().width / 960;
            const dx = (e.clientX - startX) / scale;
            const dy = (e.clientY - startY) / scale;
            
            if(Math.abs(dx) > 3 || Math.abs(dy) > 3) preventClick = true;
            activeDrag.style.transform = `translate(${dx}px, ${dy}px) scale(1.05)`;
            
            const cx = e.clientX; const cy = e.clientY;
            document.querySelectorAll('.group-drop-area').forEach(area => {
                const zRect = area.getBoundingClientRect();
                if (cx >= zRect.left && cx <= zRect.right && cy >= zRect.top && cy <= zRect.bottom) {
                    area.classList.add('active-hover');
                } else {
                    area.classList.remove('active-hover');
                }
            });
        }

        function up(e) {
            if(!activeDrag || e.pointerId !== pointerId) return;
            activeDrag.removeEventListener('pointermove', move);
            activeDrag.removeEventListener('pointerup', up);
            activeDrag.removeEventListener('pointercancel', up);
            try { activeDrag.releasePointerCapture(pointerId); } catch(err){}
            activeDrag.classList.remove('dragging');
            
            let bestArea = null;
            const cx = e.clientX; const cy = e.clientY;
            
            document.querySelectorAll('.group-drop-area').forEach(area => {
                area.classList.remove('active-hover');
                const r2 = area.getBoundingClientRect();
                if (cx >= r2.left && cx <= r2.right && cy >= r2.top && cy <= r2.bottom) {
                    bestArea = area;
                }
            });
            
            if(bestArea) {
                dockToGroup(activeDrag, bestArea.dataset.group);
            } else {
                backToPool(activeDrag);
            }
            
            if(preventClick) { setTimeout(()=>preventClick=false, 50); }
            activeDrag = null; pointerId = null;
            refreshUI();
        }

        function dockToGroup(card, groupId, duration = '0.3s') {
            const container = document.getElementById(`container-${groupId}`);
            if(!container) {
                console.error("Hedef Kutu ID'si bulunamadı: container-" + groupId);
                backToPool(card);
                return;
            }
            
            const oldRect = card.getBoundingClientRect();
            
            // Havuzdaki eski yuvadan veya drag layerdan çıkar
            if (card.parentNode && card.parentNode.id === 'drag-layer') {
                 document.getElementById('drag-layer').removeChild(card);
            }
            
            const newSlot = document.createElement('div');
            newSlot.className = 'placed-card-slot';
            newSlot.appendChild(card);
            container.appendChild(newSlot);
            
            card.dataset.currentGroup = groupId;
            card.style.position = 'relative';
            card.style.width = '100%';
            card.style.height = '100%';
            card.style.left = '0';
            card.style.top = '0';
            card.style.margin = '0';
            
            const newRect = card.getBoundingClientRect();
            const scale = document.getElementById('scale-container').getBoundingClientRect().width / 960;
            const dx = (oldRect.left - newRect.left) / scale;
            const dy = (oldRect.top - newRect.top) / scale;
            
            card.style.transition = 'none';
            card.style.transform = `translate(${dx}px, ${dy}px)`;
            void card.offsetWidth;
            
            card.style.transition = `transform ${duration} cubic-bezier(0.2, 0, 0.2, 1)`;
            card.style.transform = 'translate(0px, 0px)';
            
            playSfx('jump');
        }

        function backToPool(card) {
            if(card.parentNode && card.parentNode.classList.contains('placed-card-slot')) {
                const slot = card.parentNode;
                slot.parentNode.removeChild(slot);
            }
            
            const oldRect = card.getBoundingClientRect();
            origPositions[card.id].appendChild(card);
            
            card.removeAttribute('data-current-group');
            card.style.position = 'absolute';
            card.style.width = '100%';
            card.style.height = '100%';
            card.style.left = '0';
            card.style.top = '0';
            card.style.margin = '0';
            
            const newRect = card.getBoundingClientRect();
            const scale = document.getElementById('scale-container').getBoundingClientRect().width / 960;
            const dx = (oldRect.left - newRect.left) / scale;
            const dy = (oldRect.top - newRect.top) / scale;
            
            card.style.transition = 'none';
            card.style.transform = `translate(${dx}px, ${dy}px)`;
            void card.offsetWidth;
            
            card.style.transition = `transform 0.3s cubic-bezier(0.2, 0, 0.2, 1)`;
            card.style.transform = 'translate(0px, 0px)';
        }

        function onCardClick(e) {
            if(done || preventClick) return;
            const c = e.currentTarget;
            
            if(c.dataset.currentGroup) { 
                backToPool(c); 
                playSfx('click');
                refreshUI(); 
                return; 
            }
            
            if(selCard) selCard.classList.remove('selected');
            if(selCard === c) { selCard = null; } 
            else { selCard = c; selCard.classList.add('selected'); playSfx('click'); }
        }

        function onAreaClick(e) {
            if(done || !selCard) return;
            const area = e.currentTarget;
            dockToGroup(selCard, area.dataset.group);
            selCard.classList.remove('selected');
            selCard = null;
            refreshUI();
        }

        function refreshUI() {
            const placedCount = document.querySelectorAll('.draggable-card[data-current-group]').length;
            const btn = document.getElementById('btn-check');
            btn.style.display = placedCount === TOTAL_CARDS ? 'block' : 'none';
        }

        function checkAns() {
            if(done) return;
            let isAllCorrect = true;
            const cards = document.querySelectorAll('.draggable-card');
            
            cards.forEach(c => {
                if(c.dataset.val === c.dataset.currentGroup) {
                    c.classList.add('correct'); c.classList.remove('incorrect');
                } else {
                    c.classList.add('incorrect'); c.classList.remove('correct');
                    isAllCorrect = false;
                }
            });
            
            if(isAllCorrect) {
                done = true;
                cards.forEach(c => c.classList.add('disabled'));
                const btn = document.getElementById('btn-check');
                btn.innerText = 'TAMAMLANDI ✓';
                btn.className = 'btn-check completed';
                btn.disabled = true;
                
                showMsg('{{BASARI_GERI_BILDIRIM_METNI}}', 'fb-succ');
                showToast('Etkinliği kusursuz tamamladınız. ✓', 'toast-success');
                playSfx('correct');
                setVar('{{STORYLINE_VAR_TAMAMLANDI}}', true);
            } else {
                attempts++;
                playSfx('err');
                if(attempts === 1) {
                    showMsg('{{HATA_GERI_BILDIRIM_METNI}}', 'fb-err');
                    showToast('Lütfen kırmızı kartları kontrol edin.', 'toast-error');
                    setTimeout(() => {
                        cards.forEach(c => {
                            if(c.classList.contains('incorrect')) { 
                                backToPool(c); 
                                c.classList.remove('incorrect'); 
                            }
                        });
                        document.getElementById('fb-msg').style.display='none';
                        refreshUI();
                    }, 1500);
                } else {
                    done = true;
                    document.getElementById('btn-check').style.display = 'none';
                    solveAll();
                }
            }
        }

        function solveAll() {
            const cards = document.querySelectorAll('.draggable-card');
            if(selCard) { selCard.classList.remove('selected'); selCard = null; }
            
            cards.forEach(c => {
                backToPool(c);
                c.style.transition = 'none'; c.style.transform = 'translate(0px, 0px)';
                c.className = 'draggable-card';
            });
            
            document.body.offsetHeight; 
            
            let delay = 0;
            setTimeout(() => {
                cards.forEach((c) => {
                    const correctGroup = c.dataset.val;
                    setTimeout(() => {
                        dockToGroup(c, correctGroup, '0.5s');
                        c.className = 'draggable-card correct disabled';
                    }, delay);
                    delay += 400;
                });
            }, 100);
            
            showMsg('Hakkınız bitti. Kartlar doğru gruplara taşınıyor...', 'fb-err');
            
            setTimeout(() => {
                document.getElementById('fb-msg').style.display='none';
                triggerTimerAutoSolve('{{STORYLINE_VAR_INCELEME_BITTI}}');
            }, delay + 1500);
        }

        function triggerTimerAutoSolve(variableToSet) {
            const btn = document.getElementById('btn-check');
            btn.style.display = 'block'; btn.disabled = false; btn.className = 'btn-check timer';
            
            let c = 10;
            btn.innerText = `İNCELEME SÜRESİ: ${c}S`;
            
            const int = setInterval(()=>{
                c--; btn.innerText = `İNCELEME SÜRESİ: ${c}S`;
                if(c<=0) {
                    clearInterval(int);
                    btn.innerText = 'TAMAMLANDI ✓'; btn.className = 'btn-check completed'; btn.disabled = true;
                    showToast('İnceleme tamamlandı, eğitim devam ediyor.', 'toast-success');
                    setVar(variableToSet, true);
                }
            }, 1000);
        }

        function showMsg(t, c) { const b = document.getElementById('fb-msg'); b.innerText = t; b.className = 'feedback-msg ' + c; b.style.display = 'block'; }
        
        function showToast(msg, typeCls = '') {
            const toast = document.getElementById('toast');
            const icon = toast.querySelector('svg');
            document.getElementById('toast-text').innerText = msg;
            toast.className = ''; toast.classList.add('show');
            
            if(typeCls === 'toast-error') {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>';
                icon.classList.remove('text-emerald-400', 'text-amber-400'); icon.classList.add('text-white');
                toast.style.backgroundColor = 'var(--error-red)';
            } else {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />';
                icon.classList.remove('text-red-400', 'text-amber-400', 'text-white'); icon.classList.add('text-emerald-400');
                toast.style.backgroundColor = 'var(--text-dark)';
            }
            
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
        
        function setVar(n,v) { try{ parent.GetPlayer().SetVar(n,v); console.log(`Storyline Set: ${n}=${v}`);}catch(e){console.log(`Lokal Set: ${n}=${v}`);} }
        
        function applyScale() {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        }
        
        window.addEventListener('resize', applyScale);
        window.onload = () => { window.dispatchEvent(new Event('resize')); getAudioCtx(); init(); };
    </script>
</body>
</html>
