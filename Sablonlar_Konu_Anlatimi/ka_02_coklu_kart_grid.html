<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{SAYFA_BASLIGI}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            /* Tema Renkleri */
            --primary-color: #B91C1C; 
            --primary-dark: #7F1D1D;
            --bg-cream: #FCF9F2;
            --grid-line: rgba(185, 28, 28, 0.08);
            --text-dark: #1E293B;
            --success-green: #10B981;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0F172A; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Montserrat', sans-serif;
            font-weight: 500; color: var(--text-dark);
            user-select: none;
        }
        #scale-container {
            width: 960px; height: 540px;
            background-color: var(--bg-cream); 
            background-image: 
                linear-gradient(var(--grid-line) 1.5px, transparent 1.5px), 
                linear-gradient(90deg, var(--grid-line) 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-top: 6px solid var(--primary-color);
        }
        
        /* --- HEADER --- */
        .header {
            padding: 15px 40px 0 40px; height: 75px;
            display: flex; justify-content: space-between; align-items: start;
            flex-shrink: 0; z-index: 10;
        }
        .instruction-container { flex: 1; padding: 0; }
        .instruction-text-main { font-size: 16px; line-height: 1.4; font-weight: 900; color: var(--primary-color); text-transform: uppercase; letter-spacing: 1px;}
        .logo-right-container { width: 75px; height: 75px; display: flex; justify-content: center; align-items: flex-start; flex-shrink: 0; margin-left: 20px; margin-top: -10px; }
        
        .content-wrapper {
            display: flex; flex-direction: column; flex: 1; padding: 0 40px 15px 40px; gap: 15px; 
            height: calc(540px - 75px); z-index: 10; position: relative; min-height: 0;
        }

        /* --- BİLGİ KUTUSU (ÜST METİN) --- */
        .info-box {
            display: flex; align-items: center; gap: 15px; width: 100%;
            background: white; border-radius: 12px; padding: 15px 25px 15px 15px;
            border-left: 5px solid #1D4ED8; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            margin-top: 0; z-index: 10;
        }
        .narrator-speaker {
            width: 36px; height: 36px; background: var(--primary-color); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(185, 28, 28, 0.4); cursor: pointer; transition: transform 0.2s;
        }
        .narrator-speaker:hover { transform: scale(1.1); }
        .narrator-speaker.playing { animation: pulsePlay 2s infinite; }
        
        @keyframes pulsePlay {
            0% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(185, 28, 28, 0); }
            100% { box-shadow: 0 0 0 0 rgba(185, 28, 28, 0); }
        }
        .info-text { font-size: 15px; line-height: 1.5; font-weight: 600; color: var(--text-dark); }
        .info-text strong { color: #1D4ED8; font-weight: 800; }

        /* --- KARTLAR (DİNAMİK GRID) --- */
        .cards-grid {
         display: grid; 
         grid-template-columns: repeat(4, 1fr); /* 4 yazdığımız için 4 kart yan yana duracak */
         gap: 15px; flex: 1; min-height: 0;
        }
        .item-card {
            background: white; border: 2px solid #e2e8f0; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: all 0.3s ease;
            position: relative; overflow: hidden;
            background-image: 
                linear-gradient(#f1f5f9 1px, transparent 1px), 
                linear-gradient(90deg, #f1f5f9 1px, transparent 1px);
            background-size: 15px 15px; background-position: center;
        }
        .item-card:hover {
            border-color: #cbd5e1; box-shadow: 0 8px 20px rgba(0,0,0,0.06); transform: translateY(-3px);
        }
        .svg-container {
            width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0;
        }
        .math-svg { width: 100%; height: 100%; max-height: 140px; }
        .card-title {
            font-size: 14px; font-weight: 800; color: var(--primary-color); text-transform: uppercase;
            background: rgba(255,255,255,0.9); padding: 5px 10px; border-radius: 8px; margin-top: 5px;
            border: 1px dashed #cbd5e1; width: 100%; text-align: center;
        }
        
        /* EKSTRA: Formül/Sembol Gösterim Kutusu (İhtiyaç halinde aktif edilir) */
        .notation-box {
            margin-top: 8px; background: white; border: 2px dashed #cbd5e1; border-radius: 8px;
            padding: 6px 10px; width: 100%; display: flex; justify-content: center; align-items: center;
            font-family: 'Times New Roman', Times, serif; font-size: 15px; font-weight: 800; color: #1E293B;
        }

        /* --- ALT PANEL VE BUTON --- */
        .bottom-panel {
            display: flex; justify-content: flex-end; align-items: center; height: 45px; flex-shrink: 0; margin-top: auto;
        }
        .btn-action {
            background: var(--primary-color); color: white; min-width: 200px; height: 45px;
            font-size: 14px; font-weight: 800; border-radius: 12px;
            box-shadow: 0 6px 15px rgba(185, 28, 28, 0.3); border: none;
            cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            opacity: 0; pointer-events: none; transform: translateY(15px);
        }
        .btn-action.show-btn { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .btn-action:hover { background: #991b1b; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(185, 28, 28, 0.4); }
        .btn-action.completed { background: var(--success-green); pointer-events: none; transform: none; box-shadow: none;}
    </style>
</head>
<body>
    <audio id="ses1" src="{{SES_1_URL}}" preload="auto"></audio>

    <div id="scale-container">
        
        <header class="header">
            <div class="instruction-container">
                <div class="instruction-text-main">{{ANA_BASLIK_METNI}}</div>
            </div>
            <div class="logo-right-container">
                <img src="r1.png" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none';">
            </div>
        </header>

        <main class="content-wrapper">
            
            <!-- ÜST BİLGİ KUTUSU VE SES KONTROLÜ -->
            <div class="info-box">
                <div id="main-speaker" class="narrator-speaker" onclick="toggleAudio()">
                    <svg class="w-4 h-4 pl-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M13.5 4.06c0-1.336-1.546-2.07-2.584-1.23L6.15 6.75H3A1.5 1.5 0 001.5 8.25v7.5A1.5 1.5 0 003 17.25h3.15l4.766 3.92c1.038.84 2.584.106 2.584-1.23V4.06z"/></svg>
                </div>
                <div class="info-text">
                    {{UST_ACIKLAMA_METNI_HTML_KULLANILABILIR}}
                </div>
            </div>

            <!-- KARTLAR ALANI -->
            <div class="cards-grid">
                
                <!-- KART 1 -->
                <div class="item-card">
                    <div class="svg-container">
                        <svg class="math-svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
                            <!-- {{KART_1_SVG_KODU}} -->
                        </svg>
                    </div>
                    <div class="card-title">{{KART_1_BASLIK}}</div>
                    <!-- İhtiyaç halinde aktif edilebilir sembol kutusu:
                    <div class="notation-box">{{KART_1_EKSTRA_FORMUL}}</div> 
                    -->
                </div>

                <!-- KART 2 -->
                <div class="item-card">
                    <div class="svg-container">
                        <svg class="math-svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
                            <!-- {{KART_2_SVG_KODU}} -->
                        </svg>
                    </div>
                    <div class="card-title">{{KART_2_BASLIK}}</div>
                </div>

                <!-- KART 3 -->
                <div class="item-card">
                    <div class="svg-container">
                        <svg class="math-svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
                            <!-- {{KART_3_SVG_KODU}} -->
                        </svg>
                    </div>
                    <div class="card-title">{{KART_3_BASLIK}}</div>
                </div>

                <!-- KART 4 (Eğer Sütun Sayısı 4 ise) -->
                <div class="item-card">
                    <div class="svg-container">
                        <svg class="math-svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
                            <!-- {{KART_4_SVG_KODU}} -->
                        </svg>
                    </div>
                    <div class="card-title">{{KART_4_BASLIK}}</div>
                </div>

            </div>

            <!-- ALT BUTON -->
            <div class="bottom-panel">
                <button id="btn-complete" class="btn-action" onclick="completeTopic()">
                    TAMAMLA ✓
                </button>
            </div>
            
        </main>
    </div>

    <script>
        let isAudioPlaying = false;
        
        function forceAutoplay() {
            if (isAudioPlaying) return; 
            
            const audio = document.getElementById('ses1');
            const speaker = document.getElementById('main-speaker');
            
            if (audio) {
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isAudioPlaying = true;
                        if(speaker) speaker.classList.add('playing');
                        
                        window.removeEventListener('click', forceAutoplay);
                        window.removeEventListener('touchstart', forceAutoplay);
                    }).catch(error => {
                        if(speaker) speaker.classList.remove('playing');
                    });
                }
            }
        }
        
        function init() {
            const audio = document.getElementById('ses1');
            if(audio) {
                audio.addEventListener('ended', () => {
                    const speaker = document.getElementById('main-speaker');
                    if(speaker) speaker.classList.remove('playing');
                    isAudioPlaying = false; 
                    
                    // Ses bitince TAMAMLA butonunu göster
                    const btnComplete = document.getElementById('btn-complete');
                    if(btnComplete) btnComplete.classList.add('show-btn');
                });
            }
            
            // Sayfa açılışında sesi başlat
            forceAutoplay();
            window.addEventListener('click', forceAutoplay);
            window.addEventListener('touchstart', forceAutoplay);
            
            // Ses çalışmazsa hata payı olarak 6 saniye sonra butonu otomatik göster
            setTimeout(() => {
                const btnComplete = document.getElementById('btn-complete');
                if(btnComplete && !btnComplete.classList.contains('show-btn')) {
                    btnComplete.classList.add('show-btn');
                }
            }, 6000);
        }

        function toggleAudio() {
            const audio = document.getElementById('ses1');
            const speaker = document.getElementById('main-speaker');
            
            if(audio) {
                if(audio.paused) {
                    audio.play();
                    isAudioPlaying = true;
                    if(speaker) speaker.classList.add('playing');
                } else {
                    audio.pause();
                    isAudioPlaying = false;
                    if(speaker) speaker.classList.remove('playing');
                }
            }
        }

        function setVar(n, v) { 
            try { 
                parent.GetPlayer().SetVar(n, v); 
                console.log(`Storyline Variable Set: ${n} = ${v}`); 
            } catch(e) { 
                console.log(`(Local) Storyline Variable: ${n} = ${v}`); 
            } 
        }

        function completeTopic() {
            const btn = document.getElementById('btn-complete');
            btn.innerHTML = `TAMAMLANDI ✓`;
            btn.classList.add('completed');
            
            // Storyline Değişkenini Gönder
            setVar('{{STORYLINE_DEGISKENI_ORN_w5}}', true);
        }

        function applyScale() {
            const sc = Math.min(window.innerWidth/960, window.innerHeight/540);
            document.getElementById('scale-container').style.transform = `translate(-50%, -50%) scale(${sc})`;
        }
        
        window.addEventListener('resize', applyScale);
        window.onload = () => {
            applyScale();
            init();
        };
    </script>
</body>
</html>
